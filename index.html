    if (passer.error) return { status: "ambiguous_player", disambiguation: passer.error, summary: `Which player: "${passerRef}"?`, rawInput: raw };
    const defender = defenderRef ? resolveSlot(defenderRef, defenseRoster) : { confidence: 1 };
    if (defender.error) return { status: "ambiguous_player", disambiguation: defender.error, summary: `Which player: "${defenderRef}"?`, rawInput: raw };

    return {
      status: "ok",
      command: { type: "sack", passerId: passer.player?.id, defenderId: defender.player?.id, yards: yards ?? -6 },
      confidence: Math.min(passer.confidence || 1, defender.confidence || 1),
      summary: `Sack for ${yards ?? -6} yards${defender.player ? ` (${defender.player.fullName})` : ""}`,
      rawInput: raw,
    };
  }

  if (/\btackles?\b/i.test(lower) && !/\bintercept/i.test(lower)) {
    const { yards, remainder } = extractYards(text);
    const m = remainder.match(/^(.+?)\s+tackles?\s+(.+)$/i);
    if (m) {
      const tacklerRef = clean(m[1]);
      const rusherRef = clean(m[2]);
      const tackler = resolveSlot(tacklerRef, defenseRoster);
      if (tackler.error) return { status: "ambiguous_player", disambiguation: tackler.error, summary: `Which player: "${tacklerRef}"?`, rawInput: raw };
      const rusher = resolveSlot(rusherRef, offenseRoster);
      if (rusher.error) return { status: "ambiguous_player", disambiguation: rusher.error, summary: `Which player: "${rusherRef}"?`, rawInput: raw };
      if (!rusher.player) return { status: "unresolved_player", summary: `Couldn't identify player "${rusherRef}".`, rawInput: raw };
      return {
        status: "ok",
        command: { type: "run", rusherId: rusher.player.id, yards: yards ?? 0, tacklerIds: tackler.player ? [tackler.player.id] : undefined },
        confidence: Math.min(tackler.confidence || 1, rusher.confidence),
        summary: `${rusher.player.fullName} run for ${yards ?? 0} yards${tackler.player ? ` (tackle: ${tackler.player.fullName})` : ""}`,
        rawInput: raw,
      };
    }
  }

  if (/\bincomplete\b/i.test(lower)) {
    const m = text.match(/^(.+?)\s+incomplete(?:\s+to\s+(.+))?$/i);
    const passerRef = m ? clean(m[1]) : text;
    const receiverRef = m && m[2] ? clean(m[2]) : null;
    const passer = resolveSlot(passerRef, offenseRoster);
    if (passer.error) return { status: "ambiguous_player", disambiguation: passer.error, summary: `Which player: "${passerRef}"?`, rawInput: raw };
    const receiver = receiverRef ? resolveSlot(receiverRef, offenseRoster) : { confidence: 1 };
    if (receiver.error) return { status: "ambiguous_player", disambiguation: receiver.error, summary: `Which player: "${receiverRef}"?`, rawInput: raw };
    return {
      status: "ok",
      command: { type: "pass_incomplete", passerId: passer.player?.id, receiverId: receiver.player?.id, yards: 0 },
      confidence: Math.min(passer.confidence || 1, receiver.confidence || 1),
      summary: `Incomplete pass${passer.player ? ` (${passer.player.fullName})` : ""}`,
      rawInput: raw,
    };
  }

  if (/\bfumbles?\b/i.test(lower)) {
    const m = text.match(/^(.+?)\s+fumbles?\b/i);
    const rusherRef = clean(m ? m[1] : text.replace(/fumbles?/gi, ""));
    const rusher = resolveSlot(rusherRef, offenseRoster);
    if (rusher.error) return { status: "ambiguous_player", disambiguation: rusher.error, summary: `Which player: "${rusherRef}"?`, rawInput: raw };
    if (!rusher.player) return { status: "unresolved_player", summary: `Couldn't identify player "${rusherRef}".`, rawInput: raw };
    return {
      status: "ok",
      command: { type: "fumble", rusherId: rusher.player.id, yards: 0 },
      confidence: Math.min(rusher.confidence, 0.75),
      summary: `Fumble — ${rusher.player.fullName} (recovery not specified, confirm before executing)`,
      rawInput: raw,
    };
  }

  if (
    (/\bto\b/i.test(text) || /\bconnects?\s+with\b/i.test(text) || /\bhits\b/i.test(text)) &&
    !/\bkick(off)?\b/i.test(lower)
  ) {
    let working = text
      .replace(/\bpass(es)?\b/gi, "")
      .replace(/\bcomplete(s|d)?\b/gi, "")
      .replace(/\bconnects?\s+with\b/gi, "to")
      .replace(/\bhits\b/gi, "to")
      .replace(/\b(a|an|the)\b/gi, "")
      .trim();
    const { yards, remainder } = extractYards(working);
    const parts = remainder.split(/\s+to\s+/i);
    if (parts.length === 2 && yards !== null) {
      const passerRef = clean(parts[0]);
      const receiverRef = clean(parts[1]);
      const passer = resolveSlot(passerRef, offenseRoster);
      if (passer.error) return { status: "ambiguous_player", disambiguation: passer.error, summary: `Which player: "${passerRef}"?`, rawInput: raw };
      const receiver = resolveSlot(receiverRef, offenseRoster);
      if (receiver.error) return { status: "ambiguous_player", disambiguation: receiver.error, summary: `Which player: "${receiverRef}"?`, rawInput: raw };
      if (!passer.player || !receiver.player) return { status: "unresolved_player", summary: "Couldn't identify one of the players.", rawInput: raw };
      const touchdownAsserted = /\btouchdown\b|\btd\b/i.test(lower);
      return {
        status: "ok",
        command: { type: "pass_complete", passerId: passer.player.id, receiverId: receiver.player.id, yards, touchdownAsserted },
        confidence: Math.min(passer.confidence, receiver.confidence),
        summary: `${passer.player.fullName} to ${receiver.player.fullName} for ${yards} yards${touchdownAsserted ? " — TOUCHDOWN" : ""}`,
        rawInput: raw,
      };
    }
  }

  if (/\bruns?\b|\brushes?\b|\bloses\b/i.test(lower)) {
    const touchdownAsserted = /\btouchdown\b|\btd\b/i.test(lower);
    let working = text.replace(/\brushes?\b/gi, "runs").replace(/\bruns?\b/gi, "").trim();
    let yards = null;
    if (touchdownAsserted) {
      working = working.replace(/for\s+a\s+touchdown|\btouchdown\b|\btd\b/gi, "").trim();
    } else {
      const extracted = extractYards(working);
      yards = extracted.yards;
      working = extracted.remainder;
    }
    working = working.replace(/^for\s+/i, "").replace(/\bloses\b/gi, "").trim();
    if (/\bloses\b/i.test(lower) && yards !== null) yards = -Math.abs(yards);

    const rusher = resolveSlot(working, offenseRoster);
    if (rusher.error) return { status: "ambiguous_player", disambiguation: rusher.error, summary: `Which player: "${working}"?`, rawInput: raw };
    if (!rusher.player) return { status: "unresolved_player", summary: `Couldn't identify player "${working}".`, rawInput: raw };

    return {
      status: "ok",
      command: { type: "run", rusherId: rusher.player.id, yards: touchdownAsserted ? null : yards ?? 0, touchdownAsserted },
      confidence: rusher.confidence,
      summary: touchdownAsserted ? `${rusher.player.fullName} run — TOUCHDOWN` : `${rusher.player.fullName} run for ${yards ?? 0} yards`,
      rawInput: raw,
    };
  }

  return { status: "unrecognized", summary: `Couldn't understand "${raw}". Try something like "Smith runs for 7" or "Smith to James for 22".`, rawInput: raw };
}

/** Picks readable text color (near-black or white) against an arbitrary
 *  team color background, using standard relative-luminance weighting. */
function textColorFor(hex) {
  const c = hex.replace("#", "");
  const r = parseInt(c.substring(0, 2), 16) || 0;
  const g = parseInt(c.substring(2, 4), 16) || 0;
  const b = parseInt(c.substring(4, 6), 16) || 0;
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.6 ? "#081410" : "#ffffff";
}

const STORAGE_KEY = "gridiron-active-game"; // legacy single-slot key, migrated on load if found

// ============================================================
// PERSISTENCE LAYER — backed by real browser localStorage so saves work
// wherever this app actually runs (your own site/build, not just inside a
// Claude artifact preview, where a `window.storage` API would otherwise be
// required but unavailable). Same get/set/delete/list shape the rest of
// the app expects, so call sites didn't need to change.
// ============================================================
// GitHub Pages project sites (yourname.github.io/RepoA/, .../RepoB/) are all
// the SAME browser origin (yourname.github.io) with different paths, and
// localStorage is scoped to the origin, not the path - so without this,
// every repo/version deployed under one GitHub account would silently
// share one storage bucket, and a brand new deployment would "inherit"
// whatever game a totally different, older deployment last saved. Keying
// everything off the page's own path isolates each deployment completely.
//
// GitHub Pages serves the SAME site at both ".../RepoName/" and
// ".../RepoName/index.html" (and a link without the trailing slash),
// which are different pathnames for the identical page. Without
// normalizing those down to one namespace, opening the site via a
// differently-shaped link than the one you last saved from would make a
// real, successfully-saved game look like it had vanished. Stripping a
// trailing "index.html" and any trailing "/" collapses all of those down
// to the one namespace they actually belong to.
function normalizedStorageNamespace() {
  if (typeof window === "undefined" || !window.location) return "";
  let path = window.location.pathname;
  path = path.replace(/\/index\.html?$/i, "/");
  path = path.replace(/\/+$/, "");
  return path;
}
const STORAGE_NAMESPACE = normalizedStorageNamespace() + "::";

const storage = {
  async get(key) {
    try {
      const value = window.localStorage.getItem(STORAGE_NAMESPACE + key);
      if (value === null) return null;
      return { key, value, shared: false };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(STORAGE_NAMESPACE + key, value);
      return { key, value, shared: false };
    } catch (e) {
      // Most likely quota exceeded (localStorage is ~5-10MB). Surface it so
      // the autosave effect's catch block can show a real failure instead
      // of silently pretending to have saved.
      throw e;
    }
  },
  async delete(key) {
    try {
      window.localStorage.removeItem(STORAGE_NAMESPACE + key);
      return { key, deleted: true, shared: false };
    } catch (e) {
      return null;
    }
  },
  async list(prefix) {
    const keys = [];
    const fullPrefix = STORAGE_NAMESPACE + (prefix || "");
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k != null && k.startsWith(fullPrefix)) keys.push(k.slice(STORAGE_NAMESPACE.length));
    }
    return { keys, prefix, shared: false };
  },
};

const KNOWN_POSITIONS = new Set(["QB", "RB", "FB", "WR", "TE", "OL", "C", "G", "T", "DL", "DE", "DT", "LB", "CB", "S", "DB", "K", "P", "LS", "KR", "PR", "ATH"]);

// Position priority per role, most-likely-first — used only to order the
// button grid; any player can still be selected regardless of position.
const ROLE_POSITION_PRIORITY = {
  rusher: ["RB", "QB", "FB", "WR", "ATH", "TE"],
  passer: ["QB", "ATH", "WR", "RB"],
  receiver: ["WR", "TE", "RB", "FB", "ATH", "QB"],
  defender: ["LB", "CB", "S", "DB", "DL", "DE", "DT", "OL", "OG", "OT", "C", "G", "T"],
  kicker: ["K", "P"],
  punter: ["P", "K"],
  returner: ["KR", "PR", "WR", "RB", "DB", "CB", "ATH"],
};

/** Ranks a roster for a button-picker: whoever was most recently used in
 *  this role comes first (the same RB usually gets most of the carries),
 *  then position relevance, then jersey number as a stable tiebreaker. */
function rankPlayersForRole(roster, role, recentIds) {
  const priority = ROLE_POSITION_PRIORITY[role] || [];
  return [...roster]
    .filter((p) => p.active)
    .sort((a, b) => {
      const ra = recentIds.indexOf(a.id);
      const rb = recentIds.indexOf(b.id);
      if (ra !== -1 || rb !== -1) {
        if (ra === -1) return 1;
        if (rb === -1) return -1;
        if (ra !== rb) return ra - rb;
      }
      const pa = priority.indexOf(a.position);
      const pb = priority.indexOf(b.position);
      const sa = pa === -1 ? priority.length : pa;
      const sb = pb === -1 ? priority.length : pb;
      if (sa !== sb) return sa - sb;
      return a.jerseyNumber - b.jerseyNumber;
    });
}

/**
 * Local, offline parser for pasted roster text. Handles the common shapes
 * people actually paste: tab-separated (from a spreadsheet), comma-
 * separated, or plain "12 John Smith QB" lines. Returns a best-effort
 * guess per line — always shown to the operator to review/edit before
 * committing, never silently trusted.
 */
function parseRosterText(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  return lines.map((line, i) => {
    let tokens;
    if (line.includes("\t")) tokens = line.split("\t").map((t) => t.trim()).filter(Boolean);
    else if (line.includes(",")) tokens = line.split(",").map((t) => t.trim()).filter(Boolean);
    else tokens = line.split(/\s+/).filter(Boolean);

    let jerseyNumber = "";
    let position = "";
    const nameTokens = [];

    for (const t of tokens) {
      const bare = t.replace("#", "");
      if (/^\d{1,3}$/.test(bare) && jerseyNumber === "") {
        jerseyNumber = bare;
      } else if (KNOWN_POSITIONS.has(t.toUpperCase()) && position === "") {
        position = t.toUpperCase();
      } else {
        nameTokens.push(t);
      }
    }

    const firstName = nameTokens.length > 1 ? nameTokens[0] : "";
    const lastName = nameTokens.length > 1 ? nameTokens.slice(1).join(" ") : nameTokens[0] || "";

    return {
      key: `parsed-${i}-${Date.now()}`,
      jerseyNumber,
      firstName,
      lastName,
      position,
      raw: line,
      ok: jerseyNumber !== "" && lastName !== "",
    };
  });
}

/**
 * Screenshot roster import — calls the Anthropic API directly from the
 * artifact (per Claude-in-Claude support) since there's no offline OCR
 * available in a browser artifact. This is a pregame-only convenience;
 * it requires connectivity, unlike the core live-scoring loop which does
 * not and must not depend on it.
 */
async function importRosterFromImage(file) {
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("Could not read image file."));
    reader.readAsDataURL(file);
  });

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 2000,
      messages: [
        {
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: file.type || "image/png", data: base64 } },
            {
              type: "text",
              text:
                "Extract the football roster from this image. Return ONLY a JSON array (no markdown fences, no other text) of objects with fields: jerseyNumber (number), firstName (string), lastName (string), position (standard abbreviation like QB/RB/WR/TE/OL/DL/LB/CB/S/K/P, or empty string if not shown). Omit any row you can't confidently read rather than guessing.",
            },
          ],
        },
      ],
    }),
  });

  if (!response.ok) throw new Error(`API request failed (${response.status})`);
  const data = await response.json();
  const text = data.content
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  const cleaned = text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(cleaned);
  return parsed.map((p, i) => ({
    key: `img-${i}-${Date.now()}`,
    jerseyNumber: String(p.jerseyNumber ?? ""),
    firstName: p.firstName || "",
    lastName: p.lastName || "",
    position: (p.position || "").toUpperCase(),
    raw: `${p.jerseyNumber ?? ""} ${p.firstName ?? ""} ${p.lastName ?? ""} ${p.position ?? ""}`.trim(),
    ok: p.jerseyNumber != null && !!p.lastName,
  }));
}

}

function RosterImportPanel({ team, teamColor, onImportConfirmed }) {
  const [pasteText, setPasteText] = useState("");
  const [previewRows, setPreviewRows] = useState(null);
  const [imgStatus, setImgStatus] = useState("idle"); // idle | loading | error
  const [imgError, setImgError] = useState("");

  function handleParsePaste() {
    if (!pasteText.trim()) return;
    setPreviewRows(parseRosterText(pasteText));
  }

  async function handleImageUpload(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImgStatus("loading");
    setImgError("");
    try {
      const rows = await importRosterFromImage(file);
      setPreviewRows(rows);
      setImgStatus("idle");
    } catch (err) {
      setImgStatus("error");
      setImgError(err.message || "Couldn't read that image.");
    }
    e.target.value = "";
  }

  function updateRow(key, field, value) {
    setPreviewRows((rows) => rows.map((r) => (r.key === key ? { ...r, [field]: value } : r)));
  }
  function removeRow(key) {
    setPreviewRows((rows) => rows.filter((r) => r.key !== key));
  }

  function confirmImport() {
    const valid = previewRows.filter((r) => r.jerseyNumber !== "" && r.lastName.trim() !== "");
    onImportConfirmed(valid);
    setPreviewRows(null);
    setPasteText("");
  }

  return (
    <div style={{ marginTop: 10, marginBottom: 14, border: "1px dashed #2C4A38", borderRadius: 8, padding: 10 }}>
      <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Import roster</div>

      {!previewRows && (
        <>
          <textarea
            value={pasteText}
            onChange={(e) => setPasteText(e.target.value)}
            placeholder={"Paste roster here, one player per line:\n12 John Smith QB\n8 John James WR\n...or tab/comma-separated from a spreadsheet"}
            rows={4}
            style={{ width: "100%", padding: 8, borderRadius: 6, border: "1px solid #2C4A38", background: "#142E21", color: "#EDE8DB", fontSize: 12, fontFamily: "monospace", resize: "vertical" }}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 6, alignItems: "center", flexWrap: "wrap" }}>
            <button
              onClick={handleParsePaste}
              style={{ padding: "6px 14px", borderRadius: 6, border: "none", background: teamColor, color: textColorFor(teamColor), fontWeight: 700, fontSize: 12, cursor: "pointer" }}
            >
              Parse pasted text
            </button>
            <span style={{ color: "#7FA08C", fontSize: 11 }}>or</span>
            <label style={{ padding: "6px 14px", borderRadius: 6, border: "1px solid #2C4A38", color: "#EDE8DB", fontSize: 12, cursor: "pointer" }}>
              {imgStatus === "loading" ? "Reading image…" : "Upload screenshot"}
              <input type="file" accept="image/*" onChange={handleImageUpload} style={{ display: "none" }} disabled={imgStatus === "loading"} />
            </label>
          </div>
          {imgStatus === "error" && <div style={{ color: "#E0483D", fontSize: 11, marginTop: 6 }}>{imgError}</div>}
        </>
      )}

      {previewRows && (
        <>
          <div style={{ fontSize: 11, color: "#9DBBA8", marginBottom: 6 }}>
            Review before adding — fix anything that looks wrong, remove any bad rows.
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4, maxHeight: 220, overflowY: "auto" }}>
            {previewRows.map((r) => (
              <div key={r.key} style={{ display: "flex", gap: 4, alignItems: "center", background: r.ok ? "transparent" : "rgba(193,68,60,0.15)", padding: 3, borderRadius: 4 }}>
                <input value={r.jerseyNumber} onChange={(e) => updateRow(r.key, "jerseyNumber", e.target.value.replace(/\D/g, ""))} placeholder="#" style={{ width: 34, padding: "4px 6px", borderRadius: 4, border: "1px solid #2C4A38", background: "#081410", color: "#EDE8DB", fontSize: 11 }} />
                <input value={r.firstName} onChange={(e) => updateRow(r.key, "firstName", e.target.value)} placeholder="First" style={{ width: 64, padding: "4px 6px", borderRadius: 4, border: "1px solid #2C4A38", background: "#081410", color: "#EDE8DB", fontSize: 11 }} />
                <input value={r.lastName} onChange={(e) => updateRow(r.key, "lastName", e.target.value)} placeholder="Last" style={{ width: 76, padding: "4px 6px", borderRadius: 4, border: "1px solid #2C4A38", background: "#081410", color: "#EDE8DB", fontSize: 11 }} />
                <input value={r.position} onChange={(e) => updateRow(r.key, "position", e.target.value.toUpperCase())} placeholder="Pos" style={{ width: 40, padding: "4px 6px", borderRadius: 4, border: "1px solid #2C4A38", background: "#081410", color: "#EDE8DB", fontSize: 11 }} />
                <span onClick={() => removeRow(r.key)} style={{ color: "#E0483D", fontSize: 11, cursor: "pointer", marginLeft: 2 }}>
                  ✕
                </span>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button onClick={confirmImport} style={{ padding: "6px 14px", borderRadius: 6, border: "none", background: teamColor, color: textColorFor(teamColor), fontWeight: 700, fontSize: 12, cursor: "pointer" }}>
              Add {previewRows.filter((r) => r.jerseyNumber !== "" && r.lastName.trim() !== "").length} players

            <button onClick={() => setPreviewRows(null)} style={{ padding: "6px 14px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: "#9DBBA8", fontSize: 12, cursor: "pointer" }}>
              Cancel

          </div>
        </>
      )}
    </div>
  );

// ============================================================
// NFHS PENALTY TABLE — verified against the 2025 NFHS football rulebook.
// Enforcement model: nearly all fouls here enforce from the PREVIOUS SPOT
// (line of scrimmage), per the 2023 NFHS rule change, rather than tracking
// exact foul location on the field. True spot-foul exceptions (illegal
// kicking/batting, offensive fouls in the end zone with safety
// implications) are NOT modeled here — flagged rather than faked.
//
// autoFirstDown: awarded on acceptance regardless of yardage gained.
// lossOfDown: down still advances even though yardage is assessed
//   (offense-only fouls). NFHS defensive pass interference is a real
//   quirk: 15 yards, but NO automatic first down (unlike NFL/NCAA).
// ============================================================
const PENALTY_INFRACTIONS = [
  // --- Offense, 5 yards ---
  { id: "false_start", label: "False Start", side: "offense", yards: 5, timing: "pre_snap" },
  { id: "delay_of_game", label: "Delay of Game", side: "offense", yards: 5, timing: "pre_snap" },
  { id: "illegal_formation", label: "Illegal Formation", side: "offense", yards: 5, timing: "pre_snap" },
  { id: "illegal_motion", label: "Illegal Motion/Shift", side: "offense", yards: 5, timing: "pre_snap" },
  { id: "too_many_players_off", label: "Too Many Players on Field", side: "offense", yards: 5, timing: "pre_snap" },
  // --- Offense, 5 yards + loss of down ---
  { id: "intentional_grounding", label: "Intentional Grounding", side: "offense", yards: 5, lossOfDown: true, timing: "live_ball" },
  { id: "illegal_forward_pass", label: "Illegal Forward Pass", side: "offense", yards: 5, lossOfDown: true, timing: "live_ball" },
  { id: "illegal_touching", label: "Illegal Touching", side: "offense", yards: 5, lossOfDown: true, timing: "live_ball" },
  // --- Offense, 10 yards ---
  { id: "holding_off", label: "Holding (Offense)", side: "offense", yards: 10, timing: "live_ball", spotFoulBeyondLos: true },
  { id: "illegal_use_of_hands_off", label: "Illegal Use of Hands (Offense)", side: "offense", yards: 10, timing: "live_ball", spotFoulBeyondLos: true },
  { id: "illegal_block_in_back", label: "Illegal Block in the Back", side: "offense", yards: 10, timing: "live_ball", spotFoulBeyondLos: true },
  // --- Offense, 15 yards ---
  { id: "unsportsmanlike_off", label: "Unsportsmanlike Conduct (Offense)", side: "offense", yards: 15, timing: "either" },
  { id: "personal_foul_off", label: "Personal Foul (Offense)", side: "offense", yards: 15, timing: "either" },
  { id: "facemask_off", label: "Facemask (Offense)", side: "offense", yards: 15, timing: "live_ball" },

  // --- Defense, 5 yards ---
  // NFHS (post-2013 rule change): automatic first down is ONLY awarded on
  // the roughing fouls below. Every other defensive foul — including PI,
  // holding, illegal use of hands, targeting, facemask, personal foul, and
  // unsportsmanlike conduct — is enforced yardage only; the down is simply
  // replayed (it becomes a first down only if the yardage naturally gets
  // the offense there).
  { id: "offside", label: "Offside / Encroachment", side: "defense", yards: 5, timing: "pre_snap" },
  { id: "too_many_players_def", label: "Too Many Players on Field", side: "defense", yards: 5, timing: "pre_snap" },
  { id: "running_into_kicker", label: "Running Into the Kicker", side: "defense", yards: 5, timing: "live_ball" },
  // --- Defense, 10 yards ---
  { id: "holding_def", label: "Holding (Defense)", side: "defense", yards: 10, timing: "live_ball" },
  { id: "illegal_use_of_hands_def", label: "Illegal Use of Hands (Defense)", side: "defense", yards: 10, timing: "live_ball" },
  // --- Defense, 15 yards ---
  { id: "pass_interference_def", label: "Pass Interference (Defense)", side: "defense", yards: 15, timing: "live_ball" },
  { id: "roughing_passer", label: "Roughing the Passer", side: "defense", yards: 15, autoFirstDown: true, timing: "live_ball" },
  { id: "roughing_kicker", label: "Roughing the Kicker / Holder / Long Snapper", side: "defense", yards: 15, autoFirstDown: true, timing: "live_ball" },
  { id: "targeting", label: "Targeting / Illegal Helmet Contact", side: "defense", yards: 15, timing: "live_ball" },
  { id: "unsportsmanlike_def", label: "Unsportsmanlike Conduct (Defense)", side: "defense", yards: 15, timing: "either" },
  { id: "personal_foul_def", label: "Personal Foul (Defense)", side: "defense", yards: 15, timing: "either" },
  { id: "facemask_def", label: "Facemask (Defense)", side: "defense", yards: 15, timing: "live_ball" },
];

/** Suggested "where is the ball now" spot after an accepted penalty: the
 *  standard enforcement from the previous spot (half-the-distance cap
 *  applied). Only a starting point - the operator can pick any spot. */
function defaultPenaltyBallSpot(infractionId, penalizedSide, prevSpot, offenseTeam) {
  const infraction = PENALTY_INFRACTIONS.find((i) => i.id === infractionId);
  if (!infraction || prevSpot == null) return null;
  const favorsOffense = penalizedSide === "defense";
  const goalDist = favorsOffense ? yardsToGoal(prevSpot, offenseTeam) : yardsFromOwnGoal(prevSpot, offenseTeam);
  const capped = Math.min(infraction.yards, Math.max(Math.floor(goalDist / 2), 0));
  return advance(prevSpot, offenseTeam, (favorsOffense ? 1 : -1) * capped);
}

function appendPenaltyTailSteps(steps, qe, ctx) {
  steps.push({
    key: "hasPenalty",
    kind: "choice",
    label: "Any penalty on this play?",
    options: [
      { value: true, label: "Yes" },
      { value: false, label: "No" },
    ],
  });
  if (qe.hasPenalty) {
    steps.push({
      key: "penalizedSide",
      kind: "choice",
      label: "Penalty on which team?",
      options: [
        { value: "offense", label: "Offense" },
        { value: "defense", label: "Defense" },
      ],
    });
  }
  if (qe.hasPenalty && qe.penalizedSide) {
    steps.push({ key: "infractionId", kind: "infraction", label: "Infraction?", excludePreSnap: true });
  }
  if (qe.hasPenalty && qe.infractionId) {
    steps.push({ key: "committedBy", kind: "player", role: "foulCommitter", label: "Who committed the foul?", allowSkip: true });
  }
  if (qe.hasPenalty && qe.committedBy !== undefined) {
    steps.push({
      key: "offsetting",
      kind: "choice",
      label: "Did the OTHER team also foul on this play? (offsetting)",
      options: [
        { value: false, label: "No, just this one" },
        { value: true, label: "Yes, offsetting" },
      ],
    });
  }
  if (qe.hasPenalty && qe.offsetting) {
    steps.push({
      key: "offsettingInfractionId",
      kind: "infraction",
      label: `${qe.penalizedSide === "offense" ? "Defense" : "Offense"} infraction?`,
      excludePreSnap: true,
      forceSide: qe.penalizedSide === "offense" ? "defense" : "offense",
    });
  }
  if (qe.hasPenalty && qe.offsetting && qe.offsettingInfractionId) {
    steps.push({
      key: "offsettingCommittedBy",
      kind: "player",
      role: "foulCommitter",
      forceSide: qe.penalizedSide === "offense" ? "defense" : "offense",
      label: `Who committed the ${qe.penalizedSide === "offense" ? "defensive" : "offensive"} foul?`,
      allowSkip: true,
    });
  }
  if (qe.hasPenalty && qe.offsetting === false) {
    steps.push({
      key: "accepted",
      kind: "choice",
      label: "Accepted or declined?",
      options: [
        { value: true, label: "Accept" },
        { value: false, label: "Decline" },
      ],
    });
  }
  if (qe.hasPenalty && qe.offsetting === false && qe.accepted && !ctx.isTurnoverReturn) {
    steps.push({
      key: "ballSpot",
      kind: "fieldspot",
      label: "Where is the ball spotted now?",
      shortLabel: "Where is the ball spotted now (after the penalty)?",
      sublabel: "Down, distance and first down are worked out from this spot. The runner/receiver is credited with whatever positive yardage is left up to it.",
      team: ctx.offenseTeam,
      defaultAbs: defaultPenaltyBallSpot(qe.infractionId, qe.penalizedSide, ctx.fieldPosition, ctx.offenseTeam),
    });
  }
  return steps;
}

function getQuickEntrySteps(playType, qe, ctx) {
  switch (playType) {
    case "safety":
      return [
        {
          key: "confirmed",
          kind: "choice",
          label: "Confirm: offense tackled/ball dead in their own end zone — defense scores a safety (2 points)?",
          options: [{ value: true, label: "Confirm Safety" }],
        },
      ];
    case "kneel":
      return [{ key: "rusher", kind: "player", role: "rusher", label: "Who kneeled?" }];
    case "spike":
      return [{ key: "passer", kind: "player", role: "passer", label: "Who spiked it?" }];
    case "run": {
      const steps = [
        { key: "rusher", kind: "player", role: "rusher", label: "Who ran?" },
        { key: "yards", kind: "yards", label: "Yards", allowTouchdown: true, allowEndSpotEntry: true },
      ];
      if (qe.yards !== undefined && !qe.touchdown && !ctx.quickMode) {
        steps.push({ key: "tackler", kind: "player", role: "defender", label: "How did the play end?", allowSkip: true, noTackleReasons: ["out_of_bounds", "slide"] });
      }
      if (qe.yards !== undefined && !qe.touchdown && !ctx.quickMode && qe.tackler) {
        steps.push({ key: "assistTackler", kind: "player", role: "defender", label: "Assisted by? (optional)", allowSkip: true, excludeId: qe.tackler });
      }
      const runTacklerResolved = qe.touchdown || ctx.quickMode || (qe.tackler !== undefined && (!qe.tackler || qe.assistTackler !== undefined));
      if (qe.yards !== undefined && runTacklerResolved) {
        appendPenaltyTailSteps(steps, qe, ctx);
      }
      return steps;
    }
    case "pass": {
      const steps = [
        { key: "passer", kind: "player", role: "passer", label: "Who threw it?" },
        {
          key: "passResult",
          kind: "choice",
          label: "Result?",
          options: [
            { value: "complete", label: "Complete" },
            { value: "incomplete", label: "Incomplete" },
            { value: "intercepted", label: "Intercepted" },
          ],
        },
      ];
      if (qe.passResult === "complete") {
        steps.push({ key: "receiver", kind: "player", role: "receiver", label: "Who caught it?" });
        steps.push({ key: "yards", kind: "yards", label: "Yards", allowTouchdown: true, allowEndSpotEntry: true });
        if (qe.yards !== undefined && !qe.touchdown && !ctx.quickMode) {
          steps.push({ key: "tackler", kind: "player", role: "defender", label: "How did the play end?", allowSkip: true, noTackleReasons: ["out_of_bounds", "slide"] });
        }
        if (qe.yards !== undefined && !qe.touchdown && !ctx.quickMode && qe.tackler) {
          steps.push({ key: "assistTackler", kind: "player", role: "defender", label: "Assisted by? (optional)", allowSkip: true, excludeId: qe.tackler });
        }
        const passTacklerResolved = qe.touchdown || ctx.quickMode || (qe.tackler !== undefined && (!qe.tackler || qe.assistTackler !== undefined));
        if (qe.yards !== undefined && passTacklerResolved) {
          appendPenaltyTailSteps(steps, qe, ctx);
        }
      } else if (qe.passResult === "incomplete") {
        steps.push({ key: "receiver", kind: "player", role: "receiver", label: "Intended for?", allowSkip: true });
      } else if (qe.passResult === "intercepted") {
        steps.push({ key: "defender", kind: "player", role: "defender", label: "Intercepted by?" });
        steps.push({ key: "turnoverSpot", kind: "fieldspot", label: "Intercepted at what yard line?", team: ctx.offenseTeam });
        steps.push({ key: "yards", kind: "yards", label: "Return yards", allowTouchdown: true, allowSkip: true });
        if (qe.yards !== undefined) {
          appendPenaltyTailSteps(steps, qe, { ...ctx, isTurnoverReturn: true });
        }
      }
      return steps;
    }
    case "sack":
      return [
        { key: "passer", kind: "player", role: "passer", label: "Who was sacked?" },

    case "punt": {

    case "fumble": {

      // without asking this first there'd be no way to credit the
      // carrier's individual rushing/receiving stats for the yards they

    default:
