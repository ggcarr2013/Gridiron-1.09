  const [entryMode, setEntryMode] = useState("buttons"); // "buttons" | "type"
  const [recentPlayers, setRecentPlayers] = useState({ rusher: [], passer: [], receiver: [], defender: [], kicker: [], punter: [] });

  function markPlayerUsed(role, playerId) {
    if (!playerId) return;
    setRecentPlayers((rp) => ({ ...rp, [role]: [playerId, ...(rp[role] || []).filter((id) => id !== playerId)].slice(0, 5) }));
  }
  const [tab, setTab] = useState("enter");
  const [newPlayerDraft, setNewPlayerDraft] = useState({
    HOME: { jersey: "", first: "", last: "", pos: "" },
    AWAY: { jersey: "", first: "", last: "", pos: "" },
  });

  const [fileMenuOpen, setFileMenuOpen] = useState(false);
  const [rosterExpanded, setRosterExpanded] = useState(false);
  const [clockEditorOpen, setClockEditorOpen] = useState(false);
  const [ballCorrectorOpen, setBallCorrectorOpen] = useState(false);
  const [correctorTeam, setCorrectorTeam] = useState(HOME);
  const [correctorSide, setCorrectorSide] = useState("own");
  const [correctorYards, setCorrectorYards] = useState("");
  const [correctorSelectedYard, setCorrectorSelectedYard] = useState(null);
  const [correctorDown, setCorrectorDown] = useState(1);
  const [correctorDistance, setCorrectorDistance] = useState("10");
  const [scoreCorrectorOpen, setScoreCorrectorOpen] = useState(false);
  const [correctorHomeScore, setCorrectorHomeScore] = useState("0");
  const [correctorAwayScore, setCorrectorAwayScore] = useState("0");
  const [clockDraft, setClockDraft] = useState("");
  const [clockPromptReason, setClockPromptReason] = useState(null); // null | "score" | "possession change"
  const [clockPromptTargetPlayId, setClockPromptTargetPlayId] = useState(null);
  const lastClockPromptedPlayId = useRef(null);
  const [showOpenPanel, setShowOpenPanel] = useState(false);
  const [savedGamesList, setSavedGamesList] = useState([]);
  const [showSaveAsInput, setShowSaveAsInput] = useState(false);
  const [saveAsName, setSaveAsName] = useState("");

  const [recoveryNotice, setRecoveryNotice] = useState(null);
  const [exportReminderDismissedAt, setExportReminderDismissedAt] = useState(0);
  const [hasEverExported, setHasEverExported] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const lastIdRes = await storage.get("gridiron-last-game-id", false);
        if (lastIdRes && lastIdRes.value) {
          const id = lastIdRes.value;
          // Read ALL three copies (not just until one parses) and use
          // whichever has the most recent savedAt timestamp. The backup
          // slots update on alternating saves, not simultaneously with the
          // primary, so at any given moment one of them may be genuinely
          // behind - taking the first one that merely parses successfully
          // risks silently recovering stale data instead of the latest.
          const candidateKeys = [
            { key: `gridiron-game:${id}`, label: "main save" },
            { key: `gridiron-game-backup-a:${id}`, label: "1st backup" },
            { key: `gridiron-game-backup-b:${id}`, label: "2nd backup" },
          ];
          const readable = [];
          for (const c of candidateKeys) {
            try {
              const res = await storage.get(c.key, false);
              if (!res || !res.value) continue;
              const saved = JSON.parse(res.value);
              if (!saved || typeof saved !== "object" || !Array.isArray(saved.history)) continue;
              readable.push({ ...c, saved, savedAt: saved.savedAt ? new Date(saved.savedAt).getTime() : 0 });
            } catch (parseErr) {
              continue; // this specific copy is corrupted - others may still be fine
            }
          }
          if (readable.length > 0) {
            readable.sort((a, b) => b.savedAt - a.savedAt);
            const best = readable[0];
            const saved = best.saved;
            setCurrentGameId(id);
            setCurrentGameName(saved.name || "Untitled Game");
            setHistory(saved.history || [[]]);
            setHistoryIndex(saved.historyIndex ?? 0);
            setTeams(saved.teams || DEFAULT_TEAMS);
            setQuarterLengthMinutes(saved.quarterLengthMinutes || 12);
            setGameTitle(saved.gameTitle || "");
            setOpeningReceiver(saved.openingReceiver || HOME);
            setGameStarted(!!saved.gameStarted);
            setLoaded(true);
            if (best.label !== "main save") {
              setRecoveryNotice(
                `Your main save couldn't be read, so this game was recovered from its ${best.label} (the most recent readable copy found). Everything up to your last few plays should be here — double check the Play-by-Play tab.`
              );
            }
            return;
          }
          // Every candidate for this specific game id failed to parse.
          // Don't silently start blank - say so explicitly.
          setRecoveryNotice(
            "Couldn't read your last game or its backups - they may be corrupted. Starting a new game so you're not stuck, but nothing was deleted: check File > Open to see if an older save is still listed."
          );
        }
      } catch (e) {
        // fall through
      }
      try {
        const legacy = await storage.get(STORAGE_KEY, false);
        if (legacy && legacy.value) {
          const saved = JSON.parse(legacy.value);
          setCurrentGameId(generateId());
          setCurrentGameName("Migrated Game");
          setHistory(saved.history || [[]]);
          setHistoryIndex(saved.historyIndex ?? 0);
          setTeams(saved.teams || DEFAULT_TEAMS);
          setGameStarted(true);
          setLoaded(true);
          return;
        }
      } catch (e) {
        // fall through
      }
      setCurrentGameId(generateId());
      setLoaded(true);
    })();
  }, []);

  // ---- Autosave, debounced. Runs continuously once loaded — this is what
  // makes save-less workflow possible; File > Save/Save As are for explicit
  // naming/branching, not required for data to persist.
  //
  // Three layers of protection against ending up with a blank game:
  //   1. Primary save, written every time.
  //   2. Two backup slots, updated on ALTERNATING saves (not simultaneously
  //      with the primary) - so a single interrupted/corrupted write can
  //      only ever affect one of the three copies, never all of them.
  //   3. A real file export exists separately (File menu) for a copy that
  //      survives even a full browser storage wipe. ----
  const backupToggleRef = useRef(false);

  // The actual write. Used by BOTH the debounced autosave effect below AND
  // the explicit File > Save menu item, so "Save" is a real, immediate
  // write and not just a status-text animation.
  async function performSave() {
    if (!currentGameId) return false;
    setSaveStatus("saving");
    try {
      const payload = {
        name: currentGameName,
        savedAt: new Date().toISOString(),
        history,
        historyIndex,
        teams,
        quarterLengthMinutes,
        gameTitle,
        openingReceiver,
        gameStarted,
      };
      const serialized = JSON.stringify(payload);
      await storage.set(`gridiron-game:${currentGameId}`, serialized, false);
      await storage.set("gridiron-last-game-id", currentGameId, false);
      const backupKey = backupToggleRef.current ? `gridiron-game-backup-a:${currentGameId}` : `gridiron-game-backup-b:${currentGameId}`;
      backupToggleRef.current = !backupToggleRef.current;
      await storage.set(backupKey, serialized, false);
      setSaveStatus("saved");
      return true;
    } catch (e) {
      // Surface real failures (e.g. localStorage quota exceeded) instead
      // of silently reporting "idle"/"saved" as if nothing was wrong.
      setSaveStatus("error");
      return false;
    }
  }

  useEffect(() => {
    if (!loaded || !currentGameId) return;
    setSaveStatus("saving");
    const t = setTimeout(() => {
      performSave();
    }, 400);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [history, historyIndex, teams, quarterLengthMinutes, gameTitle, openingReceiver, gameStarted, currentGameName, currentGameId, loaded]);

  const { state, plays } = useMemo(
    () => replay(commands, quarterLengthMinutes, other(openingReceiver)),
    [commands, quarterLengthMinutes, openingReceiver]
  );

  useEffect(() => {
    if (!gameStarted) return;
    const lastPlay = plays[plays.length - 1];
    if (!lastPlay || lastPlay.id === lastClockPromptedPlayId.current) return;

    // PAT/2pt attempts don't get their own prompt — the clock is already
    // stopped from the touchdown that preceded them, so there's no new
    // elapsed time to confirm.
    const isScore = lastPlay.touchdown || (lastPlay.playType === "field_goal" && lastPlay.result === "good");
    const isPossessionChange = lastPlay.turnover || lastPlay.playType === "punt" || lastPlay.playType === "kickoff";

    if (isScore || isPossessionChange) {
      lastClockPromptedPlayId.current = lastPlay.id;
      setClockDraft(lastPlay.clock);
      setClockPromptReason(isScore ? "score" : "possession change");
      setClockPromptTargetPlayId(lastPlay.id);
      setClockEditorOpen(true);
    }
  }, [plays, gameStarted]);
  const drives = useMemo(() => buildDrives(plays), [plays]);
  const homeStats = useMemo(() => computeTeamOffenseStats(plays, HOME), [plays]);
  const awayStats = useMemo(() => computeTeamOffenseStats(plays, AWAY), [plays]);
  const [playerStatsTeam, setPlayerStatsTeam] = useState(HOME);
  const passingTable = useMemo(() => computePassingTable(plays, teams[playerStatsTeam].roster, playerStatsTeam), [plays, playerStatsTeam, teams]);
  const rushingTable = useMemo(() => computeRushingTable(plays, teams[playerStatsTeam].roster, playerStatsTeam), [plays, playerStatsTeam, teams]);
  const receivingTable = useMemo(() => computeReceivingTable(plays, teams[playerStatsTeam].roster, playerStatsTeam), [plays, playerStatsTeam, teams]);
  const defenseTable = useMemo(() => computeDefenseTable(plays, teams[playerStatsTeam].roster, playerStatsTeam), [plays, playerStatsTeam, teams]);
  const kickingTable = useMemo(() => computeKickingTable(plays, teams[playerStatsTeam].roster, playerStatsTeam), [plays, playerStatsTeam, teams]);

  const offenseRoster = teams[state.possession].roster;
  const defenseRoster = teams[other(state.possession)].roster;

  // Box score data — always both teams, independent of the Player Stats tab's toggle
  const passingHome = useMemo(() => computePassingTable(plays, teams.HOME.roster, HOME), [plays, teams]);
  const passingAway = useMemo(() => computePassingTable(plays, teams.AWAY.roster, AWAY), [plays, teams]);
  const rushingHome = useMemo(() => computeRushingTable(plays, teams.HOME.roster, HOME), [plays, teams]);
  const rushingAway = useMemo(() => computeRushingTable(plays, teams.AWAY.roster, AWAY), [plays, teams]);
  const receivingHome = useMemo(() => computeReceivingTable(plays, teams.HOME.roster, HOME), [plays, teams]);
  const receivingAway = useMemo(() => computeReceivingTable(plays, teams.AWAY.roster, AWAY), [plays, teams]);
  const defenseHome = useMemo(() => computeDefenseTable(plays, teams.HOME.roster, HOME), [plays, teams]);
  const defenseAway = useMemo(() => computeDefenseTable(plays, teams.AWAY.roster, AWAY), [plays, teams]);
  const kickingHome = useMemo(() => computeKickingTable(plays, teams.HOME.roster, HOME), [plays, teams]);
  const kickingAway = useMemo(() => computeKickingTable(plays, teams.AWAY.roster, AWAY), [plays, teams]);
  const [copyStatus, setCopyStatus] = useState("idle");

  const canUndo = historyIndex > 0;
  const canRedo = historyIndex < history.length - 1;

  function pushCommands(newCommands) {
    const truncated = history.slice(0, historyIndex + 1);
    const nextHistory = [...truncated, newCommands];
    setHistory(nextHistory);
    setHistoryIndex(nextHistory.length - 1);
    // Export using the data that was JUST computed above, not the
    // component's existing `history`/`historyIndex` - those still hold
    // the pre-commit snapshot at this point in the function (React state
    // updates aren't applied until after this render), so reading them
    // here would silently export a file that's missing the play that
    // triggered it.
    if (currentGameId) {
      // This was previously unguarded - if anything here threw (or if the
      // browser silently refused the download), there was zero visible
      // sign of it. Wrapping it means a real failure at least shows up as
      // "Export failed" instead of nothing happening with no explanation.
      try {
        const payload = {
          name: currentGameName,
          savedAt: new Date().toISOString(),
          history: nextHistory,
          historyIndex: nextHistory.length - 1,
          teams,
          quarterLengthMinutes,
          gameTitle,
          openingReceiver,
          gameStarted,
          exportedFrom: "gridiron-file-export-v1",
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const safeName = (currentGameName || "game").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
        a.href = url;
        a.download = `gridiron-${safeName}-autosave.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setHasEverExported(true);
        setExportStatus("ok");
      } catch (e) {
        setExportStatus("failed");
        setExportFailReason(e && e.message ? e.message : "unknown error");
      }
    }
  }

  function resolveFinalYards(cmd) {
    const isOffenseTouchdownPlay = cmd.type === "run" || cmd.type === "pass_complete" || (cmd.type === "fumble" && cmd.recoveredBy === "offense");
    if (cmd.touchdownAsserted && isOffenseTouchdownPlay) {
      return { ...cmd, yards: yardsToGoal(state.fieldPosition, state.possession) };
    }
    return cmd;
  }

  function commitPenaltyWithPriorAdjustment(cmd, label, adjustment) {
    const adjustedCommands = commands.map((c) => (c.id === adjustment.playId ? { ...c, yards: adjustment.yards } : c));
    const finalCmd = { ...cmd, id: `p${Date.now()}${Math.random()}`, label, rawInput: "[buttons] penalty during previous play" };
    pushCommands([...adjustedCommands, finalCmd]);
    setInputText("");
    setPending(null);
  }

  function commitSequence(commandLabelPairs) {
    const finalCmds = commandLabelPairs.map(({ cmd, label }, i) => ({
      ...cmd,
      id: `p${Date.now()}${i}${Math.random()}`,
      label,
      rawInput: "[buttons] play with inline penalty",
    }));
    pushCommands([...commands, ...finalCmds]);
    setInputText("");
    setPending(null);
  }

  function commitCommand(cmd, rawInput, label) {
    const finalCmd = { ...resolveFinalYards(cmd), id: `p${Date.now()}${Math.random()}`, label, rawInput };
    const newCommands = [...commands, finalCmd];
    pushCommands(newCommands);
    setInputText("");
    setPending(null);
  }

  function handleParse() {
    if (!inputText.trim()) return;
    const result = parsePlayCommand(inputText, offenseRoster, defenseRoster);
    if (result.status === "ok" && fastMode && result.confidence >= 0.9) {
      commitCommand(result.command, result.rawInput, result.summary);
    } else {
      setPending(result);
    }
  }

  function pickDisambiguation(candidatePlayer) {
    const newText = inputText.replace(pending.disambiguation.rawReference, `#${candidatePlayer.jerseyNumber}`);
    setInputText(newText);
    const result = parsePlayCommand(newText, offenseRoster, defenseRoster);
    setPending(result);
  }

  function startEdit(play) {
    setEditingId(play.id);
    setEditYards(String(play.yards));
  }
  function confirmEdit(playId) {
    const yards = parseInt(editYards, 10);
    if (!Number.isFinite(yards)) return;
    pushCommands(commands.map((c) => (c.id === playId ? { ...c, yards } : c)));
    setEditingId(null);
  }
  function deletePlayById(playId) {
    pushCommands(commands.filter((c) => c.id !== playId));
    if (editingId === playId) setEditingId(null);
  }
  function undoAction() {
    if (canUndo) setHistoryIndex(historyIndex - 1);
  }
  function redoAction() {
    if (canRedo) setHistoryIndex(historyIndex + 1);
  }
  function setPossession(team) {
    if (team === state.possession) return;
    pushCommands([
      ...commands,
      {
        type: "set_possession",
        team,
        yards: 0,
        id: `p${Date.now()}${Math.random()}`,
        label: `Possession set to ${teams[team].name}`,
        rawInput: `[manual] give ball to ${team}`,
      },
    ]);
  }

  function correctBallManually(team, fieldPosition, down, distance) {
    const downText = down != null ? `${["", "1st", "2nd", "3rd", "4th"][down]} & ${distance}` : "1st & 10";
    pushCommands([
      ...commands,
      {
        type: "set_possession",
        team,
        fieldPosition,
        down: down != null ? down : undefined,
        distance: distance != null ? distance : undefined,
        yards: 0,
        id: `p${Date.now()}${Math.random()}`,
        label: `Manual correction — ball placed at ${describeFieldPosition(fieldPosition, team)}, ${teams[team].name} ball, ${downText}`,
        rawInput: "[manual] correct ball position",
      },
    ]);
  }

  function correctScoreManually(homeScore, awayScore) {
    pushCommands([
      ...commands,
      {
        type: "set_score",
        homeScore,
        awayScore,
        yards: 0,
        id: `p${Date.now()}${Math.random()}`,
        label: `Manual correction — score set to ${teams.HOME.name} ${homeScore}, ${teams.AWAY.name} ${awayScore}`,
        rawInput: "[manual] correct score",
      },
    ]);
  }

  function setPlayClockOverride(playId, quarter, clock) {
    pushCommands(commands.map((c) => (c.id === playId ? { ...c, quarterOverride: quarter, clockOverride: clock } : c)));
  }

  function startOvertime(team) {
    const nextPeriod = state.quarter >= 5 ? state.quarter + 1 : 5;
    const spot = absoluteFromRelative("opp", 10, team);
    pushCommands([
      ...commands,
      {
        type: "start_overtime",
        team,
        quarter: nextPeriod,
        clock: "0:00",
        fieldPosition: spot,
        yards: 0,
        id: `p${Date.now()}${Math.random()}`,
        label: `Start of ${quarterLabel(nextPeriod)} — ${teams[team].name} ball at the ${describeFieldPosition(spot, team)}`,
        rawInput: "[manual] start overtime",
      },
    ]);
  }

  function setClock(quarter, clock) {
    // Moving into Q3 from Q1/Q2 is the start of the second half — that
    // always comes with a kickoff, by rule the team that did NOT receive
    // the opening kickoff now kicks.
    if (quarter === 3 && state.quarter <= 2) {
      const secondHalfKickingTeam = openingReceiver;
      pushCommands([
        ...commands,
        {
          type: "start_second_half",
          kickingTeam: secondHalfKickingTeam,
          quarter,
          clock,
          yards: 0,
          id: `p${Date.now()}${Math.random()}`,
          label: `Start of 2nd half — ${teams[secondHalfKickingTeam].name} kicks off`,
          rawInput: "[manual] start second half",
        },
      ]);
      return;
    }
    pushCommands([
      ...commands,
      {
        type: "set_clock",
        quarter,
        clock,
        yards: 0,
        id: `p${Date.now()}${Math.random()}`,
        label: `Clock set to Q${quarter}, ${clock}`,
        rawInput: `[manual] set clock`,
      },
    ]);
  }

  function resetPlays() {
    setHistory([[]]);
    setHistoryIndex(0);
    setEditingId(null);
    setPending(null);
    setInputText("");
  }

  function updateTeamName(team, name) {
    setTeams((t) => ({ ...t, [team]: { ...t[team], name } }));
  }
  function updateTeamAbbreviation(team, abbreviation) {
    setTeams((t) => ({ ...t, [team]: { ...t[team], abbreviation } }));
  }
  function updateTeamColor(team, color) {
    setTeams((t) => ({ ...t, [team]: { ...t[team], color } }));
  }
  function addPlayer(team) {
    const draft = newPlayerDraft[team];
    if (!draft.last.trim() || draft.jersey === "") return;
    const newPlayer = {
      id: `${team.toLowerCase()}-${Date.now()}`,
      jerseyNumber: parseInt(draft.jersey, 10),
      firstName: draft.first.trim(),
      lastName: draft.last.trim(),
      fullName: `${draft.first.trim()} ${draft.last.trim()}`.trim(),
      position: draft.pos.trim().toUpperCase() || "—",
      aliases: [],
      active: true,
    };
    setTeams((t) => ({ ...t, [team]: { ...t[team], roster: [...t[team].roster, newPlayer] } }));
    setNewPlayerDraft((d) => ({ ...d, [team]: { jersey: "", first: "", last: "", pos: "" } }));
  }
  function removePlayer(team, playerId) {
    setTeams((t) => ({ ...t, [team]: { ...t[team], roster: t[team].roster.filter((p) => p.id !== playerId) } }));
  }
  function importPlayers(team, rows) {
    const newPlayers = rows.map((r, i) => ({
      id: `${team.toLowerCase()}-imp-${Date.now()}-${i}`,
      jerseyNumber: parseInt(r.jerseyNumber, 10),
      firstName: r.firstName.trim(),
      lastName: r.lastName.trim(),
      fullName: `${r.firstName.trim()} ${r.lastName.trim()}`.trim(),
      position: (r.position || "—").toUpperCase(),
      aliases: [],
      active: true,
    }));
    setTeams((t) => ({ ...t, [team]: { ...t[team], roster: [...t[team].roster, ...newPlayers] } }));
  }

  function loadSavedRoster(team, entry) {
    // Plays already logged point at player ids; swapping the roster out
    // mid-game would orphan their stats.
    const hasPlaysLogged = commands.some((c) => c.type !== "set_possession" && c.type !== "set_clock" && c.type !== "set_score");
    if (hasPlaysLogged && !window.confirm("This game already has plays logged. Loading a saved roster replaces every player, so earlier plays will lose their player names/stats. Load it anyway?")) return;
    const stamp = Date.now();
    const players = entry.players.map((r, i) => ({
      id: `${team.toLowerCase()}-sv-${stamp}-${i}`,
      jerseyNumber: r.jerseyNumber,
      firstName: r.firstName,
      lastName: r.lastName,
      fullName: r.fullName || `${r.firstName} ${r.lastName}`.trim(),
      position: r.position || "—",
      aliases: r.aliases || [],
      active: r.active !== false,
    }));
    setTeams((t) => ({
      ...t,
      [team]: { ...t[team], name: entry.name, abbreviation: entry.abbreviation || t[team].abbreviation, color: entry.color || t[team].color, roster: players },
    }));
  }

  // ---- File menu actions ----
  function handleNewGame() {
    // A single mis-tap on this (e.g. reaching for something else in the
    // File menu mid-game) used to wipe the entire in-progress game
    // instantly, with no way back. Once there's actually a game in
    // progress, require a real confirmation before it's gone.
    const hasPlaysLogged = commands.some((c) => c.type !== "set_possession" && c.type !== "set_clock" && c.type !== "set_score");
    if (hasPlaysLogged) {
      const ok = window.confirm("Start a brand new game? This clears everything currently on screen - the game you're replacing is still saved and reachable from File > Open if you change your mind.");
      if (!ok) return;
    }
    setCurrentGameId(generateId());
    setCurrentGameName("New Game");
    setHistory([[]]);
    setHistoryIndex(0);
    setTeams(DEFAULT_TEAMS);
    setQuarterLengthMinutes(12);
    setOpeningReceiver(HOME);
    setGameStarted(false);
    setFileMenuOpen(false);
    setShowOpenPanel(false);
  }

  function handleExportToFile() {
    const payload = {
      name: currentGameName,
      savedAt: new Date().toISOString(),
      history,
      historyIndex,
      teams,
      quarterLengthMinutes,
      gameTitle,
      openingReceiver,
      gameStarted,
      exportedFrom: "gridiron-file-export-v1",
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (currentGameName || "game").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
    const dateStamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `gridiron-${safeName}-${dateStamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setFileMenuOpen(false);
    setHasEverExported(true);
  }

  function handleImportFromFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const saved = JSON.parse(reader.result);
        if (!saved || typeof saved !== "object" || !Array.isArray(saved.history)) {
          setRecoveryNotice("That file doesn't look like a Gridiron backup - nothing was changed.");
          return;
        }
        // Imports as a NEW game, never overwriting whatever is currently
        // open - safest possible behavior for a recovery action.
        setCurrentGameId(generateId());
        setCurrentGameName((saved.name || "Imported Game") + " (imported)");
        setHistory(saved.history);
        setHistoryIndex(saved.historyIndex ?? saved.history.length - 1);
        setTeams(saved.teams || DEFAULT_TEAMS);
        setQuarterLengthMinutes(saved.quarterLengthMinutes || 12);
        setGameTitle(saved.gameTitle || "");
        setOpeningReceiver(saved.openingReceiver || HOME);
        setGameStarted(!!saved.gameStarted);
        setRecoveryNotice("Backup file imported as a new game - your previously open game is untouched and still saved under its own name.");
      } catch (err) {
        setRecoveryNotice("Couldn't read that file - it may not be a valid Gridiron backup. Nothing was changed.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
    setFileMenuOpen(false);
  }

  async function openSavedGamesPanel() {
    setShowOpenPanel(true);
    try {
      const listRes = await storage.list("gridiron-game:", false);
      const keys = (listRes && listRes.keys) || [];
      const games = [];
      for (const key of keys) {
        try {
          const res = await storage.get(key, false);
          if (res && res.value) {
            const saved = JSON.parse(res.value);
            games.push({ id: key.replace("gridiron-game:", ""), name: saved.name || "Untitled Game", savedAt: saved.savedAt });
          }
        } catch (e) {
          // skip unreadable entries
        }
      }
      games.sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));
      setSavedGamesList(games);
    } catch (e) {
      setSavedGamesList([]);
    }
  }

  async function handleOpenGame(id) {
    try {
      const res = await storage.get(`gridiron-game:${id}`, false);
      if (res && res.value) {
        const saved = JSON.parse(res.value);
        setCurrentGameId(id);
        setCurrentGameName(saved.name || "Untitled Game");
        setHistory(saved.history || [[]]);
        setHistoryIndex(saved.historyIndex ?? 0);
        setTeams(saved.teams || DEFAULT_TEAMS);
        setQuarterLengthMinutes(saved.quarterLengthMinutes || 12);
        setGameTitle(saved.gameTitle || "");
            setOpeningReceiver(saved.openingReceiver || HOME);
        setGameStarted(!!saved.gameStarted);
      }
    } catch (e) {
      // ignore
    }
    setFileMenuOpen(false);
    setShowOpenPanel(false);
  }

  async function handleDeleteGame(id, e) {
    e.stopPropagation();
    try {
      await storage.delete(`gridiron-game:${id}`, false);
    } catch (err) {
      // ignore
    }
    setSavedGamesList((list) => list.filter((g) => g.id !== id));
    if (id === currentGameId) handleNewGame();
  }

  async function handleSaveAs() {
    if (!saveAsName.trim()) return;
    const newId = generateId();
    const newName = saveAsName.trim();
    // Write under the NEW id immediately, rather than just changing state
    // and waiting on the debounced autosave effect to notice — closing the
    // tab in that ~400ms gap would otherwise leave the new branch
    // unsaved. The original game, still under its own id, is untouched.
    setSaveStatus("saving");
    try {
      const payload = {
        name: newName,
        savedAt: new Date().toISOString(),
        history,
        historyIndex,
        teams,
        quarterLengthMinutes,
        gameTitle,
        openingReceiver,
        gameStarted,
      };
      const serialized = JSON.stringify(payload);
      await storage.set(`gridiron-game:${newId}`, serialized, false);
      await storage.set("gridiron-last-game-id", newId, false);
      setSaveStatus("saved");
    } catch (e) {
      setSaveStatus("error");
    }
    setCurrentGameId(newId);
    setCurrentGameName(newName);
    setShowSaveAsInput(false);
    setSaveAsName("");
    setFileMenuOpen(false);
  }

  const newspaperRecap = useMemo(

  );

      setTimeout(() => setCopyStatus("idle"), 2000);

    }
  }

  /** Plain-text, column-aligned table - readable when pasted into a text
   *  message, email, or spreadsheet cell, not just on screen. */
  function formatStatTableText(title, columns, rows, teamRow) {
    const allRows = teamRow ? [...rows, teamRow] : rows;
    if (allRows.length === 0) return `${title}\n(no stats yet)`;
    const widths = columns.map((c, i) => Math.max(String(c).length, ...allRows.map((r) => String(r[i]).length)));
    const padRow = (r) => r.map((cell, i) => (i === 0 ? String(cell).padEnd(widths[i]) : String(cell).padStart(widths[i]))).join("  ");
    const lines = [title.toUpperCase(), padRow(columns), ...rows.map(padRow)];
    if (teamRow) lines.push(padRow(teamRow));
    return lines.join("\n");
  }

  const scoreboardFont = { fontFamily: "'SF Mono', 'Roboto Mono', 'IBM Plex Mono', Consolas, monospace", fontVariantNumeric: "tabular-nums" };

          </div>

          {showSaveAsInput && (
            <div style={{ padding: 8, borderTop: "1px solid #2C4A38", marginTop: 4 }}>
              <input
                value={saveAsName}
                onChange={(e) => setSaveAsName(e.target.value)}
                placeholder="Game name"
                style={{ width: "100%", padding: "6px 8px", borderRadius: 4, border: "1px solid #2C4A38", background: "#081410", color: "#EDE8DB", fontSize: 12, marginBottom: 6 }}
                autoFocus
              />
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={handleSaveAs} style={{ flex: 1, padding: "6px", borderRadius: 4, border: "none", background: "#F5B700", color: "#081410", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>
                  Save
                </button>
                <button onClick={() => setShowSaveAsInput(false)} style={{ flex: 1, padding: "6px", borderRadius: 4, border: "1px solid #2C4A38", background: "transparent", color: "#9DBBA8", fontSize: 12, cursor: "pointer" }}>
                  Cancel
                </button>
              </div>
            </div>
          )}

          {showOpenPanel && (
            <div style={{ padding: 8, borderTop: "1px solid #2C4A38", marginTop: 4, maxHeight: 240, overflowY: "auto" }}>
              {savedGamesList.length === 0 && <div style={{ fontSize: 12, color: "#7FA08C", padding: 4 }}>No saved games found.</div>}
              {savedGamesList.map((g) => (
                <div
                  key={g.id}
                  onClick={() => handleOpenGame(g.id)}
                  style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 4px", fontSize: 12, cursor: "pointer", borderRadius: 4, background: g.id === currentGameId ? "#1C3A28" : "transparent" }}
                >
                  <span>
                    {g.name}
                    <br />
                    <span style={{ color: "#7FA08C", fontSize: 10 }}>{g.savedAt ? new Date(g.savedAt).toLocaleString() : ""}</span>
                  </span>
                  <span onClick={(e) => handleDeleteGame(g.id, e)} style={{ color: "#E0483D", fontSize: 11 }}>
                    delete
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );

  if (!gameStarted) {
    return (
      <div style={{ minHeight: "100vh", background: "#081410", color: "#EDE8DB", fontFamily: "-apple-system, Helvetica, Arial, sans-serif", paddingBottom: 40 }}>
        <div style={{ padding: "16px 14px", borderBottom: "2px solid #1C3A28", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          {FileMenu}
          <div style={{ fontSize: 10, color: "#5C7A68" }}>{saveStatus === "saving" ? "Saving…" : saveStatus === "error" ? "Save failed ⚠" : "Saved ✓"}</div>
        </div>

        <div style={{ padding: "20px 14px" }}>
          <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Game Setup</div>
          <div style={{ fontSize: 13, color: "#7FA08C", marginBottom: 20 }}>
            Set up both teams, then start the game. You can still edit rosters later from the Setup tab.
          </div>

          <div style={{ marginBottom: 20 }}>
            <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Game Title (optional)</div>
            <input
              value={gameTitle}
              onChange={(e) => setGameTitle(e.target.value)}
              placeholder="e.g. District 4 Class AAA Championship"
              style={{ width: "100%", padding: "8px 10px", borderRadius: 6, border: "1px solid #2C4A38", background: "#142E21", color: "#EDE8DB", fontSize: 13 }}
            />
          </div>

          <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Quarter Length</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {QUARTER_LENGTH_PRESETS.map((p) => (
                <button
                  key={p.value}
                  onClick={() => setQuarterLengthMinutes(p.value)}
                  style={{
                    padding: "8px 12px",
                    borderRadius: 6,
                    border: "1px solid #2C4A38",
                    background: quarterLengthMinutes === p.value ? "#F5B700" : "transparent",
                    color: quarterLengthMinutes === p.value ? "#081410" : "#9DBBA8",
                    fontWeight: 700,
                    fontSize: 12,
                    cursor: "pointer",
                  }}
                >
                  {p.label}
                </button>
              ))}
            </div>
          </div>

          <TeamEditor
            team={HOME}
            teamData={teams.HOME}
            onUpdateName={updateTeamName}
            onUpdateAbbreviation={updateTeamAbbreviation}
            onUpdateColor={updateTeamColor}
            draft={newPlayerDraft.HOME}
            onDraftChange={(team, d) => setNewPlayerDraft((prev) => ({ ...prev, [team]: d }))}
            onAddPlayer={addPlayer}
            onRemovePlayer={removePlayer}
            onImportConfirmed={importPlayers}
            onLoadRoster={loadSavedRoster}
          />
          <TeamEditor
            team={AWAY}
            teamData={teams.AWAY}
            onUpdateName={updateTeamName}
            onUpdateAbbreviation={updateTeamAbbreviation}
            onUpdateColor={updateTeamColor}
            draft={newPlayerDraft.AWAY}
            onDraftChange={(team, d) => setNewPlayerDraft((prev) => ({ ...prev, [team]: d }))}
            onAddPlayer={addPlayer}
            onRemovePlayer={removePlayer}
            onImportConfirmed={importPlayers}
            onLoadRoster={loadSavedRoster}
          />

          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Opening Kickoff — Who Receives?</div>
            <div style={{ display: "flex", gap: 8 }}>
              {[HOME, AWAY].map((t) => (
                <button
                  key={t}
                  onClick={() => setOpeningReceiver(t)}
                  style={{
                    flex: 1,
                    padding: "10px",
                    borderRadius: 6,
                    border: `1px solid ${teams[t].color}`,
                    background: openingReceiver === t ? teams[t].color : "transparent",
                    color: openingReceiver === t ? textColorFor(teams[t].color) : teams[t].color,
                    fontWeight: 700,
                    fontSize: 13,
                    cursor: "pointer",
                  }}
                >
                  {teams[t].name}
                </button>
              ))}
            </div>
          </div>

          <button
            onClick={() => setGameStarted(true)}
            style={{ width: "100%", padding: 14, borderRadius: 8, border: "none", background: "#F5B700", color: "#081410", fontWeight: 700, fontSize: 15, cursor: "pointer", marginTop: 10 }}
          >
            Start Game →
          </button>
          <div style={{ fontSize: 11, color: "#5C7A68", marginTop: 8, lineHeight: 1.6 }}>
            The game starts just before the opening kickoff — go to Enter Play and tap "Kickoff" to record what
            actually happens (touchback, return, etc.). Rosters don't need to be complete to start — you can add
            players any time from the Setup tab.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#081410", color: "#EDE8DB", fontFamily: "-apple-system, Helvetica, Arial, sans-serif", paddingBottom: 40 }}>
      {clockEditorOpen && clockPromptReason && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.75)",
            zIndex: 1000,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 20,
          }}
        >
          <div style={{ background: "#0F241A", border: "2px solid #F5B700", borderRadius: 12, padding: 20, width: "100%", maxWidth: 340 }}>
            <div style={{ fontSize: 15, color: "#F5B700", fontWeight: 700, marginBottom: 4 }}>
              {clockPromptReason === "score" ? "Score!" : "Possession change"}
            </div>
            <div style={{ fontSize: 13, color: "#EDE8DB", marginBottom: 16 }}>What did the clock read when the play ended?</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
              <input
                value={clockDraft}
                onChange={(e) => setClockDraft(e.target.value)}
                placeholder="12:00"
                autoFocus
                style={{ flex: 1, padding: "12px", borderRadius: 6, border: "1px solid #2C4A38", background: "#142E21", color: "#EDE8DB", fontSize: 16, ...scoreboardFont }}
              />
            </div>
            <button
              onClick={() => {
                if (/^\d{1,2}:\d{2}$/.test(clockDraft.trim())) {
                  setPlayClockOverride(clockPromptTargetPlayId, state.quarter, clockDraft.trim());
                  setClockEditorOpen(false);
                  setClockPromptReason(null);
                  setClockPromptTargetPlayId(null);
                }
              }}
              style={{ width: "100%", padding: 12, borderRadius: 8, border: "none", background: "#F5B700", color: "#081410", fontWeight: 700, fontSize: 14, cursor: "pointer", marginBottom: 8 }}
            >
              Set Time
            </button>
            <button
              onClick={() => {
                setClockEditorOpen(false);
                setClockPromptReason(null);
                setClockPromptTargetPlayId(null);
              }}
              style={{ width: "100%", padding: 10, borderRadius: 8, border: "1px solid #2C4A38", background: "transparent", color: "#7FA08C", fontSize: 13, cursor: "pointer" }}
            >
              Skip (don't correct this play's time)
            </button>
          </div>
        </div>
      )}

      {gameStarted && !hasEverExported && plays.length >= 15 && plays.length - exportReminderDismissedAt >= 15 && (
        <div style={{ padding: "10px 16px", background: "rgba(245,183,0,0.1)", borderBottom: "1px solid #F5B700" }}>
          <div style={{ fontSize: 12, color: "#EDE8DB", marginBottom: 6 }}>
            💾 You've got a real game going — worth exporting a backup file now, just in case. Takes one tap.
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={handleExportToFile} style={{ padding: "6px 14px", borderRadius: 6, border: "none", background: "#F5B700", color: "#081410", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>
              Export Now
            </button>
            <button
              onClick={() => setExportReminderDismissedAt(plays.length)}
              style={{ padding: "6px 14px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: "#7FA08C", fontSize: 12, cursor: "pointer" }}
            >
              Remind me later
            </button>
          </div>
        </div>
      )}

      {recoveryNotice && (
        <div style={{ padding: "12px 16px", background: "rgba(224,72,61,0.15)", borderBottom: "2px solid #E0483D" }}>
          <div style={{ fontSize: 12, color: "#EDE8DB", lineHeight: 1.5, marginBottom: 8 }}>⚠️ {recoveryNotice}</div>
          <button
            onClick={() => setRecoveryNotice(null)}
            style={{ padding: "6px 14px", borderRadius: 6, border: "1px solid #E0483D", background: "transparent", color: "#E0483D", fontSize: 12, fontWeight: 700, cursor: "pointer" }}
          >
            Dismiss
          </button>
        </div>
      )}

      <div style={{ padding: "18px 16px 14px", borderBottom: "2px solid #1C3A28" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          {FileMenu}
          <div style={{ fontSize: 10, color: "#5C7A68", letterSpacing: 0.5 }}>{saveStatus === "saving" ? "Saving…" : saveStatus === "error" ? "Save failed \u26A0" : "Saved \u2713"}</div>
          {exportStatus !== "idle" && (
            <div style={{ fontSize: 10, color: exportStatus === "failed" ? "#e05c5c" : "#5C7A68", letterSpacing: 0.5 }} title={exportFailReason}>
              {exportStatus === "failed" ? "Export failed \u26A0" : "Exported \u2713"}
            </div>
          )}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: 1.5, color: "#7FA08C", textTransform: "uppercase", marginBottom: 2 }}>{teams.HOME.name}</div>
            <div
              style={{
                fontSize: 42,
                fontWeight: 700,
                color: state.possession === HOME ? teams.HOME.color : "#EDE8DB",
                textShadow: state.possession === HOME ? `0 0 18px ${teams.HOME.color}99, 0 0 36px ${teams.HOME.color}44` : "none",
                transition: "color 300ms ease, text-shadow 300ms ease",
                ...scoreboardFont,
                lineHeight: 1,
              }}
            >
              {state.homeScore}
            </div>
          </div>
          <div style={{ textAlign: "center", cursor: "pointer" }} onClick={() => { setClockDraft(state.clock); setClockPromptReason(null); setClockPromptTargetPlayId(null); setClockEditorOpen((o) => !o); }}>
            <div style={{ fontSize: 11, color: "#7FA08C", letterSpacing: 1.5 }}>{quarterLabel(state.quarter)}</div>
            <div style={{ fontSize: 21, ...scoreboardFont, color: "#EDE8DB", letterSpacing: 0.5 }}>{state.clock}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 11, letterSpacing: 1.5, color: "#7FA08C", textTransform: "uppercase", marginBottom: 2 }}>{teams.AWAY.name}</div>
            <div
              style={{
                fontSize: 42,
                fontWeight: 700,
                color: state.possession === AWAY ? teams.AWAY.color : "#EDE8DB",
                textShadow: state.possession === AWAY ? `0 0 18px ${teams.AWAY.color}99, 0 0 36px ${teams.AWAY.color}44` : "none",
                transition: "color 300ms ease, text-shadow 300ms ease",
                ...scoreboardFont,
                lineHeight: 1,
              }}
            >
              {state.awayScore}
            </div>
          </div>
        </div>

        {clockEditorOpen && !clockPromptReason && (
          <div style={{ marginTop: 10, background: "#0F241A", border: "1px solid #2C4A38", borderRadius: 8, padding: 10 }}>
            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Quarter</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              {[1, 2, 3, 4].map((q) => (
                <button
                  key={q}
                  onClick={() => setClock(q, state.clock)}
                  style={{
                    flex: 1,
                    padding: "8px",
                    borderRadius: 6,
                    border: "1px solid #2C4A38",
                    background: state.quarter === q ? "#F5B700" : "transparent",
                    color: state.quarter === q ? "#081410" : "#9DBBA8",
                    fontWeight: 700,
                    fontSize: 13,
                    cursor: "pointer",
                  }}
                >
                  Q{q}
                </button>
              ))}
              <button
                onClick={() => setClock(state.quarter + 1, `${quarterLengthMinutes}:00`)}
                style={{ flex: 1, padding: "8px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: "#9DBBA8", fontWeight: 700, fontSize: 13, cursor: "pointer" }}
              >
                OT
              </button>
            </div>
            <button
              onClick={() => setClock(state.quarter + 1, `${quarterLengthMinutes}:00`)}
              style={{ width: "100%", padding: "8px", borderRadius: 6, border: "1px solid #F5B700", background: "transparent", color: "#F5B700", fontWeight: 700, fontSize: 12, cursor: "pointer", marginBottom: 10 }}
            >
              End Quarter → Q{state.quarter + 1}, {quarterLengthMinutes}:00
            </button>
            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Clock (MM:SS)</div>
            <div style={{ display: "flex", gap: 6 }}>
              <input
                value={clockDraft}
                onChange={(e) => setClockDraft(e.target.value)}
                placeholder="12:00"
                style={{ flex: 1, padding: "8px", borderRadius: 6, border: "1px solid #2C4A38", background: "#142E21", color: "#EDE8DB", fontSize: 13, ...scoreboardFont }}
              />
              <button
                onClick={() => {
                  if (/^\d{1,2}:\d{2}$/.test(clockDraft.trim())) {
                    setClock(state.quarter, clockDraft.trim());
                    setClockEditorOpen(false);
                  }
                }}
                style={{ padding: "8px 16px", borderRadius: 6, border: "none", background: "#F5B700", color: "#081410", fontWeight: 700, fontSize: 12, cursor: "pointer" }}
              >
                Set
              </button>
              <button
                onClick={() => setClockEditorOpen(false)}
                style={{ padding: "8px 14px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: "#7FA08C", fontSize: 12, cursor: "pointer" }}
              >
                Close
              </button>
            </div>
          </div>
        )}

        <div style={{ marginTop: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: 22, fontWeight: 600, ...scoreboardFont }}>
            {state.down != null ? <><DownLabel down={state.down} /> &amp; {state.distance}</> : "—"}
          </div>
          <div style={{ fontSize: 14, color: "#9DBBA8", ...scoreboardFont }}>
            {describeFieldPosition(state.fieldPosition, state.possession)} · {teams[state.possession].name} ball
          </div>
        </div>

        <div style={{ marginTop: 10 }}>
          <FieldStrip
            fieldPosition={state.fieldPosition}
            possession={state.possession}
            homeColor={teams.HOME.color}
            awayColor={teams.AWAY.color}
            homeName={teams.HOME.name.toUpperCase()}
            awayName={teams.AWAY.name.toUpperCase()}
          />
        </div>

        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <button
            onClick={() => setPossession(other(state.possession))}
            style={{
              flex: 1,
              padding: "8px",
              borderRadius: 6,
              border: "1px solid #F5B700",
              background: "transparent",
              color: "#F5B700",
              fontSize: 12,
              fontWeight: 700,
              cursor: "pointer",
            }}
          >
            ⇄ Give ball to {teams[other(state.possession)].name}
          </button>
          <button
            onClick={() => setClock(state.quarter + 1, `${quarterLengthMinutes}:00`)}
            style={{
              flex: 1,
              padding: "8px",
              borderRadius: 6,
              border: "1px solid #4aa3f2",
              background: "transparent",
              color: "#4aa3f2",
              fontSize: 12,
              fontWeight: 700,
              cursor: "pointer",
            }}
          >
            Advance Quarter → Q{state.quarter + 1}
          </button>
        </div>

        <button
          onClick={() => {
            // Default every field to where the ball ACTUALLY is right now,
            // not a hardcoded guess - this panel is for fixing mistakes,
            // so it should open already showing reality, not "possession
            // team, own side, blank yard" regardless of the real spot.
            const { side, yard } = relativeFromAbsolute(state.fieldPosition, state.possession);
            setCorrectorTeam(state.possession);
            setCorrectorSide(side);
            setCorrectorYards(String(yard));
            setCorrectorSelectedYard(null);
            setCorrectorDown(state.down || 1);
            setCorrectorDistance(String(state.distance || 10));
            setBallCorrectorOpen((o) => !o);
          }}
          style={{
            width: "100%",
            marginTop: 8,
            padding: "8px",
            borderRadius: 6,
            border: "1px solid #E0483D",
            background: "transparent",
            color: "#E0483D",
            fontSize: 12,
            fontWeight: 700,
            cursor: "pointer",
          }}
        >
          🔧 Correct Ball Position / Team
        </button>

        {ballCorrectorOpen && (
          <div style={{ marginTop: 8, background: "#0F241A", border: "1px solid #E0483D", borderRadius: 8, padding: 10 }}>
            <div style={{ fontSize: 11, color: "#9DBBA8", marginBottom: 8, lineHeight: 1.4 }}>
              Use this any time to directly fix the ball's team, spot, down, and distance — for correcting a mistake, not for a real play.
            </div>
            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Team</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              {[HOME, AWAY].map((t) => (
                <button
                  key={t}
                  onClick={() => setCorrectorTeam(t)}
                  style={{
                    flex: 1,
                    padding: "10px",
                    borderRadius: 6,
                    border: `1px solid ${teams[t].color}`,
                    background: correctorTeam === t ? teams[t].color : "transparent",
                    color: correctorTeam === t ? textColorFor(teams[t].color) : teams[t].color,
                    fontWeight: 700,
                    fontSize: 13,
                    cursor: "pointer",
                  }}
                >
                  {teams[t].name}
                </button>
              ))}
            </div>
            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Yard Line</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button
                onClick={() => setCorrectorSide("own")}
                style={{
                  flex: 1,
                  padding: "10px",
                  borderRadius: 6,
                  border: "1px solid #2C4A38",
                  background: correctorSide === "own" ? "#F5B700" : "transparent",
                  color: correctorSide === "own" ? "#081410" : "#EDE8DB",
                  fontWeight: 700,
                  fontSize: 13,
                  cursor: "pointer",
                }}
              >
                {teams[correctorTeam]?.name || "OWN"} side
              </button>
              <button
                onClick={() => setCorrectorSide("opp")}
                style={{
                  flex: 1,
                  padding: "10px",
                  borderRadius: 6,
                  border: "1px solid #2C4A38",
                  background: correctorSide === "opp" ? "#F5B700" : "transparent",
                  color: correctorSide === "opp" ? "#081410" : "#EDE8DB",
                  fontWeight: 700,
                  fontSize: 13,
                  cursor: "pointer",
                }}
              >
                {teams[other(correctorTeam)]?.name || "OPP"} side
              </button>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
              {[5, 10, 15, 20, 25, 30, 35, 40, 45, 50].map((y) => (
                <button
                  key={y}
                  onClick={() => {
                    setCorrectorSelectedYard(y);
                    setCorrectorYards("");
                  }}
                  style={{
                    width: "calc(20% - 5px)",
                    padding: "10px 2px",
                    borderRadius: 6,
                    border: correctorSelectedYard === y ? "1px solid #F5B700" : "1px solid #2C4A38",
                    background: correctorSelectedYard === y ? "#F5B700" : "#142E21",
                    color: correctorSelectedYard === y ? "#081410" : "#EDE8DB",
                    fontWeight: 700,
                    fontSize: 13,
                    cursor: "pointer",
                  }}
                >
                  {y}
                </button>
              ))}
            </div>
            <input
              type="number"
              value={correctorYards}
              onChange={(e) => {
                setCorrectorYards(e.target.value);
                setCorrectorSelectedYard(null);
              }}
              placeholder="Or type a yard # (0-50)"
              min="0"
              max="50"
              style={{
                width: "100%",
                padding: "10px",
                borderRadius: 6,
                border: "1px solid #2C4A38",
                background: "#142E21",
                color: "#EDE8DB",
                fontSize: 14,
                marginBottom: 14,
                boxSizing: "border-box",
              }}
            />

            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Down</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              {[1, 2, 3, 4].map((d) => (
                <button
                  key={d}
                  onClick={() => setCorrectorDown(d)}
                  style={{
                    flex: 1,
                    padding: "10px",
                    borderRadius: 6,
                    border: "1px solid #2C4A38",
                    background: correctorDown === d ? "#F5B700" : "transparent",
                    color: correctorDown === d ? "#081410" : "#EDE8DB",
                    fontWeight: 700,
                    fontSize: 13,
                    cursor: "pointer",
                  }}
                >
                  {["", "1st", "2nd", "3rd", "4th"][d]}
                </button>
              ))}
            </div>

            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Distance to go</div>
            <input
              type="number"
              value={correctorDistance}
              onChange={(e) => setCorrectorDistance(e.target.value)}
              placeholder="Yards to go"
              min="0"
              max="99"
              style={{
                width: "100%",
                padding: "10px",
                borderRadius: 6,
                border: "1px solid #2C4A38",

                  if (y == null || y < 0 || y > 50) return;
                  const dist = parseInt(correctorDistance, 10);
                  correctBallManually(correctorTeam, absoluteFromRelative(correctorSide, y, correctorTeam), correctorDown, Number.isFinite(dist) ? dist : 10);
                  setBallCorrectorOpen(false);
                }}
                style={{ flex: 1, padding: "12px 18px", borderRadius: 6, border: "none", background: "#F5B700", color: "#081410", fontWeight: 700, fontSize: 14, cursor: "pointer" }}

            <div style={{ display: "flex", gap: 8 }}>

                style={{ padding: "12px 14px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: "#7FA08C", fontSize: 13, cursor: "pointer" }}

            </div>

            onAddPlayer={addPlayer}

      {tab === "pbp" && (

      {tab === "team" && (

              ["Total Plays", homeStats.totalPlays, awayStats.totalPlays],

      {tab === "player" && (
        <div style={{ padding: "12px 14px" }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>

                        passingTable.rows.map((r) => [`#${r.player.jerseyNumber} ${r.player.fullName}`, `${r.comp}/${r.att}`, r.yards, r.avg, r.td, r.int, r.sacks]),
                        ["TEAM", `${passingTable.team.comp}/${passingTable.team.att}`, passingTable.team.yards, passingTable.team.avg, passingTable.team.td, passingTable.team.int, `${passingTable.team.sackCount}-${passingTable.team.sackYards}`]
                      ),
                      ""
                    );

                  if (rushingTable) {
                    sections.push(
                      formatStatTableText(
                        "Rushing",
                        ["", "CAR", "YDS", "AVG", "TD", "LONG"],
                        rushingTable.rows.map((r) => [`#${r.player.jerseyNumber} ${r.player.fullName}`, r.car, r.yards, r.avg, r.td, r.long]),

                      ),

                    );

                  if (receivingTable) {
                    sections.push(
                      formatStatTableText(

                      ),
                      ""
                    );
                  }
                  if (defenseTable) {
                    sections.push(
                      formatStatTableText(
                        "Defense",
                        ["", "TKL", "TFL", "SACK", "INT", "FF", "FR", "TD"],
                        defenseTable.rows.map((r) => [`#${r.player.jerseyNumber} ${r.player.fullName}`, r.tackles, r.tfl, r.sacks, r.int, r.ff, r.fr, r.td]),
                        ["TEAM", defenseTable.team.tackles, defenseTable.team.tfl, defenseTable.team.sacks, defenseTable.team.int, defenseTable.team.ff, defenseTable.team.fr, defenseTable.team.td]
                      ),
                      ""
                    );
                  }
                  if (kickingTable) {
                    sections.push(
                      formatStatTableText(
                        "Kicking",
                        ["", "FG", "LONG", "PAT"],
                        kickingTable.rows.map((r) => [`#${r.player.jerseyNumber} ${r.player.fullName}`, `${r.fgm}/${r.fga}${r.fgDistances.length ? ` (${r.fgDistances.join(", ")})` : ""}`, r.fgLong ?? "-", `${r.patm}/${r.pata}`]),
                        ["TEAM", `${kickingTable.team.fgm}/${kickingTable.team.fga}`, kickingTable.team.fgLong ?? "-", `${kickingTable.team.patm}/${kickingTable.team.pata}`]
                      )
                    );
                  }
                  copyGenericText(sections.join("\n"));
                }}
                style={{ padding: "8px 16px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: copyStatus === "copied" ? "#3ddc84" : "#EDE8DB", fontSize: 12, cursor: "pointer" }}
              >
                {copyStatus === "copied" ? "\u2713 Copied" : copyStatus === "error" ? "Copy failed" : "Copy as text"}
              </button>
            </div>
          )}

          {!passingTable && !rushingTable && !receivingTable && !defenseTable && !kickingTable && (
            <div style={{ color: "#7FA08C", fontSize: 13, fontStyle: "italic" }}>No stats yet for {teams[playerStatsTeam].name}.</div>
          )}

          {passingTable && (
            <StatTable
              title="Passing"
              columns={["", "C/ATT", "YDS", "AVG", "TD", "INT", "SACKS"]}
              rows={passingTable.rows.map((r) => [
                `#${r.player.jerseyNumber} ${r.player.fullName}`,
                `${r.comp}/${r.att}`,
                r.yards,
                r.avg,
                r.td,
                r.int,
                r.sacks,
              ])}
              teamRow={["TEAM", `${passingTable.team.comp}/${passingTable.team.att}`, passingTable.team.yards, passingTable.team.avg, passingTable.team.td, passingTable.team.int, `${passingTable.team.sackCount}-${passingTable.team.sackYards}`]}
            />
          )}

          {rushingTable && (
            <StatTable
              title="Rushing"
              columns={["", "CAR", "YDS", "AVG", "TD", "LONG"]}
              rows={rushingTable.rows.map((r) => [`#${r.player.jerseyNumber} ${r.player.fullName}`, r.car, r.yards, r.avg, r.td, r.long])}
              teamRow={["TEAM", rushingTable.team.car, rushingTable.team.yards, rushingTable.team.avg, rushingTable.team.td, rushingTable.team.long]}
            />
          )}

          {receivingTable && (
            <StatTable
              title="Receiving"
              columns={["", "REC", "YDS", "AVG", "TD", "LONG", "TGTS"]}
              rows={receivingTable.rows.map((r) => [`#${r.player.jerseyNumber} ${r.player.fullName}`, r.rec, r.yards, r.avg, r.td, r.long, r.tgts])}
              teamRow={["TEAM", receivingTable.team.rec, receivingTable.team.yards, receivingTable.team.avg, receivingTable.team.td, receivingTable.team.long, receivingTable.team.tgts]}
            />
          )}

          {defenseTable && (
            <StatTable
              title="Defense"
              columns={["", "TKL", "TFL", "SACK", "INT", "FF", "FR", "TD"]}
              rows={defenseTable.rows.map((r) => [`#${r.player.jerseyNumber} ${r.player.fullName}`, r.tackles, r.tfl, r.sacks, r.int, r.ff, r.fr, r.td])}
              teamRow={["TEAM", defenseTable.team.tackles, defenseTable.team.tfl, defenseTable.team.sacks, defenseTable.team.int, defenseTable.team.ff, defenseTable.team.fr, defenseTable.team.td]}
            />
          )}

          {kickingTable && (
            <StatTable
              title="Kicking"
              columns={["", "FG", "LONG", "PAT"]}
              rows={kickingTable.rows.map((r) => [
                `#${r.player.jerseyNumber} ${r.player.fullName}`,
                `${r.fgm}/${r.fga}${r.fgDistances.length ? ` (${r.fgDistances.join(", ")})` : ""}`,
                r.fgLong ?? "-",
                `${r.patm}/${r.pata}`,
              ])}
              teamRow={["TEAM", `${kickingTable.team.fgm}/${kickingTable.team.fga}`, kickingTable.team.fgLong ?? "-", `${kickingTable.team.patm}/${kickingTable.team.pata}`]}
            />
          )}
        </div>
      )}


      {tab === "drives" && (
        <div style={{ padding: "12px 14px" }}>
          {drives.length > 0 && (
            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
              <button
                onClick={() =>
                  copyGenericText(
                    drives
                      .map(
                        (d) =>
                          `Drive ${d.driveNumber} — ${teams[d.team].name}: started Q${d.startQuarter} ${d.startClock} at ${describeFieldPosition(d.startFieldPosition, d.team)} — ${d.offensivePlays.length} plays, ${d.yards} yds — ${d.result}` +
                          d.offensivePlays.map((p) => `\n  ${p.down ? `${p.down} & ${p.distance}` : "—"} at ${describeFieldPosition(p.fieldPositionBefore, p.possession)}: ${p.firstDown ? p.label.toUpperCase() : p.label}`).join("")
                      )
                      .join("\n")
                  )
                }
                style={{ padding: "8px 16px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: copyStatus === "copied" ? "#3ddc84" : "#EDE8DB", fontSize: 12, cursor: "pointer" }}
              >
                {copyStatus === "copied" ? "\u2713 Copied" : copyStatus === "error" ? "Copy failed" : "Copy as text"}
              </button>
            </div>
          )}
          {drives.length === 0 && <div style={{ color: "#7FA08C", fontSize: 13, fontStyle: "italic" }}>No drives yet.</div>}
          {drives.map((drive) => (
            <div key={drive.driveNumber} style={{ padding: "10px 4px", borderBottom: "1px solid #12291B", fontSize: 13 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <div>
                  <div>
                    Drive {drive.driveNumber} — <span style={{ color: teams[drive.team].color, fontWeight: 700 }}>{teams[drive.team].name}</span>
                  </div>
                  <div style={{ fontSize: 11, color: "#7FA08C" }}>
                    Started Q{drive.startQuarter} {drive.startClock} at {describeFieldPosition(drive.startFieldPosition, drive.team)}
                  </div>
                </div>
                <div style={{ textAlign: "right", ...scoreboardFont }}>
                  <div>{drive.offensivePlays.length} plays, {drive.yards} yds</div>
                  <div style={{ fontSize: 11, color: drive.result === "TOUCHDOWN" ? "#F5B700" : "#9DBBA8" }}>{drive.result}</div>
                </div>
              </div>
              {drive.offensivePlays.length > 0 && (
                <div style={{ marginTop: 6, paddingLeft: 2 }}>
                  {drive.offensivePlays.map((p) => (
                    <div
                      key={p.id}
                      style={{
                        fontSize: 11,
                        color: p.firstDown ? "#F5B700" : "#9DBBA8",
                        fontWeight: p.firstDown ? 700 : 400,
                        textTransform: p.firstDown ? "uppercase" : "none",
                        padding: "2px 0",
                      }}
                    >
                      {p.down ? <><DownLabel down={p.down} />&nbsp;&amp; {p.distance}</> : "—"} at {describeFieldPosition(p.fieldPositionBefore, p.possession)}: {p.label}
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {tab === "boxscore" && (
        <div style={{ padding: "12px 14px" }}>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
            <button
              onClick={copyBoxScore}
              style={{ padding: "8px 16px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: copyStatus === "copied" ? "#3ddc84" : "#EDE8DB", fontSize: 12, cursor: "pointer" }}
            >
              {copyStatus === "copied" ? "\u2713 Copied" : copyStatus === "error" ? "Copy failed" : "Copy as text"}
            </button>
          </div>
          <pre
            style={{
              background: "#142E21",
              border: "1px solid #1C3A28",
              borderRadius: 8,
              padding: 14,
              fontSize: 12,
              lineHeight: 1.6,
              color: "#EDE8DB",
              whiteSpace: "pre-wrap",
              fontFamily: "'SF Mono', 'Roboto Mono', 'IBM Plex Mono', Consolas, monospace",
              overflowX: "auto",
            }}
          >
            {newspaperRecap}
          </pre>
          <div style={{ fontSize: 11, color: "#5C7A68", marginTop: 10, lineHeight: 1.6 }}>
            Set each team's abbreviation and an optional game title on the Setup tab — both feed directly into this
            report. Recomputes from the same play log every time you open it.
          </div>
        </div>
      )}

      {tab === "validate" && (
        <div style={{ padding: "12px 14px" }}>
          {validationIssues.length === 0 ? (
            <div style={{ textAlign: "center", padding: "30px 0", color: "#3ddc84" }}>
              <div style={{ fontSize: 32, marginBottom: 8 }}>✓</div>
              <div style={{ fontSize: 14 }}>No issues found</div>
              <div style={{ fontSize: 11, color: "#7FA08C", marginTop: 4 }}>Checked {plays.length} play{plays.length === 1 ? "" : "s"}.</div>
            </div>
          ) : (
            <>
              <div style={{ fontSize: 12, color: "#9DBBA8", marginBottom: 12 }}>
                {validationIssues.filter((i) => i.severity === "error").length} error(s),{" "}
                {validationIssues.filter((i) => i.severity === "warning").length} warning(s)
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {validationIssues.map((issue, i) => (
                  <div
                    key={i}
                    onClick={() => issue.playId && setTab("pbp")}
                    style={{
                      padding: "10px 12px",
                      borderRadius: 8,
                      border: `1px solid ${issue.severity === "error" ? "#E0483D" : "#5C4520"}`,
                      background: issue.severity === "error" ? "rgba(193,68,60,0.1)" : "rgba(242,183,5,0.08)",
                      cursor: issue.playId ? "pointer" : "default",
                    }}
                  >
                    <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: 0.5, color: issue.severity === "error" ? "#E0483D" : "#F5B700", marginBottom: 3, fontWeight: 700 }}>
                      {issue.severity}
                      {issue.sequence != null ? ` · play #${issue.sequence}` : ""}
                    </div>
                    <div style={{ fontSize: 13, color: "#EDE8DB" }}>{issue.message}</div>
                    {issue.playId && <div style={{ fontSize: 10, color: "#7FA08C", marginTop: 3 }}>Tap to view in Play-by-Play →</div>}
                  </div>
                ))}
              </div>
            </>
          )}
          <div style={{ fontSize: 11, color: "#5C7A68", marginTop: 16, lineHeight: 1.6 }}>
            This checks for data-entry mistakes (wrong player picked, a removed roster player still referenced) and
            internal-consistency bugs (score not matching scoring plays, impossible field position). It does not
            check football strategy or whether a call was correct — only whether the data is internally sound.
          </div>
        </div>
      )}

      <div style={{ padding: "20px 14px 0", fontSize: 11, color: "#5C7A68", lineHeight: 1.6 }}>
        Same NL parser + player fuzzy-matcher + engine logic tested in the project. The tabs above read live off the
        same play log the Enter Play tab writes to — correct or delete a play on the Play-by-Play tab and Team/Player
        Stats recompute automatically, same as the real revision system. Kickoffs are now automatic: after a made
        field goal or any PAT/2pt attempt, a touchback kickoff is generated for you (from the kicking team's 40, per
        HS/NCAA rules) and possession flips. The "⇄ Give ball to..." button below the field strip is there for manual
        corrections — muffed kickoffs/punts, or anything the auto-logic gets wrong.
      </div>
    </div>
  );
}

function GridironLive6() {
  return (
    <GridironErrorBoundary>
      <GridironLiveDemoInner />
    </GridironErrorBoundary>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GridironLive6 />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
