}

function findPlayerAcrossRosters(id, offenseRoster, defenseRoster) {
  return offenseRoster.find((p) => p.id === id) || defenseRoster.find((p) => p.id === id);
}

/** Where an accepted OFFENSIVE blocking foul (holding, illegal use of hands,
 *  block in the back) on a run or a completed pass is enforced from.
 *  - Foul behind the line of scrimmage (or at it): the PREVIOUS spot, no
 *    matter how deep in the backfield it happened (NFHS, since 2023).
 *  - Foul beyond the line of scrimmage: the SPOT OF THE FOUL.
 *  Returns null when the normal previous-spot enforcement applies, otherwise
 *  the field position to enforce from plus the distance-to-go to carry in.
 *  The line to gain doesn't move, so measured from a spot X yards past the
 *  previous spot the distance-to-go is the original distance minus X. */
function offensiveFoulSpotEnforcement({ infraction, penalizedSide, playType, foulSpot, prevSpot, prevDistance, offenseTeam }) {
  if (!infraction || !infraction.spotFoulBeyondLos) return null;
  if (penalizedSide !== "offense") return null;
  if (playType !== "run" && playType !== "pass_complete") return null;
  if (foulSpot == null) return null;
  const foulYards = yardsFromOwnGoal(foulSpot, offenseTeam);
  const prevYards = yardsFromOwnGoal(prevSpot, offenseTeam);
  const beyond = foulYards - prevYards;
  if (beyond <= 0) return null;
  return { fieldPosition: foulSpot, distance: prevDistance - beyond };
}

/** If the operator flagged a penalty on this play, produce BOTH commands
 *  together: the play itself (with its stat-credit yardage adjusted to the
 *  foul spot if accepted) and the penalty (enforced from the true previous
 *  spot — the current game state, since this play hasn't committed yet). */
function buildPlayWithOptionalPenalty(playCmd, playLabel, qe, offenseTeam, state) {
  if (!qe.hasPenalty || !qe.infractionId) {
    return { cmd: playCmd, label: playLabel };
  }

  const infraction = PENALTY_INFRACTIONS.find((i) => i.id === qe.infractionId);
  const sideLabel = qe.penalizedSide === "offense" ? "Offense" : "Defense";

  if (qe.offsetting) {
    // Offsetting penalties: the down is replayed at the ORIGINAL spot.
    // Neither foul is individually enforced, and per NFHS statistical
    // treatment, no statistics accrue on a replayed down - the underlying
    // play is kept in the log (so the attempt is still visible) but its
    // yardage is wiped to 0.
    const offInfraction = PENALTY_INFRACTIONS.find((i) => i.id === qe.offsettingInfractionId);
    const offSideLabel = qe.penalizedSide === "offense" ? "Defense" : "Offense";
    const nullifiedPlayCmd = { ...playCmd, yards: 0, touchdownAsserted: false };
    const nullifiedPlayLabel = `${playLabel} — WIPED (offsetting penalties, down replayed)`;
    const penaltyCmd1 = {
      type: "penalty",
      infraction,
      penalizedSide: qe.penalizedSide,
      accepted: false,
      offsetting: true,
      committedById: qe.committedBy || undefined,
      fieldPositionOverride: state.fieldPosition,
      downOverride: state.down,
      distanceOverride: state.distance,
      quarterOverride: state.quarter,
      clockOverride: state.clock,
    };
    const penaltyCmd2 = {
      type: "penalty",
      infraction: offInfraction,
      penalizedSide: qe.penalizedSide === "offense" ? "defense" : "offense",
      accepted: false,
      offsetting: true,
      committedById: qe.offsettingCommittedBy || undefined,
      fieldPositionOverride: state.fieldPosition,
      downOverride: state.down,
      distanceOverride: state.distance,
      quarterOverride: state.quarter,
      clockOverride: state.clock,
    };
    return {
      commands: [
        { cmd: nullifiedPlayCmd, label: nullifiedPlayLabel },
        { cmd: penaltyCmd1, label: `${sideLabel} penalty: ${infraction ? infraction.label : "Unknown"} — OFFSETTING` },
        { cmd: penaltyCmd2, label: `${offSideLabel} penalty: ${offInfraction ? offInfraction.label : "Unknown"} — OFFSETTING, down replayed` },
      ],
    };
  }

  // Everything is worked out from where the ball is spotted after the
  // penalty (qe.ballSpot). The runner/receiver keeps whatever positive
  // yardage is left on the play up to that spot, never more than the gain
  // actually entered.
  const spotted = qe.accepted && qe.ballSpot != null;
  const prevYards = yardsFromOwnGoal(state.fieldPosition, offenseTeam);
  const finalYards = spotted ? yardsFromOwnGoal(qe.ballSpot, offenseTeam) : prevYards;
  const enteredGain = typeof playCmd.yards === "number" && !playCmd.touchdownAsserted ? playCmd.yards : null;
  const isGainPlay = playCmd.type === "run" || playCmd.type === "pass_complete";
  const creditedYards = !spotted ? 0 : isGainPlay ? Math.max(0, Math.min(finalYards - prevYards, enteredGain != null ? Math.max(enteredGain, 0) : finalYards - prevYards)) : 0;
  const penaltyCmd = {
    type: "penalty",
    infraction,
    penalizedSide: qe.penalizedSide,
    accepted: !!qe.accepted,
    committedById: qe.committedBy || undefined,
    fieldPositionOverride: state.fieldPosition,
    downOverride: state.down,
    distanceOverride: state.distance,
    finalSpot: spotted ? qe.ballSpot : undefined,
    driveYards: spotted ? finalYards - prevYards - creditedYards : undefined,
    quarterOverride: state.quarter,
    clockOverride: state.clock,
  };
  const penaltyLabel = `${sideLabel} penalty: ${infraction ? infraction.label : "Unknown"} (${infraction ? infraction.yards : "?"} yds) — ${qe.accepted ? "ACCEPTED" : "DECLINED"}${spotted ? `, ball spotted at ${describeFieldPosition(qe.ballSpot, offenseTeam)}` : ""}`;

  let adjustedPlayCmd = playCmd;
  let adjustedPlayLabel = playLabel;
  if (spotted) {
    adjustedPlayCmd = { ...playCmd, yards: creditedYards, touchdownAsserted: false, suppressFirstDown: true };
    adjustedPlayLabel = qe.touchdown
      ? `${playLabel.replace(" — TOUCHDOWN", "")} — TOUCHDOWN NEGATED BY PENALTY (credited ${creditedYards} yds)`
      : `${playLabel} (credited ${creditedYards} yds after penalty)`;
  }

  return {
    commands: [
      { cmd: adjustedPlayCmd, label: adjustedPlayLabel },
      { cmd: penaltyCmd, label: penaltyLabel },
    ],
  };
}

function buildTurnoverPlayWithOptionalPenalty(turnoverCmd, turnoverLabel, qe, offenseTeam, state) {
  if (!qe.hasPenalty || !qe.infractionId) {
    return { cmd: turnoverCmd, label: turnoverLabel };
  }

  const infraction = PENALTY_INFRACTIONS.find((i) => i.id === qe.infractionId);
  const sideLabel = qe.penalizedSide === "offense" ? "Offense" : "Defense";
  const newPossessor = other(offenseTeam);

  // Where the return actually ended - computed directly rather than
  // relying on a lastPlay that doesn't exist yet within this same
  // multi-command sequence. Mirrors exactly what applyPlay itself would
  // compute for this turnover.
  const turnoverSpot = turnoverCmd.turnoverSpot != null ? turnoverCmd.turnoverSpot : state.fieldPosition;
  const returnEndSpot = turnoverCmd.touchdownAsserted ? (newPossessor === HOME ? 100 : 0) : advance(turnoverSpot, newPossessor, turnoverCmd.yards || 0);

  if (qe.offsetting) {
    // Offsetting fouls on a turnover return: the down is replayed with the
    // ORIGINAL offense, at the ORIGINAL spot - the turnover never
    // happened. Zeroing the interception/fumble's yards would still flip
    // possession (the engine always turns the ball over on this command
    // type), so the only correct move is to omit the turnover command
    // from the sequence entirely, not try to "nullify" it in place.
    const offInfraction = PENALTY_INFRACTIONS.find((i) => i.id === qe.offsettingInfractionId);
    const offSideLabel = qe.penalizedSide === "offense" ? "Defense" : "Offense";
    const penaltyCmd1 = {
      type: "penalty",
      infraction,
      penalizedSide: qe.penalizedSide,
      accepted: false,
      offsetting: true,
      committedById: qe.committedBy || undefined,
      fieldPositionOverride: state.fieldPosition,
      downOverride: state.down,
      distanceOverride: state.distance,
      quarterOverride: state.quarter,
      clockOverride: state.clock,
    };
    const penaltyCmd2 = {
      type: "penalty",
      infraction: offInfraction,
      penalizedSide: qe.penalizedSide === "offense" ? "defense" : "offense",
      accepted: false,
      offsetting: true,
      committedById: qe.offsettingCommittedBy || undefined,
      fieldPositionOverride: state.fieldPosition,
      downOverride: state.down,
      distanceOverride: state.distance,
      quarterOverride: state.quarter,
      clockOverride: state.clock,
    };
    return {
      commands: [
        { cmd: penaltyCmd1, label: `${sideLabel} penalty: ${infraction ? infraction.label : "Unknown"} — OFFSETTING (turnover wiped, down replayed)` },
        { cmd: penaltyCmd2, label: `${offSideLabel} penalty: ${offInfraction ? offInfraction.label : "Unknown"} — OFFSETTING, down replayed` },
      ],
    };
  }

  if (!qe.accepted) {
    // Declined - the turnover and its return stand exactly as entered.
    return { cmd: turnoverCmd, label: turnoverLabel };
  }

  // Accepted - the turnover itself still counts (the interception/fumble
  // happened; declining would only be relevant if it somehow benefited
  // the fouled-against team more, which the operator already decided by
  // marking it accepted). The penalty is enforced as a separate event
  // from where the return actually ended - never adjusting the return's
  // own recorded yardage, since that number means something different
  // (return distance) than a normal play's forward-gain yardage.
  const isTouchdownReturn = !!turnoverCmd.touchdownAsserted;
  const penaltyCmd = {
    type: "penalty",
    infraction,
    penalizedSide: qe.penalizedSide,
    accepted: true,
    committedById: qe.committedBy || undefined,
    // A touchdown return still counts as scored - the penalty doesn't
    // negate it (unlike an offensive penalty during a scoring run/pass).
    // logOnly means it's recorded for the penalty stats only, without
    // touching field position/down/distance - those are meaningless once
    // the game is awaiting the try, same as every other touchdown here.
    logOnly: isTouchdownReturn,
    fieldPositionOverride: isTouchdownReturn ? undefined : returnEndSpot,
    downOverride: isTouchdownReturn ? undefined : 1,
    distanceOverride: isTouchdownReturn ? undefined : Math.min(10, yardsToGoal(returnEndSpot, newPossessor)),
    quarterOverride: state.quarter,
    clockOverride: state.clock,
  };
  const penaltyLabel = isTouchdownReturn
    ? `${sideLabel} penalty: ${infraction ? infraction.label : "Unknown"} (${infraction ? infraction.yards : "?"} yds) — ACCEPTED, TD stands, enforced on the try/kickoff`
    : `${sideLabel} penalty: ${infraction ? infraction.label : "Unknown"} (${infraction ? infraction.yards : "?"} yds) — ACCEPTED, enforced from end of return`;

  return {
    commands: [
      { cmd: turnoverCmd, label: turnoverLabel },
      { cmd: penaltyCmd, label: penaltyLabel },
    ],
  };
}

function buildQuickEntryCommand(playType, qe, offenseRoster, defenseRoster, lastPlay, offenseTeam, state) {
  const nameOf = (id) => {
    const p = findPlayerAcrossRosters(id, offenseRoster, defenseRoster);
    return p ? p.fullName : "Unknown";
  };
  switch (playType) {
    case "safety":
      return {
        cmd: { type: "safety" },
        label: "SAFETY — defense scores 2",
      };
    case "kneel":
      return {
        cmd: { type: "run", rusherId: qe.rusher, yards: -1 },
        label: `${nameOf(qe.rusher)} kneel`,
      };
    case "spike":
      return {
        cmd: { type: "pass_incomplete", passerId: qe.passer, yards: 0 },
        label: `${nameOf(qe.passer)} spike (clock stopped)`,
      };
    case "run": {
      const endNote = qe.tackler
        ? ` (tackle: ${nameOf(qe.tackler)}${qe.assistTackler ? ` & ${nameOf(qe.assistTackler)}` : ""})`
        : qe.tackleNote === "out_of_bounds"
        ? ", out of bounds"
        : qe.tackleNote === "slide"
        ? ", slide"
        : "";
      const runCmd = {
        type: "run",
        rusherId: qe.rusher,
        yards: qe.touchdown ? undefined : qe.yards,
        touchdownAsserted: !!qe.touchdown,
        tacklerIds: qe.tackler ? [qe.tackler, ...(qe.assistTackler ? [qe.assistTackler] : [])] : undefined,
      };
      const runLabel = qe.touchdown ? `${nameOf(qe.rusher)} run — TOUCHDOWN` : `${nameOf(qe.rusher)} run for ${qe.yards} yards${endNote}`;
      return buildPlayWithOptionalPenalty(runCmd, runLabel, qe, offenseTeam, state);
    }
    case "pass":
      if (qe.passResult === "complete") {
        const endNote = qe.tackler
          ? ` (tackle: ${nameOf(qe.tackler)}${qe.assistTackler ? ` & ${nameOf(qe.assistTackler)}` : ""})`
          : qe.tackleNote === "out_of_bounds"
          ? ", out of bounds"
          : qe.tackleNote === "slide"
          ? ", slide"
          : "";
        const passCmd = {
          type: "pass_complete",
          passerId: qe.passer,
          receiverId: qe.receiver,
          yards: qe.touchdown ? undefined : qe.yards,
          touchdownAsserted: !!qe.touchdown,
          tacklerIds: qe.tackler ? [qe.tackler, ...(qe.assistTackler ? [qe.assistTackler] : [])] : undefined,
        };
        const passLabel = qe.touchdown ? `${nameOf(qe.passer)} to ${nameOf(qe.receiver)} — TOUCHDOWN` : `${nameOf(qe.passer)} to ${nameOf(qe.receiver)} for ${qe.yards} yards${endNote}`;
        return buildPlayWithOptionalPenalty(passCmd, passLabel, qe, offenseTeam, state);
      }
      if (qe.passResult === "incomplete") {
        return {
          cmd: { type: "pass_incomplete", passerId: qe.passer, receiverId: qe.receiver || undefined, yards: 0 },
          label: `Incomplete pass (${nameOf(qe.passer)}${qe.receiver ? ` to ${nameOf(qe.receiver)}` : ""})`,
        };
      }
      const intCmd = {
        type: "interception",
        passerId: qe.passer,
        interceptedById: qe.defender,
        turnoverSpot: qe.turnoverSpot,
        yards: qe.touchdown ? 0 : qe.yards || 0,
        touchdownAsserted: !!qe.touchdown,
      };
      const intLabel = qe.touchdown ? `Interception by ${nameOf(qe.defender)} — TOUCHDOWN` : `Interception by ${nameOf(qe.defender)}${qe.yards ? `, returned ${qe.yards} yards` : ""}`;
      return buildTurnoverPlayWithOptionalPenalty(intCmd, intLabel, qe, offenseTeam, state);
    case "sack":
      return {
        cmd: { type: "sack", passerId: qe.passer, defenderId: qe.defender, yards: qe.yards },
        label: `Sack for ${qe.yards} yards${qe.defender ? ` (${nameOf(qe.defender)})` : ""}`,
      };
    case "interception": {
      const intCmd2 = {
        type: "interception",
        passerId: qe.passer,
        interceptedById: qe.defender,
        turnoverSpot: qe.turnoverSpot,
        yards: qe.touchdown ? 0 : qe.yards || 0,
        touchdownAsserted: !!qe.touchdown,
      };
      const intLabel2 = qe.touchdown ? `Interception by ${nameOf(qe.defender)} — TOUCHDOWN` : `Interception by ${nameOf(qe.defender)}${qe.yards ? `, returned ${qe.yards} yards` : ""}`;
      return buildTurnoverPlayWithOptionalPenalty(intCmd2, intLabel2, qe, offenseTeam, state);
    }
    case "punt": {
      if (qe.puntBlocked === "yes") {
        const recSideLabel = qe.blockRecoveredBy === "defense" ? "receiving team" : "punting team";
        const recDesc = qe.blockRecoverer ? ` (${nameOf(qe.blockRecoverer)})` : "";
        const blockDesc = qe.blockedById ? `, blocked by ${nameOf(qe.blockedById)}` : "";
        const label = qe.touchdown
          ? `Blocked punt${blockDesc} — recovered by ${recSideLabel}${recDesc} — TOUCHDOWN`
          : `Blocked punt${blockDesc} — recovered by ${recSideLabel}${recDesc}${qe.yards ? `, returned ${qe.yards} yards` : ""}`;
        return {
          cmd: {
            type: "punt",
            punterId: qe.punter,
            blocked: true,
            blockedById: qe.blockedById || undefined,
            recoveredBy: qe.blockRecoveredBy,
            fumbleForcedById: qe.blockedById || undefined,
            fumbleRecoveredById: qe.blockRecoverer || undefined,
            blockSpot: qe.blockSpot,
            yards: qe.touchdown ? 0 : qe.blockRecoveredBy === "defense" ? qe.yards || 0 : 0,
            touchdownAsserted: !!qe.touchdown,
          },
          label,
        };
      }
      if (qe.puntResult === "muffed") {
        const recSideLabel = qe.muffRecoveredBy === "kicking" ? "punting team" : "receiving team";
        return {
          cmd: {
            type: "punt",
            punterId: qe.punter,
            muffed: true,
            muffRecoveredBy: qe.muffRecoveredBy,
            returnerId: qe.recoverer || undefined,
            recoverySpot: qe.recoverySpot,
          },
          label: `Punt — MUFFED, recovered by ${recSideLabel}${qe.recoverer ? ` (${nameOf(qe.recoverer)})` : ""}`,
        };
      }
      const touchback = qe.puntResult === "touchback";
      if (touchback) {
        return {
          cmd: { type: "punt", punterId: qe.punter, touchback: true, yards: 0 },
          label: "Punt — TOUCHBACK",
        };
      }
      const returnTd = qe.puntResult === "return_td";
      const returned = qe.puntResult === "returned" || returnTd;
      const tdFlag = !!qe.touchdown || returnTd;
      const fairCatch = qe.puntResult === "fair_catch";
      const spotName = (abs) => {
        const { side, yard } = relativeFromAbsolute(abs, other(offenseTeam));
        return yard === 50 ? "the 50" : `${side === "own" ? "own" : "opp"} ${yard}`;
      };
      const fielded = qe.fieldedAtSpot;
      const ended = returned ? (returnTd ? other(offenseTeam) === HOME ? 100 : 0 : qe.returnedToSpot) : undefined;
      const returnYards = returned && !tdFlag
        ? yardsFromOwnGoal(ended, other(offenseTeam)) - yardsFromOwnGoal(fielded, other(offenseTeam))
        : 0;
      const grossYards = yardsFromOwnGoal(fielded, offenseTeam) - yardsFromOwnGoal(state.fieldPosition, offenseTeam);
      let label;
      if (returned && tdFlag) label = `Punt ${grossYards} yds, fielded at ${spotName(fielded)} by ${nameOf(qe.returner) || "?"} — returned for a TOUCHDOWN`;
      else if (returned) label = `Punt ${grossYards} yds, fielded at ${spotName(fielded)}${qe.returner ? ` by ${nameOf(qe.returner)}` : ""}, returned ${returnYards} yds to ${spotName(ended)}`;
      else if (fairCatch) label = `Punt ${grossYards} yds — fair catch${qe.returner ? ` by ${nameOf(qe.returner)}` : ""} at ${spotName(fielded)}`;
      else label = `Punt ${grossYards} yds — downed at ${spotName(fielded)}`;
      return {
        cmd: {
          type: "punt",
          punterId: qe.punter,
          returnerId: returned || fairCatch ? qe.returner || undefined : undefined,
          fieldedAtSpot: fielded,
          returnedToSpot: ended,
          puntGrossYards: grossYards,
          puntReturnYards: returnYards,
          touchdownAsserted: tdFlag,
          yards: 0, // engine recomputes net from the spots
        },
        label,
      };
    }
    case "field_goal": {
      const baseLabel = `${qe.fgDistance ? `${qe.fgDistance} yd f` : "F"}ield goal ${qe.fgResult === "good" ? "GOOD" : qe.fgResult === "blocked" ? "BLOCKED" : "no good"} (${nameOf(qe.kicker)})`;
      const blockDesc = qe.fgResult === "blocked" && qe.blockedById ? `, blocked by ${nameOf(qe.blockedById)}` : "";
      const returnDesc = qe.touchdown
        ? `, returned by ${nameOf(qe.returner) || "?"} — TOUCHDOWN`
        : qe.fgReturned === "yes" && qe.yards
        ? `, returned ${qe.yards} yards by ${nameOf(qe.returner) || "?"}`
        : "";
      return {
        cmd: {
          type: "field_goal",
          kickerId: qe.kicker,
          distance: qe.fgDistance,
          result: qe.fgResult,
          fumbleForcedById: qe.blockedById || undefined,
          returnerId: qe.returner || undefined,
          yards: qe.touchdown ? 0 : qe.fgReturned === "yes" ? qe.yards || 0 : 0,
          touchdownAsserted: !!qe.touchdown,
        },
        label: baseLabel + blockDesc + returnDesc,
      };
    }
    case "extra_point": {
      if (qe.patAttemptType === "two_point") {
        const isRun = qe.twoPtType === "run";
        const attemptDesc = isRun ? `${nameOf(qe.rusher)} run` : `${nameOf(qe.passer)} pass to ${nameOf(qe.receiver)}`;
        return {
          cmd: {
            type: "two_point_conversion",
            result: qe.twoPtResult,
            conversionType: qe.twoPtType,
            rusherId: isRun ? qe.rusher : undefined,
            passerId: isRun ? undefined : qe.passer,
            receiverId: isRun ? undefined : qe.receiver,
          },
          label: `Two-point conversion (${attemptDesc}) ${qe.twoPtResult === "good" ? "GOOD" : "NO GOOD"}`,
        };
      }
      return {
        cmd: { type: "extra_point", kickerId: qe.kicker, result: qe.patResult },
        label: `PAT ${qe.patResult === "good" ? "GOOD" : qe.patResult === "blocked" ? "BLOCKED" : "no good"} (${nameOf(qe.kicker)})`,
      };
    }
    case "two_point_conversion": {
      const isRun = qe.twoPtType === "run";
      const attemptDesc = isRun ? `${nameOf(qe.rusher)} run` : `${nameOf(qe.passer)} pass to ${nameOf(qe.receiver)}`;
      return {
        cmd: {
          type: "two_point_conversion",
          result: qe.twoPtResult,
          conversionType: qe.twoPtType,
          rusherId: isRun ? qe.rusher : undefined,
          passerId: isRun ? undefined : qe.passer,
          receiverId: isRun ? undefined : qe.receiver,
        },
        label: `Two-point conversion (${attemptDesc}) ${qe.twoPtResult === "good" ? "GOOD" : "NO GOOD"}`,
      };
    }
    case "penalty": {
      const infraction = PENALTY_INFRACTIONS.find((i) => i.id === qe.infractionId);
      const sideLabel = qe.penalizedSide === "offense" ? "Offense" : "Defense";
      const attaching = qe.accepted && qe.attachToPrevious && lastPlay;
      const cmd = { type: "penalty", infraction, penalizedSide: qe.penalizedSide, accepted: !!qe.accepted, committedById: qe.committedBy || undefined };
      let adjustPreviousPlay = null;
      let enforcedFromFoulSpot = false;
      if (attaching) {
        const wasTurnoverReturn = lastPlay.playType === "interception" || (lastPlay.playType === "fumble" && lastPlay.recoveredBy === "defense");
        // Enforcement (field position/down/distance) always uses the TRUE
        // previous spot — completely independent of where the foul
        // happened, per the verified NFHS rule. For a normal offensive
        // play that's the pre-snap spot. For a turnover return, the
        // pre-snap spot belongs to a drive that's already over - what
        // matters is where the return actually ended, which is what the
        // next play would otherwise have started from.
        cmd.fieldPositionOverride = wasTurnoverReturn ? lastPlay.fieldPositionAfter : lastPlay.fieldPositionBefore;
        cmd.downOverride = lastPlay.down;
        cmd.distanceOverride = lastPlay.distance;
        cmd.quarterOverride = lastPlay.quarter;
        cmd.clockOverride = lastPlay.clock;
        // The rusher's-stat-credit convention (crediting yards to the
        // foul spot) is specific to a normal offensive gain, where yards
        // means "gain from the snap in the offense's own direction." A
        // turnover return's yards field means something entirely
        // different (return distance in the new possessor's direction
        // from the turnover spot) - applying the same formula would
        // silently corrupt the return yardage. Skip the adjustment for
        // turnover returns; the penalty is still recorded and enforced
        // correctly, just without altering the return's own stat line.
        if (qe.ballSpot != null && !wasTurnoverReturn) {
          const prevYards = yardsFromOwnGoal(lastPlay.fieldPositionBefore, offenseTeam);
          const finalYards = yardsFromOwnGoal(qe.ballSpot, offenseTeam);
          const isGainPlay = lastPlay.playType === "run" || lastPlay.playType === "pass_complete";
          const prevGain = typeof lastPlay.yards === "number" ? lastPlay.yards : 0;
          const credited = isGainPlay ? Math.max(0, Math.min(finalYards - prevYards, Math.max(prevGain, 0))) : 0;
          cmd.finalSpot = qe.ballSpot;
          cmd.driveYards = finalYards - prevYards - credited;
          if (isGainPlay) adjustPreviousPlay = { playId: lastPlay.id, yards: credited };
          enforcedFromFoulSpot = true;
        }
      }
      return {
        cmd,
        label: `${sideLabel} penalty: ${infraction ? infraction.label : "Unknown"} (${infraction ? infraction.yards : "?"} yds) — ${qe.accepted ? "ACCEPTED" : "DECLINED"}${attaching ? (enforcedFromFoulSpot ? `, ball spotted at ${describeFieldPosition(qe.ballSpot, offenseTeam)}` : ", enforced from previous spot") : ""}`,
        adjustPreviousPlay,
      };
    }
    case "fumble": {
      const carrierIsReceiver = qe.carrierType === "catch";
      const yardsBeforeFumble = qe.yardsBeforeFumble || 0;
      // The spot where the fumble itself happened - computed from the pre-
      // fumble yardage rather than asked as a separate absolute yard-line
      // pick, so the operator never has to do that math themselves (and
      // it can't disagree with the yardage they just entered).
      const fumbleSpot = advance(state.fieldPosition, offenseTeam, yardsBeforeFumble);
      const carrierLabel = carrierIsReceiver ? `${nameOf(qe.carrier)} catches it` : `${nameOf(qe.carrier)} runs`;
      const gainDesc = yardsBeforeFumble ? ` for ${yardsBeforeFumble} yard${Math.abs(yardsBeforeFumble) === 1 ? "" : "s"}` : "";

      if (qe.recoveredBy === "out_of_bounds") {
        const cmd = {
          type: "fumble",
          rusherId: carrierIsReceiver ? undefined : qe.carrier,
          receiverId: carrierIsReceiver ? qe.carrier : undefined,
          passerId: carrierIsReceiver ? qe.passer || undefined : undefined,
          recoveredBy: "out_of_bounds",
          turnoverSpot: fumbleSpot,
          yardsBeforeFumble,
        };
        const label = `${carrierLabel}${gainDesc}, fumbles — out of bounds at ${describeFieldPosition(fumbleSpot, offenseTeam)}`;
        return buildPlayWithOptionalPenalty(cmd, label, qe, offenseTeam, state);
      }

      const recoveredByDefense = qe.recoveredBy === "defense";
      const fumbleCmd = {
        type: "fumble",
        rusherId: carrierIsReceiver ? undefined : qe.carrier,
        receiverId: carrierIsReceiver ? qe.carrier : undefined,
        passerId: carrierIsReceiver ? qe.passer || undefined : undefined,
        recoveredBy: qe.recoveredBy,
        fumbleRecoveredById: qe.recoverer || undefined,
        fumbleForcedById: qe.forcedBy || undefined,
        turnoverSpot: recoveredByDefense ? fumbleSpot : undefined,
        yardsBeforeFumble,
        // For "offense recovers", yards drives down-progression the same
        // way a run/pass's yards would - it's just the pre-fumble gain,
        // since the ball ends up right back at the fumble spot either way.
        yards: qe.touchdown ? (recoveredByDefense ? 0 : undefined) : recoveredByDefense ? qe.yards || 0 : yardsBeforeFumble,
        touchdownAsserted: !!qe.touchdown,
      };
      const fumbleLabel = qe.touchdown
        ? `${carrierLabel}${gainDesc}, fumbles — ${recoveredByDefense ? `recovered by ${nameOf(qe.recoverer)}` : `${nameOf(qe.carrier)} recovers`} — TOUCHDOWN`
        : `${carrierLabel}${gainDesc}, fumbles${qe.forcedBy ? ` (forced by ${nameOf(qe.forcedBy)})` : ""}, recovered by ${recoveredByDefense ? "defense" : "offense"}${qe.recoverer ? ` (${nameOf(qe.recoverer)})` : ""}${recoveredByDefense && qe.yards ? `, returned ${qe.yards} yards` : ""}`;
      return recoveredByDefense
        ? buildTurnoverPlayWithOptionalPenalty(fumbleCmd, fumbleLabel, qe, offenseTeam, state)
        : buildPlayWithOptionalPenalty(fumbleCmd, fumbleLabel, qe, offenseTeam, state);
    }
    case "kickoff": {
      const resultLabels = {
        touchback: "Touchback (own 20)",
        onside_kicking_recovers: "Onside — kicking team recovers",
        onside_receiving_recovers: "Onside — receiving team recovers",
      };

      if (qe.result === "return" || qe.result === "return_td") {
        const tdReturn = !!qe.touchdown || qe.result === "return_td";
        const goalLine = other(offenseTeam) === HOME ? 100 : 0; // receiving team scores at the far end
        const label = tdReturn
          ? `Kickoff return by ${nameOf(qe.returner) || "?"} — TOUCHDOWN`
          : `Kickoff${qe.kicker ? ` (${nameOf(qe.kicker)})` : ""} returned by ${nameOf(qe.returner) || "?"}`;
        return {
          cmd: {
            type: "kickoff",
            kickerId: qe.kicker || undefined,
            returnerId: qe.returner || undefined,
            result: "return",
            caughtAtSpot: qe.caughtAtSpot,
            returnedToSpot: qe.result === "return_td" ? goalLine : qe.returnedToSpot,
            touchdownAsserted: tdReturn,
          },
          label,
        };
      }

      if (qe.result === "fair_catch") {
        return {
          cmd: { type: "kickoff", kickerId: qe.kicker || undefined, returnerId: qe.returner || undefined, result: "fair_catch", caughtAtSpot: qe.caughtAtSpot },
          label: `Kickoff${qe.kicker ? ` (${nameOf(qe.kicker)})` : ""} — fair catch${qe.returner ? ` by ${nameOf(qe.returner)}` : ""}`,
        };
      }

      if (qe.result === "muffed") {
        const recSideLabel = qe.muffRecoveredBy === "kicking" ? "kicking team" : "receiving team";
        return {
          cmd: {
            type: "kickoff",
            kickerId: qe.kicker || undefined,
            returnerId: qe.recoverer || undefined,
            result: qe.muffRecoveredBy === "kicking" ? "muffed_kicking_recovers" : "muffed_receiving_recovers",
            recoverySpot: qe.recoverySpot,
          },
          label: `Kickoff${qe.kicker ? ` (${nameOf(qe.kicker)})` : ""} — MUFFED, recovered by ${recSideLabel}${qe.recoverer ? ` (${nameOf(qe.recoverer)})` : ""}`,
        };
      }

      if (qe.result === "out_of_bounds") {
        if (qe.oobChoice === "spot") {
          return {
            cmd: { type: "kickoff", kickerId: qe.kicker || undefined, result: "out_of_bounds_spot", oobSpot: qe.oobSpot },
            label: `Kickoff${qe.kicker ? ` (${nameOf(qe.kicker)})` : ""} out of bounds — receiving team takes it at the spot`,
          };
        }
        if (qe.oobChoice === "twentyfive") {
          return {
            cmd: { type: "kickoff", kickerId: qe.kicker || undefined, result: "out_of_bounds_25" },
            label: `Kickoff${qe.kicker ? ` (${nameOf(qe.kicker)})` : ""} out of bounds — receiving team takes it 25 yds from the kickoff spot`,
          };
        }
        return {
          cmd: { type: "kickoff", kickerId: qe.kicker || undefined, result: "out_of_bounds_rekick" },
          label: `Kickoff${qe.kicker ? ` (${nameOf(qe.kicker)})` : ""} out of bounds — re-kick, 5 yd penalty`,
        };
      }

      if (qe.result === "onside_kicking_recovers" || qe.result === "onside_receiving_recovers") {
        return {
          cmd: { type: "kickoff", kickerId: qe.kicker || undefined, result: qe.result, recoverySpot: qe.recoverySpot, returnerId: qe.recoverer || undefined },
          label: `Kickoff${qe.kicker ? ` (${nameOf(qe.kicker)})` : ""} — ${resultLabels[qe.result]}${qe.recoverer ? ` (${nameOf(qe.recoverer)})` : ""}`,
        };
      }

      // touchback
      return {
        cmd: { type: "kickoff", kickerId: qe.kicker || undefined, result: "touchback" },
        label: `Kickoff${qe.kicker ? ` (${nameOf(qe.kicker)})` : ""} — ${resultLabels.touchback}`,
      };
    }
    default:
      return null;
  }
}

function QuickEntry({ offenseRoster, defenseRoster, teams, state, lastPlay, recentPlayers, onPlayerUsed, onCommit, onCommitWithPriorAdjustment, onCommitSequence }) {
  const [playType, setPlayType] = useState(null);
  const [qe, setQe] = useState({});
  const [customYards, setCustomYards] = useState("");
  const [fieldSpotSide, setFieldSpotSide] = useState("own");
  const [justCommitted, setJustCommitted] = useState(null);
  const [pendingConfirm, setPendingConfirm] = useState(null); // { result, newQe, flaggedField, flaggedValue } | null
  const [quickMode, setQuickMode] = useState(false);
  const [quickTackler, setQuickTackler] = useState(null);
  const [playerSearch, setPlayerSearch] = useState("");
  const [enterByEndSpot, setEnterByEndSpot] = useState(false);

  // If a kickoff is owed, THIS render must show the kickoff flow — computed
  // directly, not via an effect. An effect-based approach has a window
  // where awaitingKickoff just became true but the screen hasn't caught up
  // yet (effects run after render); this way there's no such window,
  // because every render checks the real, current game state directly.
  const effectivePlayType = state.awaitingKickoff ? "kickoff" : playType;

  const ctx = { kickingTeam: state.possession, receivingTeam: other(state.possession), offenseTeam: state.possession, hasPreviousPlay: !!lastPlay, quickMode, fieldPosition: state.fieldPosition, prevPlaySpot: lastPlay ? lastPlay.fieldPositionBefore : null, lastWasTurnoverReturn: !!lastPlay && (lastPlay.playType === "interception" || (lastPlay.playType === "fumble" && lastPlay.recoveredBy === "defense")) };
  const steps = effectivePlayType ? getQuickEntrySteps(effectivePlayType, qe, ctx) : [];
  const currentStep = steps.find((s) => qe[s.key] === undefined);

  // Default every yard-line picker to the current line of scrimmage
  // (state.fieldPosition, translated to that step's own team's OWN/OPP +
  // yard) rather than opening blank — still fully editable, just saves a
  // tap for the common case where the spot in question IS roughly where
  // the ball already is (turnover spot, block/recovery spot, foul spot,
  // etc. on a normal play).
  useEffect(() => {
    if (!currentStep) return;
    const isFieldSpot = currentStep.kind === "fieldspot";
    // The "what yard line did the play end at?" entry mode for ordinary
    // run/pass yardage shares this same OWN/OPP + yard picker (it just
    // computes gained yards from the difference), so it needs the same
    // default-to-current-spot treatment.
    const isEndSpotYards = currentStep.kind === "yards" && currentStep.allowEndSpotEntry;
    if (!isFieldSpot && !isEndSpotYards) return;
    const team = currentStep.team || ctx.offenseTeam;
    if (currentStep.defaultAbs != null) {
      const d = relativeFromAbsolute(currentStep.defaultAbs, team);
      setFieldSpotSide(d.side);
      setCustomYards(String(d.yard));
      return;
    }
    if (currentStep.defaultSpotKey && qe[currentStep.defaultSpotKey] != null) {
      const d = relativeFromAbsolute(qe[currentStep.defaultSpotKey], team);
      setFieldSpotSide(d.side);
      setCustomYards(String(d.yard));
      return;
    }
    if (currentStep.defaultSide) {
      setFieldSpotSide(currentStep.defaultSide);
      setCustomYards("");
      return;
    }
    const { side, yard } = relativeFromAbsolute(state.fieldPosition, team);
    setFieldSpotSide(side);
    setCustomYards(String(yard));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentStep && currentStep.key, currentStep && currentStep.kind]);

  function reset() {
    setPlayType(null);
    setQe({});
    setCustomYards("");
    setFieldSpotSide("own");
    setEnterByEndSpot(false);
    setQuickTackler(null);
    setPlayerSearch("");
  }

  // Finds the single largest yardage-like number in the about-to-commit
  // command and flags it when it's well outside what a real play can look
  // like - almost always a typo (a dropped digit, an extra "-") rather
  // than an actual 50+ yard swing, so it's worth one tap to confirm rather
  // than logging it silently.
  function implausibleYardageIn(result) {
    const cmd = result && result.cmd;
    const candidates = [];
    if (cmd && !cmd.touchdownAsserted) {
      // TD plays are bounded by the field itself, not a typed number.
      candidates.push(["yards", cmd.yards], ["yardsBeforeFumble", cmd.yardsBeforeFumble]);
    }
    // A penalty's foul-spot pick can retroactively rewrite a PREVIOUS
    // play's yardage - that number lives here, not on the penalty's own
    // command, so it needs its own check or a wildly-wrong foul spot (e.g.
    // picked on the wrong side of the field) sails straight through.
    if (result && result.adjustPreviousPlay) {
      candidates.push(["adjustPreviousPlay.yards", result.adjustPreviousPlay.yards]);
    }
    for (const [field, value] of candidates) {
      if (typeof value === "number" && Math.abs(value) >= 40) return { field, value };
    }
    return null;
  }

  function doCommit(result) {
    let confirmLabel = result.label;
    if (result.commands && onCommitSequence) {
      onCommitSequence(result.commands);
      confirmLabel = result.commands.map((c) => c.label).join(" — ");
    } else if (result.adjustPreviousPlay && onCommitWithPriorAdjustment) {
      onCommitWithPriorAdjustment(result.cmd, result.label, result.adjustPreviousPlay);
    } else {
      onCommit(result.cmd, result.label);
    }
    setJustCommitted(confirmLabel);
    setTimeout(() => setJustCommitted(null), 2000);
    reset();
  }

  function applyStepValue(patch) {
    const newQe = { ...qe, ...patch };
    const newSteps = getQuickEntrySteps(effectivePlayType, newQe, ctx);
    const stillMissing = newSteps.find((s) => newQe[s.key] === undefined);
    if (!stillMissing) {
      const result = buildQuickEntryCommand(effectivePlayType, newQe, offenseRoster, defenseRoster, lastPlay, ctx.offenseTeam, state);
      if (result) {
        const flagged = implausibleYardageIn(result);
        if (flagged) {
          // Hold off on committing - surface a one-tap confirmation
          // instead, naming the exact number so it's obvious at a glance
          // whether it's a genuine long play or a typo.
          setPendingConfirm({ result, newQe, flaggedField: flagged.field, flaggedValue: flagged.value });
          return;
        }
        doCommit(result);
      } else {
        reset();
      }
    } else {
      setQe(newQe);
      setCustomYards("");
      setFieldSpotSide("own");
      setEnterByEndSpot(false);
      setPlayerSearch("");
    }
  }

  function goBack() {
    if (!currentStep) return;
    const idx = steps.indexOf(currentStep);
    if (idx === 0) {
      reset();
      return;
    }
    const prevKey = steps[idx - 1].key;
    setQe((q) => {
      const next = { ...q };
      delete next[prevKey];
      return next;
    });
    setCustomYards("");
  }

  const btnStyle = (extra) => ({
    padding: "10px 8px",
    borderRadius: 8,
    border: "1px solid #2C4A38",
    background: "#0F241A",
    color: "#EDE8DB",
    fontSize: 13,
    fontWeight: 600,
    cursor: "pointer",
    ...extra,
  });

  useEffect(() => {
    if (state.awaitingKickoff && playType !== "kickoff") setPlayType("kickoff");
  }, [state.awaitingKickoff]);

  if (!effectivePlayType) {
    const availableButtons = state.awaitingPAT
      ? PLAY_TYPE_BUTTONS.filter((b) => b.type === "extra_point" || b.type === "two_point_conversion")
      : PLAY_TYPE_BUTTONS;
    return (
      <div>
        {justCommitted && (
          <div style={{ background: "rgba(76,215,135,0.15)", border: "1px solid #4CD787", borderRadius: 8, padding: "10px 12px", marginBottom: 10, fontSize: 13, color: "#4CD787" }}>
            ✓ {justCommitted}
          </div>
        )}
        {state.awaitingKickoff && <div style={{ fontSize: 13, color: "#F5B700", marginBottom: 8 }}>Kickoff needed…</div>}
        {state.awaitingPAT && <div style={{ fontSize: 13, color: "#F5B700", marginBottom: 8 }}>Extra point attempt needed</div>}
        <div style={{ fontSize: 12, letterSpacing: 1, color: "#7FA08C", textTransform: "uppercase", marginBottom: 8 }}>What happened?</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          {availableButtons.map((b) => (
            <button key={b.type} onClick={() => setPlayType(b.type)} style={btnStyle()}>
              {b.label}
            </button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <button onClick={goBack} style={{ padding: "4px 10px", borderRadius: 6, border: "1px solid #2C4A38", background: "transparent", color: "#9DBBA8", fontSize: 12, cursor: "pointer" }}>
          ‹ Back
        </button>
        <button
          onClick={() => setQuickMode((q) => !q)}
          style={{
            padding: "4px 10px",
            borderRadius: 6,
            border: `1px solid ${quickMode ? "#F5B700" : "#2C4A38"}`,
            background: quickMode ? "rgba(245,183,0,0.15)" : "transparent",
            color: quickMode ? "#F5B700" : "#7FA08C",
            fontSize: 12,
            fontWeight: 700,
            cursor: "pointer",
          }}
        >
          ⚡ Quick Mode {quickMode ? "ON" : "OFF"}
        </button>
        <div style={{ fontSize: 11, color: "#7FA08C" }}>{PLAY_TYPE_BUTTONS.find((b) => b.type === effectivePlayType)?.label}</div>
      </div>

      {pendingConfirm && (
        <div style={{ background: "rgba(245,183,0,0.12)", border: "1px solid #F5B700", borderRadius: 8, padding: 14, marginBottom: 10 }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#F5B700", marginBottom: 6 }}>
            That's a {Math.abs(pendingConfirm.flaggedValue)}-yard {pendingConfirm.flaggedValue < 0 ? "loss" : "gain"}
            {pendingConfirm.flaggedField === "adjustPreviousPlay.yards" ? " on the foul-spot adjustment" : ""} — is that right?
          </div>
          <div style={{ fontSize: 12, color: "#9DBBA8", marginBottom: 12, lineHeight: 1.4 }}>{pendingConfirm.result.label}</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => {
                const r = pendingConfirm.result;
                setPendingConfirm(null);
                doCommit(r);
              }}
              style={btnStyle({ flex: 1, background: "#F5B700", color: "#081410", fontWeight: 700 })}
            >
              Yes, log it
            </button>
            <button
              onClick={() => {
                // Send them back to re-enter just the flagged number,
                // rather than discarding every other answer they already
                // gave. A foul-spot-driven adjustment isn't itself a qe
                // field - the actual editable step behind it is foulSpot.
                const keyToClear = pendingConfirm.flaggedField === "adjustPreviousPlay.yards" ? "ballSpot" : pendingConfirm.flaggedField;
                setQe((q) => {
                  const next = { ...q };
                  delete next[keyToClear];
                  return next;
                });
                setPendingConfirm(null);
              }}
              style={btnStyle({ flex: 1 })}
            >
              No, let me fix it
            </button>
          </div>
        </div>
      )}

      {!pendingConfirm && currentStep && currentStep.kind === "player" && (
        <div>
          <div style={{ fontSize: 13, marginBottom: 8, color: "#EDE8DB" }}>{currentStep.label}</div>
          <input
            type="text"
            value={playerSearch}
            onChange={(e) => setPlayerSearch(e.target.value)}
            placeholder="Search by name or number… (everyone's always listed below)"
            style={{
              width: "100%",
              padding: "10px",
              borderRadius: 6,
              border: "1px solid #2C4A38",
              background: "#142E21",
              color: "#EDE8DB",
              fontSize: 13,
              marginBottom: 10,
              boxSizing: "border-box",
            }}
          />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {rankPlayersForRole(
              currentStep.role === "defender" || currentStep.role === "returner"
                ? defenseRoster
                : currentStep.role === "foulCommitter"
                ? (currentStep.forceSide || qe.penalizedSide) === "offense"
                  ? offenseRoster
                  : defenseRoster
                : offenseRoster,
              currentStep.role,
              recentPlayers[currentStep.role] || []
            )
              .filter((p) => p.id !== currentStep.excludeId)
              .filter((p) => {
                if (!playerSearch.trim()) return true;
                const q = playerSearch.trim().toLowerCase();
                return p.fullName.toLowerCase().includes(q) || String(p.jerseyNumber).includes(q);
              })
              .map((p) => (
                <button
                  key={p.id}
                  onClick={() => {
                    onPlayerUsed(currentStep.role, p.id);
                    applyStepValue({ [currentStep.key]: p.id });
                  }}
                  style={btnStyle()}
                >
                  #{p.jerseyNumber} {p.fullName}
                </button>
              ))}
          </div>
          {currentStep.noTackleReasons && (
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              {currentStep.noTackleReasons.includes("out_of_bounds") && (
                <button
                  onClick={() => applyStepValue({ [currentStep.key]: null, tackleNote: "out_of_bounds" })}
                  style={btnStyle({ flex: 1, background: "transparent", color: "#4aa3f2", borderColor: "#4aa3f2" })}
                >
                  Out of Bounds
                </button>
              )}
              {currentStep.noTackleReasons.includes("slide") && (
                <button
                  onClick={() => applyStepValue({ [currentStep.key]: null, tackleNote: "slide" })}
                  style={btnStyle({ flex: 1, background: "transparent", color: "#4aa3f2", borderColor: "#4aa3f2" })}
                >
                  Slide
                </button>
              )}
            </div>
          )}
          {currentStep.allowSkip && (
            <button onClick={() => applyStepValue({ [currentStep.key]: null })} style={btnStyle({ marginTop: 8, width: "100%", background: "transparent", color: "#7FA08C" })}>
              {currentStep.noTackleReasons ? "Tackle, unknown who" : "Skip / Unknown"}
            </button>
          )}
        </div>
      )}

      {currentStep && currentStep.kind === "choice" && (
        <div>
          <div style={{ fontSize: 13, marginBottom: 8, color: "#EDE8DB" }}>{currentStep.label}</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {currentStep.options.map((o) => (
              <button key={String(o.value)} onClick={() => applyStepValue({ [currentStep.key]: o.value })} style={btnStyle()}>
                {o.label}
              </button>
            ))}
          </div>
        </div>
      )}

      {currentStep && currentStep.kind === "infraction" && (
        <div>
          <div style={{ fontSize: 13, marginBottom: 8, color: "#EDE8DB" }}>{currentStep.label}</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 6 }}>
            {PENALTY_INFRACTIONS.filter((i) => i.side === (currentStep.forceSide || qe.penalizedSide) && !(currentStep.excludePreSnap && i.timing === "pre_snap")).map((i) => (
              <button
                key={i.id}
                onClick={() => applyStepValue({ [currentStep.key]: i.id })}
                style={btnStyle({ textAlign: "left", display: "flex", justifyContent: "space-between" })}
              >
                <span>{i.label}</span>
                <span style={{ color: "#F5B700" }}>
                  {i.yards} yd{i.autoFirstDown ? " · Auto 1st" : ""}
                  {i.lossOfDown ? " · Loss of down" : ""}
                </span>
              </button>
            ))}
          </div>
        </div>
      )}

      {currentStep && currentStep.kind === "yards" && !enterByEndSpot && (
        <div>
          <div style={{ fontSize: 13, marginBottom: 8, color: "#EDE8DB" }}>{currentStep.label}</div>

          {currentStep.allowEndSpotEntry && (
            <button
              onClick={() => setEnterByEndSpot(true)}
              style={btnStyle({
                width: "100%",
                marginBottom: 12,
                padding: "14px 12px",
                fontSize: 14,
                fontWeight: 700,
                background: "rgba(74,163,242,0.12)",
                border: "1.5px solid #4aa3f2",
                color: "#4aa3f2",
              })}
            >
              📍 Enter the yard line it ended at
            </button>
          )}

          {quickMode && currentStep.allowEndSpotEntry && (
            <div style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 10, color: "#7FA08C", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 5 }}>
                ⚡ Quick mode — tap a name to credit the tackle, or skip it
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {rankPlayersForRole(defenseRoster, "defender", recentPlayers.defender || [])
                  .slice(0, 4)
                  .map((p) => (
                    <button
                      key={p.id}
                      onClick={() => {
                        const next = quickTackler === p.id ? null : p.id;
                        setQuickTackler(next);
                        if (next) onPlayerUsed("defender", next);
                      }}
                      style={{
                        padding: "6px 10px",
                        borderRadius: 14,
                        border: `1px solid ${quickTackler === p.id ? "#F5B700" : "#2C4A38"}`,
                        background: quickTackler === p.id ? "rgba(245,183,0,0.15)" : "transparent",
                        color: quickTackler === p.id ? "#F5B700" : "#9DBBA8",
                        fontSize: 11,
                        fontWeight: 600,
                        cursor: "pointer",
                      }}
                    >
                      #{p.jerseyNumber} {p.fullName}
                    </button>
                  ))}
              </div>
            </div>
          )}

          {currentStep.allowEndSpotEntry && (
            <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>Or pick yards gained</div>
          )}

          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6, marginBottom: 8 }}>
            {(currentStep.presets || (currentStep.forceNegative ? NEGATIVE_YARDS_PRESETS : YARDS_PRESETS)).map((y) => (
              <button
                key={y}
                onClick={() => applyStepValue({ [currentStep.key]: y, ...(quickMode && currentStep.allowEndSpotEntry ? { tackler: quickTackler } : {}) })}
                style={btnStyle({ padding: "8px 4px", fontSize: 12, color: y < 0 ? "#E0483D" : "#EDE8DB" })}
              >
                {y}
              </button>
            ))}
            {!currentStep.forceNegative &&
              !currentStep.presets &&
              NEGATIVE_YARDS_PRESETS.slice(0, 4).map((y) => (
                <button
                  key={y}
                  onClick={() => applyStepValue({ [currentStep.key]: y, ...(quickMode && currentStep.allowEndSpotEntry ? { tackler: quickTackler } : {}) })}
                  style={btnStyle({ padding: "8px 4px", fontSize: 12, color: "#E0483D" })}
                >
                  {y}
                </button>
              ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
            <input
              type="number"
              value={customYards}
              onChange={(e) => setCustomYards(e.target.value)}
              placeholder="Custom"
              style={{ flex: 1, padding: "8px", borderRadius: 6, border: "1px solid #2C4A38", background: "#142E21", color: "#EDE8DB", fontSize: 13 }}
            />
            <button
              onClick={() => {
                const n = parseInt(customYards, 10);
                if (Number.isFinite(n))
                  applyStepValue({
                    [currentStep.key]: currentStep.forceNegative ? -Math.abs(n) : n,
                    ...(quickMode && currentStep.allowEndSpotEntry ? { tackler: quickTackler } : {}),
                  });
              }}
              style={btnStyle({ padding: "8px 16px" })}
            >
              Use
            </button>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {currentStep.allowTouchdown && (
              <button onClick={() => applyStepValue({ touchdown: true, [currentStep.key]: 0 })} style={btnStyle({ flex: 1, background: "#F5B700", color: "#081410" })}>
                TOUCHDOWN
              </button>
            )}
            {currentStep.allowSkip && (
              <button onClick={() => applyStepValue({ [currentStep.key]: 0 })} style={btnStyle({ flex: 1, background: "transparent", color: "#7FA08C" })}>
                Skip (0)
              </button>
            )}
          </div>
        </div>
      )}

      {currentStep && currentStep.kind === "yards" && enterByEndSpot && (
        <div>
          <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4, color: "#EDE8DB" }}>What yard line did the play end at?</div>
          <div style={{ fontSize: 11, color: "#9DBBA8", marginBottom: 10, lineHeight: 1.4 }}>
            Currently at {describeFieldPosition(state.fieldPosition, ctx.offenseTeam)}. Enter where the play ended and the app will work out the yardage.
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <button
              onClick={() => setFieldSpotSide("own")}
              style={btnStyle({ flex: 1, padding: "14px 8px", fontSize: 15, background: fieldSpotSide === "own" ? "#F5B700" : "transparent", color: fieldSpotSide === "own" ? "#081410" : "#EDE8DB" })}
            >
              {teams ? `${teams[ctx.offenseTeam]?.name || ctx.offenseTeam} side` : "OWN"}
            </button>
            <button
              onClick={() => setFieldSpotSide("opp")}
              style={btnStyle({ flex: 1, padding: "14px 8px", fontSize: 15, background: fieldSpotSide === "opp" ? "#F5B700" : "transparent", color: fieldSpotSide === "opp" ? "#081410" : "#EDE8DB" })}
            >
              {teams ? `${teams[other(ctx.offenseTeam)]?.name || other(ctx.offenseTeam)} side` : "OPP"}
            </button>
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
            {[5, 10, 15, 20, 25, 30, 35, 40, 45, 50].map((y) => (
              <button
                key={y}
                type="button"
                onClick={() => {
                  const endSpot = absoluteFromRelative(fieldSpotSide, y, ctx.offenseTeam);
                  const gained = yardsFromOwnGoal(endSpot, ctx.offenseTeam) - yardsFromOwnGoal(state.fieldPosition, ctx.offenseTeam);
                  applyStepValue({ [currentStep.key]: gained, ...(quickMode && currentStep.allowEndSpotEntry ? { tackler: quickTackler } : {}) });
                }}
                style={btnStyle({ width: "calc(33.33% - 6px)", padding: "16px 4px", fontSize: 16, fontWeight: 700, minHeight: 48, boxSizing: "border-box" })}
              >
                {y}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
            <input
              type="number"
              value={customYards}
              onChange={(e) => setCustomYards(e.target.value)}
              placeholder="Yard #"
              min="0"
              max="50"
              style={{ flex: 1, padding: "12px", borderRadius: 6, border: "1px solid #2C4A38", background: "#142E21", color: "#EDE8DB", fontSize: 15 }}
            />
            <button
              type="button"
              onClick={() => {
                const n = parseInt(customYards, 10);
                if (Number.isFinite(n) && n >= 0 && n <= 50) {
                  const endSpot = absoluteFromRelative(fieldSpotSide, n, ctx.offenseTeam);
                  const gained = yardsFromOwnGoal(endSpot, ctx.offenseTeam) - yardsFromOwnGoal(state.fieldPosition, ctx.offenseTeam);
                  applyStepValue({ [currentStep.key]: gained, ...(quickMode && currentStep.allowEndSpotEntry ? { tackler: quickTackler } : {}) });
                }
              }}
              style={btnStyle({ padding: "12px 18px", fontSize: 15 })}
            >
              Use
            </button>
          </div>
          <button onClick={() => setEnterByEndSpot(false)} style={{ background: "none", border: "none", color: "#7FA08C", fontSize: 12, textDecoration: "underline", cursor: "pointer", padding: 0 }}>
            ← Back to entering yards gained
          </button>
        </div>
      )}

      {currentStep && currentStep.kind === "fieldspot" && (
        <div>
          <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4, color: "#EDE8DB" }}>{currentStep.shortLabel || currentStep.label}</div>
          {currentStep.sublabel && <div style={{ fontSize: 11, color: "#9DBBA8", marginBottom: 4, lineHeight: 1.4 }}>{currentStep.sublabel}</div>}
          {/* "OWN"/"OPP" alone is ambiguous mid-turnover (own/opp relative
              to WHOM?) - naming the actual team on each half removes that
              ambiguity entirely, regardless of who currently has the ball. */}
          {teams && currentStep.team && (

const SAVED_ROSTERS_KEY = "gridiron-saved-rosters";

async function readSavedRosters() {
  try {
    const res = await storage.get(SAVED_ROSTERS_KEY, false);
    if (!res || !res.value) return [];
    const list = JSON.parse(res.value);
    return Array.isArray(list) ? list : [];
  } catch (e) {
    return [];
  }
}

/** Save / load whole team rosters (name, abbreviation, color, players) so a
 *  team that shows up week after week only has to be entered once. */
function SavedRostersPanel({ team, teamData, onLoadRoster }) {
  const [saved, setSaved] = useState([]);
  const [status, setStatus] = useState("");
  const [selectedName, setSelectedName] = useState("");

  useEffect(() => {
    let alive = true;
    readSavedRosters().then((list) => {
      if (alive) setSaved(list);
    });
    return () => {
      alive = false;
    };
  }, []);

  async function persist(list) {
    await storage.set(SAVED_ROSTERS_KEY, JSON.stringify(list), false);
    setSaved(list);
  }

  async function handleSave() {
    const name = (teamData.name || "").trim();
    if (!name || teamData.roster.length === 0) {
      setStatus("Give the team a name and add players first.");
      return;
    }
    try {
      const current = await readSavedRosters();
      const existing = current.find((r) => r.name.toLowerCase() === name.toLowerCase());
      if (existing && !window.confirm(`A saved roster named "${existing.name}" already exists. Replace it?`)) return;
      const entry = {
        name,
        abbreviation: teamData.abbreviation || "",
        color: teamData.color,
        savedAt: new Date().toISOString(),
        players: teamData.roster.map((p) => ({
          jerseyNumber: p.jerseyNumber,
          firstName: p.firstName,
          lastName: p.lastName,
          fullName: p.fullName,
          position: p.position,
          aliases: p.aliases || [],
          active: p.active !== false,
        })),
      };
      const next = [...current.filter((r) => r.name.toLowerCase() !== name.toLowerCase()), entry].sort((a, b) => a.name.localeCompare(b.name));
      await persist(next);
      setSelectedName(entry.name);
      setStatus(`Saved "${entry.name}" (${entry.players.length} players).`);
    } catch (e) {
      setStatus("Couldn't save the roster (storage may be full).");
    }
  }

  function handleLoad() {
    const entry = saved.find((r) => r.name === selectedName);
    if (!entry) return;
    if (teamData.roster.length > 0 && !window.confirm(`Replace the current ${teamData.roster.length}-player roster with "${entry.name}"?`)) return;
    onLoadRoster(team, entry);
    setStatus(`Loaded "${entry.name}".`);
  }

  async function handleDelete() {
    const entry = saved.find((r) => r.name === selectedName);
    if (!entry) return;
    if (!window.confirm(`Delete the saved roster "${entry.name}"? This can't be undone.`)) return;
    try {
      const current = await readSavedRosters();
      await persist(current.filter((r) => r.name !== entry.name));
      setSelectedName("");
      setStatus(`Deleted "${entry.name}".`);
    } catch (e) {
      setStatus("Couldn't delete that roster.");
    }
  }

  const smallBtn = { padding: "6px 12px", borderRadius: 6, border: "1px solid #2C4A38", background: "#0F241A", color: "#EDE8DB", fontSize: 12, fontWeight: 600, cursor: "pointer" };
  return (
    <div style={{ marginTop: 10, marginBottom: 6, border: "1px dashed #2C4A38", borderRadius: 8, padding: 10 }}>
      <div style={{ fontSize: 11, color: "#7FA08C", textTransform: "uppercase", marginBottom: 6 }}>Saved rosters</div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
        <select
          value={selectedName}
          onChange={(e) => setSelectedName(e.target.value)}
          style={{ flex: 1, minWidth: 120, padding: "8px", borderRadius: 6, border: "1px solid #2C4A38", background: "#142E21", color: "#EDE8DB", fontSize: 13 }}
        >
          <option value="">{saved.length ? "Choose a saved roster…" : "No saved rosters yet"}</option>
          {saved.map((r) => (
            <option key={r.name} value={r.name}>
              {r.name} ({r.players.length})
            </option>
          ))}
        </select>
        <button type="button" onClick={handleLoad} disabled={!selectedName} style={{ ...smallBtn, opacity: selectedName ? 1 : 0.5 }}>
          Load
        </button>
        <button type="button" onClick={handleDelete} disabled={!selectedName} style={{ ...smallBtn, opacity: selectedName ? 1 : 0.5 }}>
          Delete
        </button>
      </div>
      <button type="button" onClick={handleSave} style={{ ...smallBtn, marginTop: 8, background: "#F5B700", color: "#081410", border: "none" }}>
        Save this roster for next time
      </button>
      {status && <div style={{ fontSize: 11, color: "#9DBBA8", marginTop: 6 }}>{status}</div>}
    </div>
  );
}

function generateId() {
  return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : `g${Date.now()}${Math.random()}`;
}

class GridironErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    // Logged for diagnosis - never silently swallowed. The underlying game
    // data is untouched by this: autosave writes on every commit, well
    // before render, so a render-time crash here cannot itself corrupt or
    // lose already-recorded plays.
    console.error("Gridiron crashed:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", background: "#081410", color: "#EDE8DB", padding: 20, fontFamily: "sans-serif" }}>
          <div style={{ fontSize: 18, fontWeight: 700, color: "#E0483D", marginBottom: 12 }}>The app hit an error and had to stop this screen</div>
          <div style={{ fontSize: 14, color: "#9DBBA8", marginBottom: 16, lineHeight: 1.5 }}>
            Your game data is not affected — every play is saved as soon as it's entered, well before anything gets displayed. Reloading should bring
            you right back to where you left off.
          </div>
          <div style={{ fontSize: 12, color: "#7FA08C", marginBottom: 16, fontFamily: "monospace", wordBreak: "break-word" }}>
            {String(this.state.error && this.state.error.message)}
          </div>
          <button
            onClick={() => window.location.reload()}
            style={{ padding: "12px 20px", borderRadius: 8, border: "none", background: "#F5B700", color: "#081410", fontWeight: 700, fontSize: 14, cursor: "pointer" }}
          >
            Reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saving | saved
  const [exportStatus, setExportStatus] = useState("idle"); // idle | ok | failed - the per-play auto-export, separate from in-browser saveStatus

  const [editingId, setEditingId] = useState(null);
  const [editYards, setEditYards] = useState("");
  const [inputText, setInputText] = useState("");
  const [pending, setPending] = useState(null);
