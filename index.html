<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#081410" />
<title>Gridiron Live 6.0</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #081410; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

// ============================================================
// ENGINE LOGIC — ported from src/engine/{downDistance,apply,replay}.ts
// Same rules, same absolute-field-coordinate approach, same
// "replay from history" correction model.
// ============================================================

const HOME = "HOME";
const AWAY = "AWAY";
const other = (t) => (t === HOME ? AWAY : HOME);

function clampField(y) {
  return Math.max(0, Math.min(100, y));
}
function advance(fieldPos, team, yards) {
  const delta = team === HOME ? yards : -yards;
  return clampField(fieldPos + delta);
}
function yardsToGoal(fieldPos, team) {
  return team === HOME ? 100 - fieldPos : fieldPos;
}
function yardsFromOwnGoal(fieldPos, team) {
  return team === HOME ? fieldPos : 100 - fieldPos;
}
function isTouchdown(fieldPos, team) {
  return yardsToGoal(fieldPos, team) <= 0;
}
function describeFieldPosition(fieldPos, possTeam) {
  const fromOwn = possTeam === HOME ? fieldPos : 100 - fieldPos;
  if (fromOwn === 50) return "50";
  if (fromOwn < 50) return `OWN ${Math.round(fromOwn)}`;
  return `OPP ${Math.round(100 - fromOwn)}`;
}

/** Inverse of describeFieldPosition: given "OWN 20" or "OPP 35" from a
 *  specific team's perspective, returns the absolute 0-100 field coordinate. */
function absoluteFromRelative(side, yardNum, team) {
  const fromOwn = side === "own" ? yardNum : 100 - yardNum;
  return team === HOME ? fromOwn : 100 - fromOwn;
}

/** Inverse of absoluteFromRelative: given an absolute 0-100 field
 *  coordinate, returns { side: "own"|"opp", yard } from the given team's
 *  perspective. Used to default yard-line pickers to the current line of
 *  scrimmage instead of opening blank. */
function relativeFromAbsolute(fieldPos, team) {
  const fromOwn = team === HOME ? fieldPos : 100 - fieldPos;
  if (fromOwn <= 50) return { side: "own", yard: Math.round(fromOwn) };
  return { side: "opp", yard: Math.round(100 - fromOwn) };
}

function computeNextDownDistance({ down, distance, yardsGained, yardsToGoalAfter, automaticFirstDown, lossOfDown }) {
  if (yardsToGoalAfter <= 0) return { down: null, distance: null, firstDown: true, turnoverOnDowns: false };

  if (lossOfDown) {
    if (down === 4) return { down: null, distance: null, firstDown: false, turnoverOnDowns: true };
    return { down: down + 1, distance: Math.min(distance, yardsToGoalAfter), firstDown: false, turnoverOnDowns: false };
  }

  const remaining = distance - yardsGained;
  const madeFirstDown = automaticFirstDown || remaining <= 0;
  if (madeFirstDown) {
    return { down: 1, distance: Math.min(10, yardsToGoalAfter), firstDown: true, turnoverOnDowns: false };
  }
  if (down === 4) return { down: null, distance: null, firstDown: false, turnoverOnDowns: true };
  return { down: down + 1, distance: Math.min(remaining, yardsToGoalAfter), firstDown: false, turnoverOnDowns: false };
}

function initialState(quarterLengthMinutes, openingKickingTeam) {
  const clock = `${quarterLengthMinutes ?? 12}:00`;
  const kickingTeam = openingKickingTeam ?? HOME;
  const kickoffLine = kickingTeam === HOME ? 40 : 60;
  return {
    quarter: 1,
    clock,
    down: null,
    distance: null,
    fieldPosition: kickoffLine,
    possession: kickingTeam,
    homeScore: 0,
    awayScore: 0,
    awaitingPAT: false,
    awaitingKickoff: true,
  };
}

function applyPlay(state, cmd, sequence) {
  const possession = state.possession;
  const defense = other(possession);
  const fieldBefore = state.fieldPosition;
  let yards = cmd.yards ?? 0;
  let fieldAfter = advance(fieldBefore, possession, yards);

  let result = "gain";
  let firstDown = false;
  let touchdown = false;
  let turnover = false;
  let nextPossession = possession;
  let nextDown = state.down;
  let nextDistance = state.distance;
  let scoringTeam = null;
  let points = 0;
  let awaitingPAT = state.awaitingPAT;
  let awaitingKickoff = state.awaitingKickoff;

  const down = state.down ?? 1;
  const distance = state.distance ?? 10;

  if (cmd.type === "run" || cmd.type === "pass_complete" || cmd.type === "sack") {
    if (isTouchdown(fieldAfter, possession)) {
      touchdown = true;
      result = "touchdown";
      scoringTeam = possession;
      points = 6;
      nextDown = null;
      nextDistance = null;
    } else {
      const dd = computeNextDownDistance({ down, distance, yardsGained: yards, yardsToGoalAfter: yardsToGoal(fieldAfter, possession) });
      firstDown = dd.firstDown;
      if (dd.turnoverOnDowns) {
        result = "turnover_on_downs";
        turnover = true;
        nextPossession = defense;
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
      } else {
        nextDown = dd.down;
        nextDistance = dd.distance;
        result = firstDown ? "first_down" : yards < 0 ? "loss" : yards === 0 ? "no_gain" : "gain";
      }
    }
  } else if (cmd.type === "pass_incomplete") {
    result = "incomplete";
    fieldAfter = fieldBefore;
    const dd = computeNextDownDistance({ down, distance, yardsGained: 0, yardsToGoalAfter: yardsToGoal(fieldAfter, possession) });
    if (dd.turnoverOnDowns) {
      turnover = true;
      result = "turnover_on_downs";
      nextPossession = defense;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
    } else {
      nextDown = dd.down;
      nextDistance = dd.distance;
    }
  } else if (cmd.type === "interception") {
    result = "turnover";
    turnover = true;
    nextPossession = defense;
    // The interception spot may be well downfield from the snap - use it
    // directly if given, falling back to the line of scrimmage for older
    // data. Critically: a return moves in the DEFENSE's direction, not the
    // offense's - this was previously using the generic top-of-function
    // fieldAfter, which advanced in the offense's direction (backwards).
    const turnoverSpot = cmd.turnoverSpot != null ? clampField(cmd.turnoverSpot) : fieldBefore;
    if (cmd.touchdownAsserted) {
      // Pick-six: the DEFENSE scores. possession stays with them for the
      // scoring bookkeeping (touchdown/scoringTeam), then the kickoff flow
      // (triggered by the PAT that follows) sends the ball back the other way.
      touchdown = true;
      result = "touchdown";
      scoringTeam = defense;
      points = 6;
      fieldAfter = defense === HOME ? 100 : 0;
      nextDown = null;
      nextDistance = null;
    } else {
      fieldAfter = advance(turnoverSpot, defense, yards || 0);
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
    }
  } else if (cmd.type === "safety") {
    // The offense's own ball carrier was tackled (or the ball otherwise
    // became dead) in their own end zone. Defense scores 2, and the
    // scored-against team free-kicks from their own 20 - NOT the normal
    // 40-yard kickoff line.
    result = "safety";
    scoringTeam = defense;
    points = 2;
    fieldAfter = possession === HOME ? 20 : 80;
    nextPossession = possession; // they still "have" the free kick coming
    nextDown = null;
    nextDistance = null;
  } else if (cmd.type === "fumble") {
    if (cmd.recoveredBy === "out_of_bounds") {
      // Ball went out of bounds - dead, stays with whoever had it, no
      // turnover. Down progresses exactly like an ordinary play that
      // ended at this spot.
      result = "fumble_out_of_bounds";
      turnover = false;
      nextPossession = possession;
      fieldAfter = cmd.turnoverSpot != null ? clampField(cmd.turnoverSpot) : fieldBefore;
      const dd = computeNextDownDistance({ down, distance, yardsGained: yardsFromOwnGoal(fieldAfter, possession) - yardsFromOwnGoal(fieldBefore, possession), yardsToGoalAfter: yardsToGoal(fieldAfter, possession) });
      firstDown = dd.firstDown;
      if (dd.turnoverOnDowns) {
        result = "turnover_on_downs";
        turnover = true;
        nextPossession = defense;
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
      } else {
        nextDown = dd.down;
        nextDistance = dd.distance;
      }
    } else if (cmd.recoveredBy === "offense") {
      // Offense recovers its own fumble — not a turnover. Treated like a
      // down consumed at (roughly) this spot, same shape as a run play.
      if (cmd.touchdownAsserted) {
        touchdown = true;
        result = "touchdown";
        scoringTeam = possession;
        points = 6;
        nextDown = null;
        nextDistance = null;
      } else {
        const dd = computeNextDownDistance({ down, distance, yardsGained: yards, yardsToGoalAfter: yardsToGoal(fieldAfter, possession) });
        firstDown = dd.firstDown;
        if (dd.turnoverOnDowns) {
          result = "turnover_on_downs";
          turnover = true;
          nextPossession = defense;
          nextDown = 1;
          nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
        } else {
          nextDown = dd.down;
          nextDistance = dd.distance;
          result = firstDown ? "first_down" : "fumble_recovered_offense";
        }
      }
    } else {
      // Defense recovers — turnover, with optional return yardage or a
      // scoop-and-score touchdown (same pattern as an interception return).
      result = "turnover";
      turnover = true;
      nextPossession = defense;
      const turnoverSpot = cmd.turnoverSpot != null ? clampField(cmd.turnoverSpot) : fieldBefore;
      if (cmd.touchdownAsserted) {
        touchdown = true;
        result = "touchdown";
        scoringTeam = defense;
        points = 6;
        fieldAfter = defense === HOME ? 100 : 0;
        nextDown = null;
        nextDistance = null;
      } else {
        fieldAfter = advance(turnoverSpot, defense, yards || 0);
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
      }
    }
  } else if (cmd.type === "penalty") {
    if (cmd.logOnly) {
      // Recorded for the penalty count/yardage stats only - deliberately
      // does not touch field position, down, distance, or possession.
      // Used when the underlying situation already isn't a live down (a
      // touchdown was just scored and the game is now awaiting the try) -
      // the normal accepted-penalty math below has no path that leaves
      // down/distance untouched, so running a real foul on a scoring
      // return through it would incorrectly manufacture a phantom down
      // where the game should just be moving to the PAT/2pt attempt.
      result = "penalty";
      fieldAfter = fieldBefore;
      nextDown = state.down;
      nextDistance = state.distance;
      yards = cmd.infraction ? cmd.infraction.yards : 0;
    } else {
      // Normally a penalty enforces from the current situation. But per NFHS
      // rule, a foul that happens DURING a play (e.g. a hold on a 35-yard
      // run) is enforced from the spot the down STARTED at, not where the
      // play ended up — regardless of how far downfield the foul actually
      // occurred. When the operator flags "this happened on the previous
      // play," the caller supplies that play's own before-state here so
      // enforcement is correct.
      const enforceFieldBefore = cmd.fieldPositionOverride ?? fieldBefore;
      const enforceDown = cmd.downOverride ?? down;
      const enforceDistance = cmd.distanceOverride ?? distance;

      if (cmd.offsetting) {
      // Offsetting: the down is REPLAYED at the original spot, full stop.
      // Force these back to the override values rather than inheriting
      // whatever down/distance the (yards-zeroed) nullified play computed
      // through normal down-progression logic - a 0-yard gain still
      // mechanically advances the down under normal rules, which is wrong
      // here: offsetting means this down never happened.
      result = "offsetting";
      fieldAfter = enforceFieldBefore;
      nextDown = enforceDown;
      nextDistance = enforceDistance;
    } else if (!cmd.accepted) {
      result = "declined";
      fieldAfter = fieldBefore;
      nextDown = state.down;
      nextDistance = state.distance;
    } else {
      const infraction = cmd.infraction;
      const favorsOffense = cmd.penalizedSide === "defense";
      const direction = favorsOffense ? 1 : -1;
      // Half-the-distance-to-goal cap: a penalty can never advance the
      // ball more than half the remaining distance to whichever goal
      // line is relevant.
      const relevantGoalDistance = favorsOffense ? yardsToGoal(enforceFieldBefore, possession) : yardsToGoal(enforceFieldBefore, defense);
      const cappedYards = Math.min(infraction.yards, Math.max(Math.floor(relevantGoalDistance / 2), 0));
      fieldAfter = advance(enforceFieldBefore, possession, direction * cappedYards);
      // When the operator gave the final ball spot, that spot (not the
      // table yardage) decides where the ball is and how much progress
      // was made toward the line to gain.
      const spotBased = cmd.finalSpot != null;
      let progress = direction * cappedYards;
      if (spotBased) {
        fieldAfter = clampField(cmd.finalSpot);
        progress = yardsFromOwnGoal(fieldAfter, possession) - yardsFromOwnGoal(enforceFieldBefore, possession);
      }
      yards = cappedYards; // record actual enforced yardage on the play, for stats — magnitude only, direction is implied by penalizedSide

      if (infraction.lossOfDown) {
        if (enforceDown === 4) {
          result = "turnover_on_downs";
          turnover = true;
          nextPossession = defense;
          nextDown = 1;
          nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
        } else {
          nextDown = enforceDown + 1;
          nextDistance = spotBased
            ? Math.max(1, Math.min(enforceDistance - progress, yardsToGoal(fieldAfter, possession)))
            : Math.min(enforceDistance, yardsToGoal(fieldAfter, possession));
          result = "loss_of_down";
        }
      } else if (infraction.autoFirstDown) {
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, possession));
        result = "first_down";
        firstDown = true;
      } else {
        // A live-ball foul (holding, etc.) during an already-started down
        // ADDS to the existing line to gain - it does NOT reset to a flat
        // 10, even when that down happens to be 1st down. Confirmed
        // against NFHS's own worked example: 1st & 10 from the 40, a hold
        // at the 30 enforced from the previous spot (the 40) produces
        // 1st & 20 from the 30 - the penalty yards stack onto the
        // existing 10, they don't get thrown away. (The "a new series
        // can never have more than 10 yards to gain" rule is a different
        // thing - it governs dead-ball fouls stacking up BEFORE a new
        // series is even snapped, not a live-ball foul during one.)
        const distanceDelta = progress;
        if (enforceDistance - distanceDelta <= 0) {
          // After enforcement the ball is at or past the line to gain (a
          // defensive foul's yardage reaching it, or an offensive foul
          // enforced from a spot far enough downfield) - that's a new
          // first down, not "2nd & 1".
          nextDown = 1;
          nextDistance = Math.min(10, yardsToGoal(fieldAfter, possession));
          result = "first_down";
          firstDown = true;
        } else {
          nextDown = enforceDown; // penalty replays the same down
          nextDistance = Math.max(1, Math.min(enforceDistance - distanceDelta, yardsToGoal(fieldAfter, possession)));
          result = "penalty";
        }
      }
    }
    }
  } else if (cmd.type === "kickoff") {
    const kickingTeam = possession;
    const receivingTeam = defense;
    const kickoffLine = fieldBefore; // previous spot, for the 25-yard OOB rule and the re-kick penalty

    if (cmd.result === "touchback") {
      // NFHS: touchback is spotted at the receiving team's own 20 (verified
      // against the current rulebook — this differs from the NFL's 35 and
      // isn't the same number across rule sets, so don't assume).
      fieldAfter = receivingTeam === HOME ? 20 : 80;
      nextPossession = receivingTeam;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, receivingTeam));
      result = "touchback";
    } else if (cmd.result === "fair_catch") {
      fieldAfter = clampField(cmd.caughtAtSpot ?? fieldBefore);
      nextPossession = receivingTeam;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, receivingTeam));
      result = "fair_catch";
    } else if (cmd.result === "muffed_kicking_recovers") {
      // A clean kick the returner drops - recoverable by either team. The
      // kicking team recovering it is a genuine turnover the other way.
      fieldAfter = clampField(cmd.recoverySpot ?? fieldBefore);
      nextPossession = kickingTeam;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, kickingTeam));
      result = "muffed_recovered_kicking";
    } else if (cmd.result === "muffed_receiving_recovers") {
      fieldAfter = clampField(cmd.recoverySpot ?? fieldBefore);
      nextPossession = receivingTeam;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, receivingTeam));
      result = "muffed_recovered_receiving";
    } else if (cmd.result === "return") {
      // Exact yard lines, entered by the operator — no assumed catch depth.
      fieldAfter = clampField(cmd.returnedToSpot ?? fieldBefore);
      nextPossession = receivingTeam;
      if (cmd.touchdownAsserted) {
        touchdown = true;
        result = "touchdown";
        scoringTeam = receivingTeam;
        points = 6;
        nextDown = null;
        nextDistance = null;
      } else {
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, receivingTeam));
        result = "return";
      }
    } else if (cmd.result === "out_of_bounds_spot") {
      // NFHS option 1: receiving team takes the ball at the exact spot
      // it went out of bounds.
      fieldAfter = clampField(cmd.oobSpot ?? fieldBefore);
      nextPossession = receivingTeam;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, receivingTeam));
      result = "out_of_bounds_spot";
    } else if (cmd.result === "out_of_bounds_25") {
      // NFHS option 2: receiving team's ball 25 yards from the previous
      // spot (the kickoff line), toward their own goal.
      fieldAfter = advance(kickoffLine, kickingTeam, -25);
      nextPossession = receivingTeam;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, receivingTeam));
      result = "out_of_bounds_25";
    } else if (cmd.result === "out_of_bounds_rekick") {
      // NFHS option 3: kicking team re-kicks, penalized 5 yards from the
      // previous spot. Possession doesn't change — another kickoff is
      // still owed (see awaitingKickoff below).
      fieldAfter = advance(kickoffLine, kickingTeam, -5);
      nextPossession = kickingTeam;
      nextDown = null;
      nextDistance = null;
      result = "out_of_bounds_rekick";
    } else if (cmd.result === "onside_kicking_recovers") {
      fieldAfter = clampField(cmd.recoverySpot ?? kickoffLine);
      nextPossession = kickingTeam;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, kickingTeam));
      result = "onside_recovered_kicking";
    } else if (cmd.result === "onside_receiving_recovers") {
      fieldAfter = clampField(cmd.recoverySpot ?? kickoffLine);
      nextPossession = receivingTeam;
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, receivingTeam));
      result = "onside_recovered_receiving";
    }

    // Return yardage, derived from the two entered spots — used for stats/
    // description, not for determining field position (that's the spot
    // itself now, entered directly).
    if (cmd.result === "return" && cmd.caughtAtSpot != null) {
      yards = yardsFromOwnGoal(fieldAfter, receivingTeam) - yardsFromOwnGoal(clampField(cmd.caughtAtSpot), receivingTeam);
    } else {
      yards = 0;
    }
  } else if (cmd.type === "set_clock") {
    nextDown = state.down;
    nextDistance = state.distance;
    fieldAfter = fieldBefore;
  } else if (cmd.type === "start_second_half") {
    nextPossession = cmd.kickingTeam;
    nextDown = null;
    nextDistance = null;
    fieldAfter = cmd.kickingTeam === HOME ? 40 : 60;
    result = "start_second_half";
  } else if (cmd.type === "start_overtime") {
    // NFHS overtime: each team gets a possession starting at the
    // opponent's 10-yard line. cmd.fieldPosition is computed by the
    // caller (absoluteFromRelative("opp", 10, team)) so this branch
    // doesn't need its own HOME/AWAY direction logic duplicated.
    nextPossession = cmd.team;
    fieldAfter = clampField(cmd.fieldPosition);
    nextDown = 1;
    nextDistance = Math.min(10, yardsToGoal(fieldAfter, cmd.team));
    result = "start_overtime";
  } else if (cmd.type === "set_possession") {
    nextPossession = cmd.team;
    fieldAfter = cmd.fieldPosition != null ? clampField(cmd.fieldPosition) : fieldBefore;
    nextDown = cmd.down != null ? cmd.down : 1;
    nextDistance = cmd.distance != null ? cmd.distance : Math.min(10, yardsToGoal(fieldAfter, cmd.team));
    result = "possession_change";
  } else if (cmd.type === "punt") {
    if (cmd.blocked) {
      const blockSpot = cmd.blockSpot != null ? clampField(cmd.blockSpot) : fieldBefore;
      if (cmd.recoveredBy === "defense") {
        result = "blocked_punt_turnover";
        turnover = true;
        nextPossession = defense;
        if (cmd.touchdownAsserted) {
          touchdown = true;
          result = "touchdown";
          scoringTeam = defense;
          points = 6;
          fieldAfter = defense === HOME ? 100 : 0;
          nextDown = null;
          nextDistance = null;
        } else {
          fieldAfter = advance(blockSpot, defense, cmd.yards || 0);
          nextDown = 1;
          nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
        }
      } else {
        // Punting team recovers their own blocked kick - not a turnover.
        // Down/distance intentionally left as-is rather than guessed; the
        // manual ball-position tool covers whatever the real ruling was.
        result = "blocked_punt_recovered_own";
        turnover = false;
        nextPossession = possession;
        fieldAfter = blockSpot;
      }
    } else if (cmd.muffed) {
      const muffSpot = cmd.recoverySpot != null ? clampField(cmd.recoverySpot) : fieldBefore;
      if (cmd.muffRecoveredBy === "kicking") {
        result = "muffed_punt_recovered_kicking";
        turnover = false;
        nextPossession = possession;
        fieldAfter = muffSpot;
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, possession));
      } else {
        result = "muffed_punt_recovered_receiving";
        turnover = true;
        nextPossession = defense;
        fieldAfter = muffSpot;
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
      }
    } else if (cmd.fieldedAtSpot != null && !cmd.touchback) {
      // Spot-based punt: the operator gave the yard line the ball was
      // fielded/downed at and (if returned) where the return ended.
      turnover = true;
      nextPossession = defense;
      const fielded = clampField(cmd.fieldedAtSpot);
      const ended = cmd.returnedToSpot != null ? clampField(cmd.returnedToSpot) : fielded;
      if (cmd.touchdownAsserted) {
        touchdown = true;
        result = "touchdown";
        scoringTeam = defense;
        points = 6;
        fieldAfter = defense === HOME ? 100 : 0;
        nextDown = null;
        nextDistance = null;
      } else {
        result = cmd.returnedToSpot != null ? "return" : "gain";
        fieldAfter = ended;
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
      }
      // Net punt yardage (from the line of scrimmage to where the receiving
      // team ends up), measured in the punting team's direction.
      yards = touchdown
        ? yardsFromOwnGoal(fielded, possession) - yardsFromOwnGoal(fieldBefore, possession)
        : yardsFromOwnGoal(fieldAfter, possession) - yardsFromOwnGoal(fieldBefore, possession);
    } else {
      result = "gain";
      turnover = true;
      nextPossession = defense;
      const rawFieldAfter = advance(fieldBefore, possession, cmd.yards ?? 40);
      const crossedGoalLine = possession === HOME ? rawFieldAfter >= 100 : rawFieldAfter <= 0;
      if (cmd.touchback || crossedGoalLine) {
        result = "touchback";
        fieldAfter = defense === HOME ? 20 : 80;
      } else {
        fieldAfter = clampField(rawFieldAfter);
      }
      nextDown = 1;
      nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
    }
  } else if (cmd.type === "field_goal") {
    if (cmd.result === "good") {
      result = "good";
      scoringTeam = possession;
      points = 3;
    } else {
      result = cmd.result === "blocked" ? "blocked" : "no_good";
      turnover = true;
      nextPossession = defense;
      if (cmd.touchdownAsserted) {
        touchdown = true;
        result = "touchdown";
        scoringTeam = defense;
        points = 6;
        fieldAfter = defense === HOME ? 100 : 0;
        nextDown = null;
        nextDistance = null;
      } else {
        fieldAfter = advance(fieldBefore, defense, cmd.yards || 0);
        nextDown = 1;
        nextDistance = Math.min(10, yardsToGoal(fieldAfter, defense));
      }
    }
  } else if (cmd.type === "extra_point") {
    result = cmd.result === "good" ? "good" : "no_good";
    if (result === "good") {
      scoringTeam = possession;
      points = 1;
    }
  } else if (cmd.type === "two_point_conversion") {
    result = cmd.result === "good" ? "good" : "no_good";
    if (result === "good") {
      scoringTeam = possession;
      points = 2;
    }
  }

  // Any touchdown always needs a PAT/2pt attempt next. A made field goal,
  // or ANY PAT/2pt attempt (made or missed — a kickoff follows regardless),
  // always needs a kickoff next. A kickoff resolves the pending state
  // UNLESS the specific outcome is "out of bounds, re-kick" (5-yard penalty,
  // kicking team kicks again) — that's the one kickoff outcome that leaves
  // another kickoff still owed.
  if (touchdown) awaitingPAT = true;
  if (cmd.type === "extra_point" || cmd.type === "two_point_conversion") {
    awaitingPAT = false;
    awaitingKickoff = true;
  }
  if (cmd.type === "field_goal" && cmd.result === "good") awaitingKickoff = true;
  if (cmd.type === "safety") awaitingKickoff = true;
  if (cmd.type === "kickoff") awaitingKickoff = cmd.result === "out_of_bounds_rekick";
  if (cmd.type === "start_second_half") awaitingKickoff = true;

  // quarterOverride/clockOverride let a play's OWN recorded time be
  // corrected after the fact — this is what makes "what did the clock
  // read when this play ended" apply to the scoring play itself, not just
  // to whatever comes after it. A plain set_clock command still exists
  // for "just move the clock forward" with no specific play in mind.
  const effectiveQuarter = cmd.quarterOverride ?? (cmd.type === "set_clock" || cmd.type === "start_second_half" || cmd.type === "start_overtime" ? cmd.quarter : state.quarter);
  const effectiveClock = cmd.clockOverride ?? (cmd.type === "set_clock" || cmd.type === "start_second_half" || cmd.type === "start_overtime" ? cmd.clock : state.clock);

  // A play whose down is being replayed because of an accepted penalty
  // can't also have earned a first down on its own yardage.
  if (cmd.suppressFirstDown) firstDown = false;

  const play = {
    id: cmd.id || `p${sequence}`,
    sequence,
    quarter: effectiveQuarter,
    clock: effectiveClock,
    down: state.down,
    distance: state.distance,
    fieldPositionBefore: fieldBefore,
    possession,
    label: cmd.label,
    playType: cmd.type,
    passerId: cmd.passerId,
    receiverId: cmd.receiverId,
    rusherId: cmd.rusherId,
    kickerId: cmd.kickerId,
    punterId: cmd.punterId,
    defenderId: cmd.defenderId,
    interceptedById: cmd.interceptedById,
    recoveredBy: cmd.recoveredBy,
    fumbleRecoveredById: cmd.fumbleRecoveredById,
    // Yards the carrier gained BEFORE losing the ball - kept separate from
    // `yards` (which, when the defense recovers, means return yardage
    // instead) so individual rushing/receiving stats can credit the right
    // number regardless of who ends up with the ball.
    yardsBeforeFumble: cmd.yardsBeforeFumble,
    fumbleForcedById: cmd.fumbleForcedById,
    committedById: cmd.committedById,
    conversionType: cmd.conversionType,
    fgDistance: cmd.distance,
    setScoreHome: cmd.type === "set_score" ? cmd.homeScore : undefined,
    setScoreAway: cmd.type === "set_score" ? cmd.awayScore : undefined,
    tacklerIds: cmd.tacklerIds,
    returnerId: cmd.returnerId,
    yards,
    result,
    firstDown,
    touchdown,
    turnover,
    fieldPositionAfter: fieldAfter,
    infraction: cmd.infraction,
    penalizedSide: cmd.penalizedSide,
    accepted: cmd.accepted,
    driveYards: cmd.driveYards,
  };

  const newState = {
    ...state,
    fieldPosition: fieldAfter,
    possession: nextPossession,
    down: nextDown,
    distance: nextDistance,
    quarter: effectiveQuarter,
    clock: effectiveClock,
    homeScore: cmd.type === "set_score" ? cmd.homeScore : state.homeScore + (scoringTeam === HOME ? points : 0),
    awayScore: cmd.type === "set_score" ? cmd.awayScore : state.awayScore + (scoringTeam === AWAY ? points : 0),
    awaitingPAT,
    awaitingKickoff,
  };

  return { play, newState };
}

function replay(commands, quarterLengthMinutes, openingKickingTeam) {
  let state = initialState(quarterLengthMinutes, openingKickingTeam);
  const plays = [];
  commands.forEach((cmd, i) => {
    const { play, newState } = applyPlay(state, cmd, i + 1);
    plays.push(play);
    state = newState;
  });
  return { state, plays };
}

// ============================================================
// DRIVE ENGINE — ported from src/engine/drives.ts
// ============================================================

const NON_DRIVE_PLAY_TYPES = new Set(["set_possession", "set_clock", "set_score"]);

function classifyDriveResult(lastPlay) {
  if (lastPlay.touchdown) return "TOUCHDOWN";
  if (lastPlay.result === "safety") return "SAFETY";
  if (lastPlay.playType === "field_goal") return lastPlay.result === "good" ? "FIELD GOAL" : "MISSED FG";
  if (lastPlay.playType === "punt") return "PUNT";
  if (lastPlay.playType === "kickoff") return "KICKOFF";
  if (lastPlay.playType === "extra_point") return "PAT";
  if (lastPlay.playType === "two_point_conversion") return "2-PT CONVERSION";
  if (lastPlay.result === "turnover_on_downs") return "TURNOVER ON DOWNS";
  if (lastPlay.turnover) return "TURNOVER";
  return "IN PROGRESS";
}

// Trailing special-teams/bonus plays that follow a score and share its
// team (kickoff, PAT, 2-pt try). They stay attached to the drive that just
// ended — for Play-by-Play, which wants everything in order — but never
// start a drive of their own, so a kickoff with nothing open to attach to
// (opening kickoff of the game/half, after a safety) just isn't part of
// any drive.
const DRIVE_TRAILING_PLAY_TYPES = new Set(["kickoff", "extra_point", "two_point_conversion"]);
// What actually counts as one of the offense's plays for the Drives tab
// (play count, yardage, first-down list) — i.e. real snaps, not the kick
// that ended the drive or the PAT/kickoff that followed it.
const DRIVE_STAT_PLAY_TYPES = new Set(["run", "pass_complete", "pass_incomplete", "sack", "interception", "fumble", "field_goal", "penalty", "kneel", "spike", "safety"]);

function buildDrives(plays) {
  const drives = [];
  let current = null; // { team, plays, lockedResult }
  let driveNumber = 0;

  const flush = () => {
    if (!current || current.plays.length === 0) {
      current = null;
      return;
    }
    driveNumber += 1;
    const first = current.plays[0];
    const last = current.plays[current.plays.length - 1];
    const offensivePlays = current.plays.filter((p) => DRIVE_STAT_PLAY_TYPES.has(p.playType));
    // A fumble's own `yards` field means return yardage once the defense
    // has recovered it - that belongs to the other team's eventual drive,
    // never this one. This drive's total only ever counts the offense's
    // own forward progress, including the pre-fumble gain.
    // Penalty plays store the enforced yardage as a magnitude; the sign
    // comes from who was penalized (offense = lost ground, defense =
    // gained ground), so drive yardage stays net of penalties.
    const driveYardsOf = (p) =>
      p.playType === "fumble"
        ? p.yardsBeforeFumble || 0
        : p.playType === "penalty"
        ? p.driveYards != null ? p.driveYards : p.accepted ? (p.penalizedSide === "offense" ? -1 : 1) * (p.yards || 0) : 0
        : p.yards;
    const yards = offensivePlays.reduce((s, p) => s + driveYardsOf(p), 0);
    const firstDowns = offensivePlays.filter((p) => p.firstDown).length;
    const lastOffensivePlay = offensivePlays[offensivePlays.length - 1];
    drives.push({
      driveNumber,
      team: current.team,
      plays: current.plays, // full list, incl. the punt/kickoff/PAT that closed it — used by Play-by-Play
      offensivePlays, // real snaps only — used by the Drives tab
      startFieldPosition: first.fieldPositionBefore,
      endFieldPosition: (lastOffensivePlay || last).fieldPositionAfter,
      startQuarter: first.quarter,
      startClock: first.clock,
      yards,
      firstDowns,
      result: current.lockedResult || classifyDriveResult(last),
    });
    current = null;
  };

  for (const play of plays) {
    if (NON_DRIVE_PLAY_TYPES.has(play.playType)) {
      flush();
      continue;
    }

    if (DRIVE_TRAILING_PLAY_TYPES.has(play.playType)) {
      if (current && current.team === play.possession) current.plays.push(play);
      continue;
    }

    if (!current || current.team !== play.possession) {
      flush();
      current = { team: play.possession, plays: [], lockedResult: null };
    }
    current.plays.push(play);

    if (play.touchdown || play.turnover || play.result === "turnover_on_downs" || play.result === "safety") {
      // Lock in the result now, but keep the drive open — a trailing
      // kickoff/PAT/2pt from this same team (handled above) should still
      // attach here rather than spawning its own stray drive. It
      // physically flushes once a real snap from the OTHER team arrives.
      current.lockedResult = classifyDriveResult(play);
    }
  }
  flush();
  return drives;
}

// ============================================================
// STATISTICS ENGINE — ported from src/stats/{team,player}.ts
// ============================================================

const OFFENSIVE_PLAY_TYPES = new Set(["run", "pass_complete", "pass_incomplete", "sack", "interception", "fumble"]);
function round1(n) {
  return Math.round(n * 10) / 10;
}

function computeTeamOffenseStats(plays, team) {
  const offPlays = plays.filter((p) => p.possession === team && OFFENSIVE_PLAY_TYPES.has(p.playType));
  const rushPlays = offPlays.filter((p) => p.playType === "run");
  const passAttemptPlays = offPlays.filter((p) => ["pass_complete", "pass_incomplete", "interception"].includes(p.playType));
  const completions = offPlays.filter((p) => p.playType === "pass_complete");
  const rushYards = rushPlays.reduce((s, p) => s + p.yards, 0);
  const sackYards = offPlays.filter((p) => p.playType === "sack").reduce((s, p) => s + p.yards, 0);
  const passYards = completions.reduce((s, p) => s + p.yards, 0) + sackYards;
  const totalYards = rushYards + passYards;
  const totalPlays = offPlays.length;
  const thirdDownPlays = offPlays.filter((p) => p.down === 3);
  const fourthDownPlays = offPlays.filter((p) => p.down === 4);
  const turnovers = offPlays.filter((p) => p.turnover).length;
  const interceptionsThrown = offPlays.filter((p) => p.playType === "interception").length;
  const fumblesLost = offPlays.filter((p) => p.playType === "fumble" && p.turnover).length;
  // Penalty-awarded first downs (e.g. defensive holding) aren't in
  // OFFENSIVE_PLAY_TYPES, so they need to be counted separately here.
  const penaltyFirstDowns = plays.filter((p) => p.playType === "penalty" && p.possession === team && p.firstDown).length;

  return {
    firstDowns: offPlays.filter((p) => p.firstDown).length + penaltyFirstDowns,
    rushAttempts: rushPlays.length,
    rushYards,
    passAttempts: passAttemptPlays.length,
    completions: completions.length,
    completionPct: passAttemptPlays.length ? round1((completions.length / passAttemptPlays.length) * 100) : 0,
    passYards,
    totalPlays,
    totalYards,
    yardsPerPlay: totalPlays ? round1(totalYards / totalPlays) : 0,
    touchdowns: offPlays.filter((p) => p.touchdown).length,
    interceptionsThrown,
    fumblesLost,
    thirdDownConv: `${thirdDownPlays.filter((p) => p.firstDown || p.touchdown).length}/${thirdDownPlays.length}`,
    fourthDownConv: `${fourthDownPlays.filter((p) => p.firstDown || p.touchdown).length}/${fourthDownPlays.length}`,
    turnovers,
  };
}

function computePassingTable(plays, roster, team) {
  const rows = roster
    .map((player) => {
      const attempts = plays.filter((p) => p.passerId === player.id && p.possession === team && ["pass_complete", "pass_incomplete", "interception"].includes(p.playType));
      const completions = plays.filter((p) => p.passerId === player.id && p.possession === team && p.playType === "pass_complete");
      const sacks = plays.filter((p) => p.passerId === player.id && p.possession === team && p.playType === "sack");
      const yards = completions.reduce((s, p) => s + p.yards, 0);
      const sackYardsLost = Math.abs(sacks.reduce((s, p) => s + p.yards, 0));
      if (attempts.length === 0) return null;
      return {
        player,
        comp: completions.length,
        att: attempts.length,
        yards,
        avg: attempts.length ? round1(yards / attempts.length) : 0,
        td: completions.filter((p) => p.touchdown).length,
        int: plays.filter((p) => p.passerId === player.id && p.possession === team && p.playType === "interception").length,
        sacks: `${sacks.length}-${sackYardsLost}`,
      };
    })
    .filter(Boolean);

  if (rows.length === 0) return null;
  const team_ = {
    comp: rows.reduce((s, r) => s + r.comp, 0),
    att: rows.reduce((s, r) => s + r.att, 0),
    yards: rows.reduce((s, r) => s + r.yards, 0),
    td: rows.reduce((s, r) => s + r.td, 0),
    int: rows.reduce((s, r) => s + r.int, 0),
    sackCount: rows.reduce((s, r) => s + parseInt(r.sacks.split("-")[0], 10), 0),
    sackYards: rows.reduce((s, r) => s + parseInt(r.sacks.split("-")[1], 10), 0),
  };
  team_.avg = team_.att ? round1(team_.yards / team_.att) : 0;
  return { rows, team: team_ };
}

// A fumble logged as a standalone play (not a sub-event of a run/pass)
// still represents real rushing/receiving yardage up to the point the ball
// came out - this is the number to credit the carrier with, never the
// turnover's own `yards` field (which means return yardage once the
// defense has recovered it).
function statYardsForCarry(p) {
  return p.playType === "fumble" ? p.yardsBeforeFumble || 0 : p.yards;
}

function computeRushingTable(plays, roster, team) {
  const rows = roster
    .map((player) => {
      const carries = plays.filter(
        (p) => p.possession === team && ((p.playType === "run" && p.rusherId === player.id) || (p.playType === "fumble" && p.rusherId === player.id))
      );
      if (carries.length === 0) return null;
      const yards = carries.reduce((s, p) => s + statYardsForCarry(p), 0);
      return {
        player,
        car: carries.length,
        yards,
        avg: round1(yards / carries.length),
        td: carries.filter((p) => p.touchdown).length,
        long: Math.max(...carries.map(statYardsForCarry)),
      };
    })
    .filter(Boolean);

  if (rows.length === 0) return null;
  const car = rows.reduce((s, r) => s + r.car, 0);
  const yards = rows.reduce((s, r) => s + r.yards, 0);
  return {
    rows,
    team: { car, yards, avg: car ? round1(yards / car) : 0, td: rows.reduce((s, r) => s + r.td, 0), long: Math.max(...rows.map((r) => r.long)) },
  };
}

function computeReceivingTable(plays, roster, team) {
  const rows = roster
    .map((player) => {
      // A catch that was then fumbled still counts as a completed target -
      // it was caught, which is exactly what "pass_complete" represents,
      // it's just logged as "fumble" once the ball comes out afterward.
      const targets = plays.filter(
        (p) =>
          p.possession === team &&
          p.receiverId === player.id &&
          (["pass_complete", "pass_incomplete"].includes(p.playType) || p.playType === "fumble")
      );
      if (targets.length === 0) return null;
      const receptions = plays.filter((p) => p.possession === team && p.receiverId === player.id && (p.playType === "pass_complete" || p.playType === "fumble"));
      const yards = receptions.reduce((s, p) => s + statYardsForCarry(p), 0);
      return {
        player,
        rec: receptions.length,
        yards,
        avg: receptions.length ? round1(yards / receptions.length) : 0,
        td: receptions.filter((p) => p.touchdown).length,
        long: receptions.length ? Math.max(...receptions.map(statYardsForCarry)) : 0,
        tgts: targets.length,
      };
    })
    .filter(Boolean);

  if (rows.length === 0) return null;
  const rec = rows.reduce((s, r) => s + r.rec, 0);
  const yards = rows.reduce((s, r) => s + r.yards, 0);
  return {
    rows,
    team: { rec, yards, avg: rec ? round1(yards / rec) : 0, td: rows.reduce((s, r) => s + r.td, 0), long: Math.max(...rows.map((r) => r.long)), tgts: rows.reduce((s, r) => s + r.tgts, 0) },
  };
}

/** A sack counts as both a sack AND a tackle-for-loss, per standard
 *  convention — a defender's total "tackles" always includes their sacks. */
function computeDefenseTable(plays, roster, team) {
  const opponent = other(team);
  const opponentPlays = plays.filter((p) => p.possession === opponent);

  const rows = roster
    .map((player) => {
      const tacklePlays = plays.filter((p) => p.possession === opponent && p.tacklerIds && p.tacklerIds.includes(player.id));
      const sackPlays = plays.filter((p) => p.possession === opponent && p.playType === "sack" && p.defenderId === player.id);
      const intPlays = plays.filter((p) => p.possession === opponent && p.playType === "interception" && p.interceptedById === player.id);
      const ffPlays = plays.filter((p) => p.possession === opponent && p.fumbleForcedById === player.id);
      const frPlays = plays.filter((p) => p.possession === opponent && p.fumbleRecoveredById === player.id);
      const defTDs = plays.filter((p) => p.possession === opponent && p.touchdown && (p.interceptedById === player.id || p.fumbleRecoveredById === player.id));

      const tackles = tacklePlays.length + sackPlays.length;
      const tfl = tacklePlays.filter((p) => p.yards < 0).length + sackPlays.length;
      const hasStats = tackles > 0 || intPlays.length > 0 || ffPlays.length > 0 || frPlays.length > 0;
      if (!hasStats) return null;

      return {
        player,
        tackles,
        tfl,
        sacks: sackPlays.length,
        int: intPlays.length,
        ff: ffPlays.length,
        fr: frPlays.length,
        td: defTDs.length,
      };
    })
    .filter(Boolean);

  // Team-level sacks/TFL/INT/fumble-recoveries are derived directly from
  // the play log — NOT summed from individual rows — so they're still
  // accurate even when a play went for a loss but nobody was credited
  // with the stop. This mirrors how team offense stats never require a
  // named player either.
  const teamSacks = opponentPlays.filter((p) => p.playType === "sack").length;
  const teamTFL = opponentPlays.filter(
    (p) => p.playType === "sack" || (["run", "pass_complete"].includes(p.playType) && p.yards < 0)
  ).length;
  const teamInt = opponentPlays.filter((p) => p.playType === "interception").length;
  const teamFR = opponentPlays.filter((p) => p.playType === "fumble" && p.turnover).length;
  const teamFF = rows.reduce((s, r) => s + r.ff, 0); // no play-type-derivable definition; credited only
  const teamTD = rows.reduce((s, r) => s + r.td, 0);
  const teamTackles = rows.reduce((s, r) => s + r.tackles, 0); // ditto — "team tackles" isn't independently derivable

  if (rows.length === 0 && teamSacks === 0 && teamTFL === 0 && teamInt === 0 && teamFR === 0) return null;

  return {
    rows,
    team: { tackles: teamTackles, tfl: teamTFL, sacks: teamSacks, int: teamInt, ff: teamFF, fr: teamFR, td: teamTD },
  };
}

/** Field goals and PATs, per kicker. FG distance comes straight off the
 *  play (play.fgDistance), so "long" and the per-attempt distance list are
 *  both real recorded numbers, not re-derived from field position. */
function computeKickingTable(plays, roster, team) {
  const rows = roster
    .map((player) => {
      const fgAttempts = plays.filter((p) => p.kickerId === player.id && p.possession === team && p.playType === "field_goal");
      const patAttempts = plays.filter((p) => p.kickerId === player.id && p.possession === team && p.playType === "extra_point");
      if (fgAttempts.length === 0 && patAttempts.length === 0) return null;
      const fgMade = fgAttempts.filter((p) => p.result === "good");
      const patMade = patAttempts.filter((p) => p.result === "good");
      const distances = fgAttempts.map((p) => p.fgDistance).filter((d) => typeof d === "number");
      return {
        player,
        fgm: fgMade.length,
        fga: fgAttempts.length,
        fgLong: distances.length ? Math.max(...distances) : null,
        fgDistances: fgAttempts.map((p) => `${p.fgDistance ?? "?"}${p.result === "good" ? "" : p.result === "blocked" ? " (blocked)" : " (no good)"}`),
        patm: patMade.length,
        pata: patAttempts.length,
      };
    })
    .filter(Boolean);

  if (rows.length === 0) return null;
  const allFgDistances = rows.flatMap((r) => r.fgDistances.map((_, i) => r.player)).length
    ? plays.filter((p) => p.possession === team && p.playType === "field_goal" && typeof p.fgDistance === "number").map((p) => p.fgDistance)
    : [];
  return {
    rows,
    team: {
      fgm: rows.reduce((s, r) => s + r.fgm, 0),
      fga: rows.reduce((s, r) => s + r.fga, 0),
      fgLong: allFgDistances.length ? Math.max(...allFgDistances) : null,
      patm: rows.reduce((s, r) => s + r.patm, 0),
      pata: rows.reduce((s, r) => s + r.pata, 0),
    },
  };
}

// ============================================================
// BOX SCORE GENERATOR — composes drives/stats/scoring plays into a
// shareable report. Nothing here computes football rules; it only reads
// already-derived play data, same separation as the rest of the app.
// ============================================================

function findPlayerName(teams, team, id) {
  const player = teams[team].roster.find((p) => p.id === id);
  return player ? player.fullName : "Unknown";
}

/** The team credited with a score isn't always play.possession — on an
 *  interception-return touchdown, the DEFENSE scores while play.possession
 *  still records the team that got picked off. Every place that attributes
 *  a score to a team must go through this, not read play.possession directly. */
function scoringTeamFor(play) {
  if (play.touchdown && play.playType === "interception") return other(play.possession);
  if (play.touchdown && play.playType === "fumble" && play.recoveredBy === "defense") return other(play.possession);
  if (play.touchdown && play.playType === "kickoff") return other(play.possession);
  if (play.playType === "safety") return other(play.possession);
  return play.possession;
}

function describeScoringPlay(play, teams) {
  const scoringTeam = scoringTeamFor(play);
  const team = teams[scoringTeam];
  if (play.touchdown) {
    if (play.playType === "pass_complete") {
      return `${findPlayerName(teams, play.possession, play.receiverId)} ${play.yards} yd pass from ${findPlayerName(teams, play.possession, play.passerId)}`;
    }
    if (play.playType === "run") {
      return `${findPlayerName(teams, play.possession, play.rusherId)} ${play.yards} yd run`;
    }
    if (play.playType === "interception") {
      return `${findPlayerName(teams, scoringTeam, play.interceptedById)} ${play.yards} interception return`;
    }
    if (play.playType === "fumble" && play.recoveredBy === "defense") {
      return `${findPlayerName(teams, scoringTeam, play.fumbleRecoveredById)} ${play.yards} fumble return`;
    }
    if (play.playType === "fumble" && play.recoveredBy === "offense") {
      return `${findPlayerName(teams, play.possession, play.rusherId)} ${play.yards} yd run`;
    }
    if (play.playType === "kickoff") {
      return `${findPlayerName(teams, scoringTeam, play.returnerId)} ${play.yards} yd kickoff return`;
    }
    return `${team.name} touchdown`;
  }
  if (play.playType === "safety") {
    return `${team.name} safety`;
  }
  if (play.playType === "field_goal") return `${findPlayerName(teams, play.possession, play.kickerId) || team.name} ${play.fgDistance ? `${play.fgDistance} yd ` : ""}field goal`.trim();
  if (play.playType === "extra_point") return `${team.name} PAT good`;
  if (play.playType === "two_point_conversion") {
    if (play.conversionType === "pass") {
      return `${findPlayerName(teams, play.possession, play.receiverId)} two-point conversion from ${findPlayerName(teams, play.possession, play.passerId)}`;
    }
    if (play.conversionType === "run") {
      return `${findPlayerName(teams, play.possession, play.rusherId)} two-point conversion`;
    }
    return `${team.name} two-point conversion good`;
  }
  return `${team.name} scores`;
}

// ============================================================
// NEWSPAPER-STYLE BOX SCORE — matches the AP/local-paper recap format:
// headline, linescore, scoring plays grouped by quarter (TD merged with
// its PAT/2pt attempt on one line), team stats, and prose individual
// stats sorted by production. This is the "correct format" reference —
// see conversation history for the exact target example.
// ============================================================

const QUARTER_WORDS = { 1: "First", 2: "Second", 3: "Third", 4: "Fourth" };
function quarterLabel(q) {
  return q <= 4 ? `Q${q}` : `OT${q - 4}`;
}

function formatYardsAP(y) {
  return y < 0 ? `(minus ${Math.abs(y)})` : String(y);
}

function tdSuffix(td) {
  if (!td) return "";
  return td === 1 ? " TD" : ` ${td} TDs`;
}

/** Per-team, per-quarter scoring, plus the running total — the linescore. */
function computeLinescore(plays, teams) {
  const byTeamQuarter = { HOME: {}, AWAY: {} };
  let maxQuarter = 4;
  for (const p of plays) {
    let points = 0;
    let scoringTeam = null;
    if (p.touchdown) {
      points = 6;
      scoringTeam = scoringTeamFor(p);
    } else if (p.playType === "field_goal" && p.result === "good") {
      points = 3;
      scoringTeam = p.possession;
    } else if (p.playType === "extra_point" && p.result === "good") {
      points = 1;
      scoringTeam = p.possession;
    } else if (p.playType === "two_point_conversion" && p.result === "good") {
      points = 2;
      scoringTeam = p.possession;
    } else if (p.playType === "safety") {
      points = 2;
      scoringTeam = scoringTeamFor(p);
    }
    if (!scoringTeam) continue;
    byTeamQuarter[scoringTeam][p.quarter] = (byTeamQuarter[scoringTeam][p.quarter] || 0) + points;
    if (p.quarter > maxQuarter) maxQuarter = p.quarter;
  }
  const quarters = Array.from({ length: maxQuarter }, (_, i) => i + 1);
  const rowFor = (team) => {
    const perQ = quarters.map((q) => byTeamQuarter[team][q] || 0);
    const total = perQ.reduce((s, n) => s + n, 0);
    return { perQ, total };
  };
  return { quarters, HOME: rowFor(HOME), AWAY: rowFor(AWAY) };
}

/** Merges each touchdown with the conversion attempt immediately
 *  following it (if any), matching the newspaper convention of one line
 *  per score. Groups the result by quarter. */
function buildScoringPlaysByQuarter(plays, teams) {
  const scoringTypes = new Set(["field_goal", "extra_point", "two_point_conversion"]);
  const byQuarter = {};

  for (let i = 0; i < plays.length; i++) {
    const p = plays[i];
    const isTD = p.touchdown;
    const isFG = p.playType === "field_goal" && p.result === "good";
    const isSafety = p.playType === "safety";
    if (!isTD && !isFG && !isSafety) continue;

    let conversionText = "";
    if (isTD) {
      let next = null;
      for (let j = i + 1; j < plays.length; j++) {
        if (plays[j].playType === "penalty") continue; // skip dead-ball fouls between the score and the try
        next = plays[j];
        break;
      }
      if (next && (next.playType === "extra_point" || next.playType === "two_point_conversion")) {
        if (next.playType === "extra_point") {
          if (next.result === "good") {
            const kicker = teams[next.possession].roster.find((pl) => pl.id === next.kickerId);
            conversionText = kicker ? `(${kicker.lastName} kick)` : "(kick good)";
          } else if (next.result === "blocked") {
            conversionText = "(kick blocked)";
          } else {
            conversionText = "(kick failed)";
          }
        } else {
          // two_point_conversion — now tracks the real attempt type. Old
          // saved games from before this existed won't have
          // conversionType; fall back to "run" as a label only (not a
          // stat) so those games still render sensibly.
          const kind = next.conversionType === "pass" ? "pass" : "run";
          const roster = teams[next.possession].roster;
          let who = "";
          if (kind === "run") {
            const rusher = roster.find((pl) => pl.id === next.rusherId);
            who = rusher ? ` (${rusher.lastName} run)` : "";
          } else {
            const passer = roster.find((pl) => pl.id === next.passerId);
            const receiver = roster.find((pl) => pl.id === next.receiverId);
            who = passer && receiver ? ` (${passer.lastName} pass to ${receiver.lastName})` : "";
          }
          conversionText = next.result === "good" ? `(2-point conversion good)${who}` : `(2-point conversion no good)${who}`;
        }
      }
    }

    const description = describeScoringPlay(p, teams);
    const abbrev = abbrevFor(teams, scoringTeamFor(p));
    const line = `${abbrev}--${description}${conversionText ? ` ${conversionText}` : ""}, ${p.clock}.`;

    if (!byQuarter[p.quarter]) byQuarter[p.quarter] = [];
    byQuarter[p.quarter].push(line);
  }
  return byQuarter;
}

function buildProseStatLine(table, teamLabel, separator) {
  if (!table || table.rows.length === 0) return `${teamLabel}${separator} No stats.`;
  const sorted = [...table.rows].sort((a, b) => b.yards - a.yards);
  const parts = sorted.map((r) => {
    if ("comp" in r) return `${r.player.fullName} ${r.comp}-${r.att}-${r.int} ${r.yards}${tdSuffix(r.td)}`;
    if ("car" in r) return `${r.player.fullName} ${r.car}-${formatYardsAP(r.yards)}${tdSuffix(r.td)}`;
    return `${r.player.fullName} ${r.rec}-${formatYardsAP(r.yards)}${tdSuffix(r.td)}`;
  });
  return `${teamLabel}${separator} ${parts.join(", ")}.`;
}

// Words making up a team's "school title", excluding the mascot. A
// multi-word name (e.g. "Williamsport Millionaires") is assumed to end in
// the mascot, so only the words before it count; a single-word name (e.g.
// "Selinsgrove") is the school name itself.
function schoolTitleWords(name) {
  const words = (name || "").trim().split(/\s+/).filter(Boolean);
  if (words.length > 1) return words.slice(0, -1);
  return words;
}

// Auto-derives a 1-3 letter abbreviation from the school's own name (not
// its mascot). If it collides with the other team's abbreviation, it's
// extended — first by trying another word in its own school title, falling
// back to the next letter of its first word — so e.g. "Williamsport" vs
// "Wyoming Valley" resolves to "W" / "WV" rather than "W" / "W".
function abbrevFor(teams, team) {
  if (teams[team].abbreviation) return teams[team].abbreviation;
  const other = team === "HOME" ? "AWAY" : "HOME";
  // Compare against whatever the OTHER side will actually display — a
  // custom abbreviation they typed in, or their own auto-derived one —
  // so a manually-set abbreviation on one team still triggers
  // disambiguation on the other, not just two auto-derived initials.
  const otherAbbr = teams[other].abbreviation || initialOf(teams[other].name);
  return disambiguateAbbreviation(teams[team].name, otherAbbr);
}

function initialOf(name) {
  const words = schoolTitleWords(name);
  return words[0] ? words[0][0].toUpperCase() : "?";
}

function disambiguateAbbreviation(name, otherAbbr) {
  const words = schoolTitleWords(name);
  const base = initialOf(name);
  if (base !== otherAbbr) return base;
  if (words.length > 1 && words[1] && words[1][0]) {
    const withOtherWord = base + words[1][0].toUpperCase();
    if (withOtherWord !== otherAbbr) return withOtherWord;
  }
  const firstWord = words[0] || "";
  for (let len = 2; len <= firstWord.length; len++) {
    const extended = firstWord.slice(0, len).toUpperCase();
    if (extended !== otherAbbr) return extended;
  }
  return base;
}

// ============================================================
// VALIDATION ENGINE — the spec's "Validate Game" feature. Because state
// here is always DERIVED fresh from the play log (never hand-patched),
// many classic box-score bugs (player/team totals disagreeing, etc.) are
// structurally impossible rather than something to check for. What's
// actually worth checking is data-entry mistakes that are still
// internally "valid" — wrong player picked, a roster edited out from
// under an old play, a typo'd yardage — plus a few defensive sanity
// checks against future engine bugs.
// ============================================================

function findAnyPlayer(teams, id) {
  return teams.HOME.roster.find((p) => p.id === id) || teams.AWAY.roster.find((p) => p.id === id);
}

function validateGame(plays, teams, state) {
  const issues = [];
  const add = (severity, message, play) => issues.push({ severity, message, playId: play ? play.id : null, sequence: play ? play.sequence : null });

  // Field position and down/distance sanity — should be structurally
  // impossible given the engine, but checked as a defensive backstop.
  for (const p of plays) {
    if (p.fieldPositionBefore < 0 || p.fieldPositionBefore > 100 || p.fieldPositionAfter < 0 || p.fieldPositionAfter > 100) {
      add("error", `Impossible field position on "${p.label}"`, p);
    }
    if (p.down !== null && ![1, 2, 3, 4].includes(p.down)) {
      add("error", `Impossible down (${p.down}) on "${p.label}"`, p);
    }
    if (p.distance !== null && (p.distance < 0 || p.distance > 100)) {
      add("warning", `Unusual distance (${p.distance}) on "${p.label}"`, p);
    }
    if (Math.abs(p.yards) > 99) {
      add("warning", `Unusually large single-play yardage (${p.yards}) on "${p.label}" — field is only 100 yards`, p);
    }
  }

  // Roster referential integrity — a player used in a play but no longer
  // on either roster (e.g. removed after the fact via the Setup tab).
  const playerFields = ["passerId", "receiverId", "rusherId", "kickerId", "punterId", "interceptedById", "defenderId", "fumbleRecoveredById", "fumbleForcedById", "committedById", "returnerId"];
  for (const p of plays) {
    for (const field of playerFields) {
      const id = p[field];
      if (id && !findAnyPlayer(teams, id)) {
        add("warning", `"${p.label}" references a player no longer on either roster (${field})`, p);
      }
    }
    if (p.tacklerIds) {
      for (const id of p.tacklerIds) {
        if (id && !findAnyPlayer(teams, id)) {
          add("warning", `"${p.label}" references a tackler no longer on either roster`, p);
        }
      }
    }
  }

  // Interception logic: the passer and the interceptor should never be on
  // the same team — would indicate the wrong player was picked.
  for (const p of plays) {
    if (p.playType === "interception" && p.passerId && p.interceptedById) {
      const passerTeam = teams.HOME.roster.some((pl) => pl.id === p.passerId) ? HOME : teams.AWAY.roster.some((pl) => pl.id === p.passerId) ? AWAY : null;
      const interceptorTeam = teams.HOME.roster.some((pl) => pl.id === p.interceptedById) ? HOME : teams.AWAY.roster.some((pl) => pl.id === p.interceptedById) ? AWAY : null;
      if (passerTeam && interceptorTeam && passerTeam === interceptorTeam) {
        add("error", `Interception on "${p.label}" credits the passer's own team — likely wrong player selected`, p);
      }
    }
  }

  // Score reconciliation: recompute total points from scoring plays and
  // compare against the derived final state. Should always match — a
  // mismatch would mean a real engine bug, not a data-entry mistake.
  let recomputedHome = 0;
  let recomputedAway = 0;
  for (const p of plays) {
    if (p.playType === "set_score") {
      recomputedHome = p.setScoreHome;
      recomputedAway = p.setScoreAway;
      continue;
    }
    let points = 0;
    let scoringTeam = null;
    if (p.touchdown) {
      points = 6;
      scoringTeam = scoringTeamFor(p);
    } else if (p.playType === "field_goal" && p.result === "good") {
      points = 3;
      scoringTeam = p.possession;
    } else if (p.playType === "extra_point" && p.result === "good") {
      points = 1;
      scoringTeam = p.possession;
    } else if (p.playType === "two_point_conversion" && p.result === "good") {
      points = 2;
      scoringTeam = p.possession;
    } else if (p.playType === "safety") {
      points = 2;
      scoringTeam = scoringTeamFor(p);
    }
    if (scoringTeam === HOME) recomputedHome += points;
    else if (scoringTeam === AWAY) recomputedAway += points;
  }
  if (recomputedHome !== state.homeScore || recomputedAway !== state.awayScore) {
    add("error", `Score mismatch: derived from plays is ${recomputedHome}-${recomputedAway}, but game state shows ${state.homeScore}-${state.awayScore}`, null);
  }

  // Sequence integrity — duplicate or non-monotonic sequence numbers would
  // make replay order ambiguous.
  const sequences = plays.map((p) => p.sequence);
  const seenSequences = new Set();
  for (const seq of sequences) {
    if (seenSequences.has(seq)) add("error", `Duplicate play sequence number (${seq}) — replay order is ambiguous`, null);
    seenSequences.add(seq);
  }

  // Quarter should never decrease as the play log progresses.
  let lastQuarter = 0;
  for (const p of plays) {
    if (p.quarter < lastQuarter) add("warning", `Quarter goes backward on "${p.label}" (Q${lastQuarter} → Q${p.quarter}) — check for a data-entry mistake`, p);
    lastQuarter = Math.max(lastQuarter, p.quarter);
  }

  // Accepted penalty missing its infraction data (defensive check).
  for (const p of plays) {
    if (p.playType === "penalty" && p.accepted && (!p.infraction || typeof p.infraction.yards !== "number")) {
      add("error", `Accepted penalty on "${p.label}" is missing infraction data`, p);
    }
  }

  return issues;
}

/** Accepted penalties are attributed to whichever team was actually
 *  penalized — not whoever currently has the ball, since a defensive
 *  penalty is logged with play.possession still showing the offense. */
function computePenaltyTotals(plays, team) {
  const accepted = plays.filter((p) => p.playType === "penalty" && p.accepted);
  const teamsPenalized = accepted.filter((p) => {
    const penalizedTeam = p.penalizedSide === "offense" ? p.possession : other(p.possession);
    return penalizedTeam === team;
  });
  return { count: teamsPenalized.length, yards: teamsPenalized.reduce((s, p) => s + p.yards, 0) };
}

function buildDefenseProseLine(table, teamLabel, separator) {
  if (!table || table.rows.length === 0) return `${teamLabel}${separator} No stats.`;
  const sorted = [...table.rows].sort((a, b) => b.tackles - a.tackles);
  const parts = sorted.map((r) => {
    let s = `${r.player.fullName} ${r.tackles} tkl`;
    if (r.sacks) s += `, ${r.sacks} sack${r.sacks > 1 ? "s" : ""}`;
    if (r.int) s += `, ${r.int} INT`;
    if (r.ff) s += `, ${r.ff} FF`;
    if (r.fr) s += `, ${r.fr} FR`;
    if (r.td) s += ` ${r.td} TD`;
    return s;
  });
  return `${teamLabel}${separator} ${parts.join(", ")}.`;
}

function buildNewspaperRecap(state, plays, teams, gameTitle, homeStats, awayStats, rushingHome, rushingAway, passingHome, passingAway, receivingHome, receivingAway, defenseHome, defenseAway) {
  const lines = [];
  const winner = state.homeScore === state.awayScore ? null : state.homeScore > state.awayScore ? HOME : AWAY;
  const loser = winner ? other(winner) : null;

  if (winner) {
    lines.push(`${teams[winner].name} ${state[winner === HOME ? "homeScore" : "awayScore"]},`);
    lines.push(`${teams[loser].name} ${state[loser === HOME ? "homeScore" : "awayScore"]}`);
  } else {
    lines.push(`${teams.HOME.name} ${state.homeScore}, ${teams.AWAY.name} ${state.awayScore} (tie)`);
  }
  if (gameTitle.trim()) {
    lines.push("");
    lines.push(`(${gameTitle.trim().toUpperCase()})`);
  }
  lines.push("");

  const linescore = computeLinescore(plays, teams);
  lines.push(`${teams.AWAY.name} ${linescore.AWAY.perQ.join(" ")} -- ${linescore.AWAY.total}`);
  lines.push(`${teams.HOME.name} ${linescore.HOME.perQ.join(" ")} -- ${linescore.HOME.total}`);
  lines.push("");

  const byQuarter = buildScoringPlaysByQuarter(plays, teams);
  for (const q of linescore.quarters) {
    if (!byQuarter[q] || byQuarter[q].length === 0) continue;
    lines.push(QUARTER_WORDS[q] ? `${QUARTER_WORDS[q]} quarter` : `Overtime ${q - 4}`);
    lines.push(...byQuarter[q]);
    lines.push("");
  }

  lines.push("TEAM STATISTICS");
  lines.push(`${"".padEnd(18)}${abbrevFor(teams, AWAY).padStart(6)}${abbrevFor(teams, HOME).padStart(6)}`);
  const statRow = (label, a, h) => lines.push(`${label.padEnd(18)}${String(a).padStart(6)}${String(h).padStart(6)}`);
  statRow("First downs", awayStats.firstDowns, homeStats.firstDowns);
  statRow("Rushes-yards", `${awayStats.rushAttempts}-${awayStats.rushYards}`, `${homeStats.rushAttempts}-${homeStats.rushYards}`);
  statRow("Passing yards", awayStats.passYards, homeStats.passYards);
  statRow("C-A-I", `${awayStats.completions}-${awayStats.passAttempts}-${awayStats.interceptionsThrown}`, `${homeStats.completions}-${homeStats.passAttempts}-${homeStats.interceptionsThrown}`);
  statRow("Total yards", awayStats.totalYards, homeStats.totalYards);
  statRow("Fumbles-lost", `${awayStats.fumblesLost}-${awayStats.fumblesLost}`, `${homeStats.fumblesLost}-${homeStats.fumblesLost}`);
  const penaltiesAway = computePenaltyTotals(plays, AWAY);
  const penaltiesHome = computePenaltyTotals(plays, HOME);
  statRow("Penalties-yards", `${penaltiesAway.count}-${penaltiesAway.yards}`, `${penaltiesHome.count}-${penaltiesHome.yards}`);
  lines.push("");

  lines.push("INDIVIDUAL STATISTICS");
  lines.push("");
  lines.push("RUSHING:");
  lines.push(buildProseStatLine(rushingAway, teams.AWAY.name, ":"));
  lines.push(buildProseStatLine(rushingHome, teams.HOME.name, ","));
  lines.push("");
  lines.push("PASSING:");
  lines.push(buildProseStatLine(passingAway, teams.AWAY.name, ":"));
  lines.push(buildProseStatLine(passingHome, teams.HOME.name, ","));
  lines.push("");
  lines.push("RECEIVING--");
  lines.push(buildProseStatLine(receivingAway, teams.AWAY.name, ","));
  lines.push(buildProseStatLine(receivingHome, teams.HOME.name, ","));
  lines.push("");
  lines.push("DEFENSE--");
  lines.push(buildDefenseProseLine(defenseAway, teams.AWAY.name, ","));
  lines.push(buildDefenseProseLine(defenseHome, teams.HOME.name, ","));

  return lines.join("\n");
}


// ============================================================
// PLAYER RESOLVER — ported from src/parser/playerResolver.ts
// ============================================================

function normalizeRef(s) {
  return s.toLowerCase().replace(/[.,]/g, "").trim();
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}
function similarity(a, b) {
  if (!a.length && !b.length) return 1;
  return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
}
function scorePlayer(reference, player) {
  const norm = normalizeRef(reference);
  const tokens = norm.split(/\s+/).filter(Boolean);
  let score = 0;
  const jerseyToken = tokens.find((t) => /^#?\d+$/.test(t));
  if (jerseyToken) {
    const num = parseInt(jerseyToken.replace("#", ""), 10);
    if (num === player.jerseyNumber) score += 0.75;
  }
  const nameTokens = tokens.filter((t) => !/^#?\d+$/.test(t));
  const firstName = player.firstName.toLowerCase();
  const lastName = player.lastName.toLowerCase();
  const fullName = player.fullName.toLowerCase();
  const aliases = (player.aliases || []).map((a) => a.toLowerCase());
  if (nameTokens.join(" ") === fullName) score += 0.9;
  for (const t of nameTokens) {
    if (t === lastName) score += 0.6;
    else if (t === firstName) score += 0.6;
    else if (aliases.includes(t)) score += 0.6;
    else if (t.length === 1 && t === firstName[0]) score += 0.15;
    else {
      const simLast = similarity(t, lastName);
      const simFirst = similarity(t, firstName);
      if (simLast >= 0.7 && t.length >= 3) score += 0.5 * simLast;
      else if (simFirst >= 0.7 && t.length >= 3) score += 0.2 * simFirst;
    }
  }
  return Math.min(1, score);
}
function resolvePlayer(reference, roster, minScore = 0.55, margin = 0.15) {
  const scored = roster
    .filter((p) => p.active !== false)
    .map((player) => ({ player, confidence: scorePlayer(reference, player) }))
    .filter((m) => m.confidence >= minScore)
    .sort((a, b) => b.confidence - a.confidence);
  if (scored.length === 0) return { status: "none" };
  const top = scored[0];
  const second = scored[1];
  if (!second || top.confidence - second.confidence >= margin) return { status: "unique", match: top };
  const tied = scored.filter((m) => top.confidence - m.confidence < margin);
  return { status: "ambiguous", candidates: tied };
}

// ============================================================
// NL PARSER — ported (subset) from src/parser/nlParser.ts
// ============================================================

function clean(s) {
  return s.replace(/\s+/g, " ").trim();
}

// Strips clauses that restate what the engine already computes from state
// (field position, down/distance) — operators narrate these out of habit,
// and they used to break parsing because they trail the yardage figure.
function stripRedundantSituationalClauses(text) {
  let t = text;
  t = t.replace(/,?\s*\bto\s+(?:the\s+)?(?:own|opp(?:onent)?)\s+\d+\b/gi, "");
  t = t.replace(/,?\s*\bto\s+the\s+\d+\b/gi, "");
  t = t.replace(/,?\s*\b(?:1st|2nd|3rd|4th|first|second|third|fourth)\s*(?:down|&|and)(?:\s*\d+)?(?:\s+long)?(?:\s+now)?\b/gi, "");
  t = t.replace(/,?\s*(?:to\s+)?make[s]?\s+it\s+\d+-\d+\b/gi, "");
  t = t.replace(/,?\s*\breturned\s+to\s+the\s+\d+\b/gi, "");
  return clean(t);
}
function normalizeLossGainPhrasing(text) {
  return text
    .replace(/\bfor\s+a\s+loss\s+of\s+(\d+)\b/gi, "for -$1")
    .replace(/\bfor\s+a\s+gain\s+of\s+(\d+)\b/gi, "for $1")
    .replace(/\ba\s+loss\s+of\s+(\d+)\b/gi, "for -$1")
    .replace(/\ba\s+gain\s+of\s+(\d+)\b/gi, "for $1");
}
function extractTrailingYards(s) {
  const m = s.match(/(-?\d+)\s*(?:yards?|yds?)?\.?\s*$/i);
  if (!m) return { yards: null, remainder: s };
  return { yards: parseInt(m[1], 10), remainder: s.slice(0, m.index).trim() };
}
// Finds "for N (yards)?" / "gains N" ANYWHERE in the string, not just at
// the end — the old version broke the moment any clause followed the
// yardage figure (e.g. "...for 22 yards to the own 47, first down").
function extractYards(text) {
  const anchored = text.match(/\b(?:for|gains?|of)\s+(-?\d+)\s*(?:yards?|yds?)?\b/i);
  if (anchored) {
    const yards = parseInt(anchored[1], 10);
    const remainder = clean(text.slice(0, anchored.index) + " " + text.slice(anchored.index + anchored[0].length));
    return { yards, remainder };
  }
  const loses = text.match(/\bloses\s+(-?\d+)\s*(?:yards?|yds?)?\b/i);
  if (loses) {
    const yards = -Math.abs(parseInt(loses[1], 10));
    const remainder = clean(text.slice(0, loses.index) + " " + text.slice(loses.index + loses[0].length));
    return { yards, remainder };
  }
  return extractTrailingYards(text);
}
function resolveSlot(reference, roster) {
  const res = resolvePlayer(reference, roster);
  if (res.status === "unique") return { player: res.match.player, confidence: res.match.confidence };
  if (res.status === "ambiguous") return { error: { rawReference: reference, candidates: res.candidates } };
  return { confidence: 0 };
}

function parsePlayCommand(input, offenseRoster, defenseRoster) {
  const raw = input;
  const text = normalizeLossGainPhrasing(stripRedundantSituationalClauses(clean(input)));
  const lower = text.toLowerCase();

  if (/\bfield goal\b|\bfg\b/i.test(text)) {
    const good = /\bgood\b/i.test(text) && !/\bno good\b|\bnot good\b/i.test(text);
    const blocked = /\bblocked\b/i.test(text);
    const distMatch = text.match(/(\d+)\s*(?:yard|yd)/i) || text.match(/from\s+(\d+)/i);
    let kickerRef = clean(text.replace(/field goal|fg|good|no good|blocked|from\s+\d+|\d+\s*(?:yard|yds?)/gi, ""));
    let kicker = kickerRef ? resolveSlot(kickerRef, offenseRoster) : { confidence: 1 };
    if (kicker.error) return { status: "ambiguous_player", disambiguation: kicker.error, summary: `Which player: "${kickerRef}"?`, rawInput: raw };
    return {
      status: "ok",
      command: { type: "field_goal", result: blocked ? "blocked" : good ? "good" : "no_good", kickerId: kicker.player?.id },
      confidence: Math.min(kicker.confidence || 1, 0.95),
      summary: `Field goal ${blocked ? "BLOCKED" : good ? "GOOD" : "no good"}${distMatch ? ` from ${distMatch[1]}` : ""}`,
      rawInput: raw,
    };
  }

  if (/\bpat\b|\bextra point\b/i.test(text)) {
    const blocked = /\bblocked\b/i.test(text);
    const good = /\bgood\b/i.test(text) && !blocked;
    const kickerRef = clean(text.replace(/\bpat\b|\bextra point\b|\bgood\b|\bno good\b|\bblocked\b/gi, ""));
    let kicker = kickerRef ? resolveSlot(kickerRef, offenseRoster) : { confidence: 1 };
    if (kicker.error) return { status: "ambiguous_player", disambiguation: kicker.error, summary: `Which player: "${kickerRef}"?`, rawInput: raw };
    return {
      status: "ok",
      command: { type: "extra_point", result: blocked ? "blocked" : good ? "good" : "no_good", kickerId: kicker.player?.id },
      confidence: Math.min(kicker.confidence || 1, 0.95),
      summary: `PAT ${good ? "GOOD" : blocked ? "BLOCKED" : "no good"}${kicker.player ? ` (${kicker.player.fullName})` : ""}`,
      rawInput: raw,
    };
  }

  if (/\btwo[\s-]?point\b|\bfor two\b/i.test(text)) {
    const good = !/\b(no good|failed|missed)\b/i.test(text);
    return { status: "ok", command: { type: "two_point_conversion", result: good ? "good" : "no_good" }, confidence: 0.85, summary: `Two-point conversion ${good ? "GOOD" : "no good"}`, rawInput: raw };
  }

  if (/\bpunt(s|ed)?\b/i.test(text) && !/\bkick(off|ed)?\b/i.test(text)) {
    const distMatch = text.match(/punts?\s+(?:for\s+)?(\d+)/i);
    const retMatch = text.match(/return(?:ed)?\s+(\d+)/i);
    const puntDistance = distMatch ? parseInt(distMatch[1], 10) : 40;
    const puntReturnYards = retMatch ? parseInt(retMatch[1], 10) : 0;
    return {
      status: "ok",
      command: { type: "punt", yards: puntDistance - puntReturnYards },
      confidence: 0.85,
      summary: `Punt ${puntDistance} yards${retMatch ? `, returned ${puntReturnYards}` : ""}`,
      rawInput: raw,
    };
  }

  if (/\bintercept(ed|s|ion)?\b|\bpick(s|ed)?\s+off\b|\bthrows? a pick\b|\bpick[\s-]six\b/i.test(lower)) {
    let m = text.match(/^(.+?)\s+intercepted\s+by\s+(.+)$/i);
    let passerRef = null, interceptorRef = null;
    if (m) { passerRef = clean(m[1]); interceptorRef = clean(m[2]); }
    else if ((m = text.match(/^(.+?)\s+intercepts?\s+(.+)$/i))) { interceptorRef = clean(m[1]); passerRef = clean(m[2]); }
    else if ((m = text.match(/^(.+?)\s+throws?\s+a\s+pick\s+to\s+(.+)$/i))) { passerRef = clean(m[1]); interceptorRef = clean(m[2]); }

    const passer = passerRef ? resolveSlot(passerRef, offenseRoster) : { confidence: 1 };
    if (passer.error) return { status: "ambiguous_player", disambiguation: passer.error, summary: `Which player: "${passerRef}"?`, rawInput: raw };
    const interceptor = interceptorRef ? resolveSlot(interceptorRef, defenseRoster) : { confidence: 1 };
    if (interceptor.error) return { status: "ambiguous_player", disambiguation: interceptor.error, summary: `Which player: "${interceptorRef}"?`, rawInput: raw };

    const touchdownAsserted = /\btouchdown\b|\btd\b|\bpick[\s-]six\b/i.test(lower);
    const retMatch = text.match(/return(?:ed|s)?\s+(?:it\s+)?(\d+)\s*(?:yards?|yds?)?/i);
    const returnYards = retMatch ? parseInt(retMatch[1], 10) : 0;

    return {
      status: "ok",
      command: { type: "interception", passerId: passer.player?.id, interceptedById: interceptor.player?.id, yards: returnYards, touchdownAsserted },
      confidence: Math.min(passer.confidence || 1, interceptor.confidence || 1),
      summary: `Interception${interceptor.player ? ` by ${interceptor.player.fullName}` : ""}${returnYards ? `, returned ${returnYards} yards` : ""}${touchdownAsserted ? " — TOUCHDOWN" : ""}`,
      rawInput: raw,
    };
  }

  if (/\bsack(ed|s)?\b/i.test(lower)) {
    const { yards: extractedYards } = extractYards(text);
    let m = text.match(/^(.+?)\s+sacks?\s+(.+?)(?:\s+for\s+-?\d+.*)?$/i);
    let defenderRef = null, passerRef = null, yards = extractedYards !== null ? -Math.abs(extractedYards) : null;
    if (m) { defenderRef = clean(m[1]); passerRef = clean(m[2]); }
    else if ((m = text.match(/^(.+?)\s+sacked\b/i))) { passerRef = clean(m[1]); }

    const passer = passerRef ? resolveSlot(passerRef, offenseRoster) : { confidence: 1 };
